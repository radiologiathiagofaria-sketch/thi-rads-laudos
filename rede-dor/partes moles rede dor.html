<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partes Moles — Laudos Estruturados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Paleta alinhada ao app obstétrico (slate escuro + ciano) ===== */
:root{
  --blue:#0e6a83;--blue-dark:#0c566b;--blue-light:#d3e6ec;--blue-mid:#c0dce5;
  --surface:#e1e6ee;--border:#c9d1de;--border-strong:#9eacc2;
  --text:#1b2538;--text-2:#34425b;--text-3:#5c6a83;
  --white:#f3f5f9;--green:#047857;--red:#c93a3a;--radius:10px;--radius-lg:14px;
  --hover:#dfeaf0;--sel-bg:#cbe3ec;--focus-ring:rgba(14,106,131,.22);
}
body.dark{
  --blue:#2fa9c2;--blue-dark:#2490a8;--blue-light:#12293d;--blue-mid:#12293d;
  --surface:#090e19;--border:#1a263b;--border-strong:#33445f;
  --text:#c9d2e0;--text-2:#a3afc4;--text-3:#7a879f;
  --white:#0e1626;--green:#2fbf8c;--red:#e07a7a;
  --hover:#13203a;--sel-bg:#12324a;--focus-ring:rgba(47,169,194,.28);
}
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:var(--white);border-left-color:var(--border);}
body.dark .laudo-body{background:var(--white);}
body.dark .laudo-header{background:var(--white);border-bottom-color:var(--border);}
@media print{
  body.dark .laudo-doc,
  body.dark .laudo-doc *{color:#111 !important;}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ----- Barra superior ----- */
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;gap:10px;height:58px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:14px;}
.logo-name{font-size:20px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:13px;color:var(--text-3);font-weight:400;}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border-strong);font-weight:500;transition:all .13s;background:var(--white);color:var(--text);}
.btn:hover{background:var(--hover);border-color:var(--blue);color:var(--blue);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
body.dark .btn-primary{color:#06202b;}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
body.dark .btn-primary:hover{color:#06202b;}
.btn-danger{background:#f6e6e8;color:var(--red);border-color:#e3a9ad;}
body.dark .btn-danger{background:#2d1a1f;border-color:#7a3038;}
.btn-danger:hover{background:#fee2e2;border-color:#f87171;color:var(--red);}
body.dark .btn-danger:hover{background:#3a2026;}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.btn-dark{margin-left:auto;}
.btn:focus-visible,.nav-item:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.body{display:flex;flex:1;overflow:hidden;}

/* ----- Coluna esquerda: navegação ----- */
.sidebar{width:208px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:16px 16px 14px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
.sidebar-titulo{font-size:19px;font-weight:600;color:var(--text);}
.nav-group{padding:8px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:3px solid transparent;line-height:1.25;}
.nav-item:hover{background:var(--hover);color:var(--text);}
.nav-item.active{background:var(--sel-bg);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}

/* ----- Coluna central: formulário ----- */
.panel{width:560px;flex-shrink:0;overflow-y:auto;padding:18px 18px 26px;background:var(--surface);}
.panel .doc-p{font-size:14px !important;}
.sec-title{font-size:19px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:9px;}
.sec-title::before{content:'';display:block;width:4px;height:22px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:14px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;padding:11px 16px 10px;border-bottom:1px solid var(--border);background:var(--white);}
body.dark .block-title{border-bottom-color:var(--border);}

.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:var(--hover);}
.radio-opt.selected{background:var(--sel-bg);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-size:15px;color:var(--text);line-height:1.4;cursor:pointer;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:600;}
.radio-mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
body.dark .radio-mark::after{background:#06202b;}
.radio-opt.selected .radio-mark::after{opacity:1;}

.check-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:var(--hover);}
.check-row.selected{background:var(--sel-bg);}
.check-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
.check-label{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px 11px 34px;font-size:14.5px;color:var(--text);cursor:pointer;}
.check-row.selected .check-label{color:var(--blue);font-weight:600;}
.check-box{width:19px;height:19px;border-radius:5px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:12px;height:12px;}
.check-row.selected .check-box svg{display:block;}
body.dark .check-box svg{stroke:#06202b;}
.sel-tag{font-size:13px;border:1px solid var(--border-strong);border-radius:6px;padding:4px 8px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:6px;cursor:pointer;}

.dim-rows{padding:12px 16px;display:flex;flex-direction:column;gap:9px;}
.dim-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.dim-lbl{flex:1;font-size:14.5px;color:var(--text);}
.dim-input{width:76px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:14.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
.dim-unit{font-size:14px;color:var(--text-3);}
.nodulo-wrap{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}

.btn-add-lesao{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:600;transition:all .12s;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);width:100%;justify-content:center;}
.btn-add-lesao:hover{background:var(--sel-bg);}
.lesao-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px;margin-bottom:10px;}
.lesao-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.lesao-hd-title{font-size:13px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;}
.btn-rem{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;border:1px solid #e3a9ad;background:#f6e6e8;color:var(--red);transition:all .12s;}
body.dark .btn-rem{background:#2d1a1f;border-color:#7a3038;}
.btn-rem:hover{background:#fee2e2;}
body.dark .btn-rem:hover{background:#3a2026;}

.ff-grid{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:8px;}
.ff{display:flex;flex-direction:column;gap:4px;}
.ff label{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.ff select,.ff input[type=text],.ff input[type=number]{font-size:14px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:7px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);}
.ff select:focus,.ff input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
.ff input[type=text],.ff input[type=number]{width:68px;text-align:center;}
.inline-select{font-size:14px;padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:5px;}
.inline-select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
.inline-num{width:60px;font-size:14px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:7px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);text-align:center;margin:0 2px;}
.inline-num:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
body.dark .sub-opts{background:var(--hover);border-bottom-color:var(--border);}
.sub-opt-label{color:var(--text-2);}
body.dark .sub-opt-label{background:var(--white);color:var(--text);}
.panel select option{background:var(--white);color:var(--text);}

/* ----- Coluna direita: LAUDO (fonte e estrutura preservadas) ----- */
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
.doc-cont{margin-left:14px;}
.laudo-doc:focus { outline: none; }

.toast-notification{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--white);font-size:12.5px;font-weight:500;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:999;}
.toast-notification.show{opacity:1;transform:translateX(-50%) translateY(0);}
body.dark .toast-notification{background:#3a4155;color:#e2e6f0;}

/* --- CUSTOM COMPONENTS RESTORED --- */
body.dark .btn-dark {background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover {background:#343a4d;color:#fff;}
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text],body.dark .ff input[type=number] {background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .toolbar {background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar {background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd {border-bottom-color:var(--border);}
body.dark .radio-opt:hover {background:#1e2d4a;}
body.dark .radio-opt.selected {background:#1e2d4a;}
body.dark .check-row {background:#1a1f2e;}
body.dark .check-row:hover {background:#1e2d4a;}
body.dark .check-row.selected {background:#1e2d4a;}
body.dark .sel-tag {background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .sub-fields {background:#1a2040;border-top:1px solid #2a3460;}
.sub-fields {display:none;padding:8px 14px 10px 40px;background:#eef3ff;border-top:1px solid #d0dcff;gap:8px;flex-direction:column;}
.check-row.selected .sub-fields {display:flex;}
.sub-row {display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sub-lbl {font-size:11px;color:var(--text-2);}
.sel-tag:focus {outline:none;border-color:var(--blue);}
.dim-input-sm {width:52px;}
.vol-span {font-size:11px;color:var(--text-3);font-style:italic;}
.textarea-field {width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--white);resize:none;height:90px;line-height:1.5;}
.textarea-field:focus {outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
body.dark .textarea-field {background:var(--white);color:var(--text);border-color:var(--border-strong);}
.ta-wrap {padding:10px 14px;}


/* --- FIX TEXTAREA --- */
textarea { background: var(--white); color: var(--text); }
body.dark textarea { background: var(--white); color: var(--text); border-color: var(--border-strong); }
</style>

</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-rede-dor.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <button class="btn" onclick="window.location.href='../laudo-rede-dor.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>
  <div class="tb-sep"></div>

  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>

  <button class="btn btn-danger" onclick="reiniciar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 1.5-3.9M2 4v4h4"/></svg>Reiniciar</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd">
      <div class="sidebar-tipo">Ultrassonografia</div>
      <div class="sidebar-titulo">Partes Moles</div>
    </div>
    <div class="nav-group">
      <div class="nav-item" id="nav-area" onclick="showSection('area')"><span class="nav-dot"></span>Área Examinada</div>
      <div class="nav-item" id="nav-tipo" onclick="showSection('tipo')"><span class="nav-dot"></span>Tipo de Achado</div>
      <div class="nav-item" id="nav-pele" onclick="showSection('pele')"><span class="nav-dot"></span>Pele e Subcutâneo</div>
      <div class="nav-item" id="nav-muscular" onclick="showSection('muscular')"><span class="nav-dot"></span>Plano Muscular</div>

    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

let secaoAtual = '';

function showSection(sec) {
  secaoAtual = sec;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + sec);
  if (nav) nav.classList.add('active');

}

function renderPanel() {
  const panel = document.getElementById('main-panel');
  switch(secaoAtual) {
    case 'area':     panel.innerHTML = renderAreaHtml(); break;
    case 'tipo':     panel.innerHTML = renderTipoHtml(); break;
    case 'pele':     panel.innerHTML = renderPeleHtml(); break;

    case 'achados':  panel.innerHTML = renderAchadosHtml(); break;
  }
  bindEvents();
  updateLaudo();
}

// ── HELPERS ──
function calcVol(m1, m2, m3) {
  const v = parseFloat(m1) * parseFloat(m2) * parseFloat(m3) * 0.52;
  if (isNaN(v)) return '0,0';
  return v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}

function tratarFloat(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = parseFloat(String(v).replace(',', '.'));
  if (isNaN(n) || n <= 0) return null;
  return n.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:2});
}

// ── HELPERS "SEGUROS" PARA O LAUDO FINAL ──
// Nunca geram medidas com placeholder "_" nem volume "0,0 cm³" quando os
// dados não estão completos. Usados exclusivamente na montagem do texto do
// laudo (a pré-visualização dos campos internos pode continuar mostrando
// "0,0" enquanto o usuário digita, sem impacto no laudo final).
function medStrSeguro(m1, m2, m3) {
  const vals = [m1, m2, m3].map(tratarFloat).filter(Boolean);
  if (vals.length === 0) return '';
  return vals.join(' x ') + ' cm';
}
function calcVolSeguro(m1, m2, m3) {
  const num = x => { const n = parseFloat(String(x == null ? '' : x).replace(',', '.')); return (isNaN(n) || n <= 0) ? null : n; };
  const a = num(m1), b = num(m2), c = num(m3);
  if (!a || !b || !c) return null;
  const v = a * b * c * 0.52;
  const casas = v < 1 ? 2 : 1;   // volumes < 1 cm³ não podem aparecer como "0,0"
  if (v < 0.01) return null;     // volume desprezível: não escreve "0,00 cm³"
  return v.toLocaleString('pt-BR', {minimumFractionDigits: casas, maximumFractionDigits: casas});
}
function maxMed(...vals) {
  const nums = vals.map(v => parseFloat(String(v||'').replace(',','.'))).filter(n => !isNaN(n));
  return nums.length ? Math.max(...nums) : 0;
}

function toggleTipo(key) {
  if (key === 'normal') {
    const novo = !estado.tipo.normal;
    Object.keys(estado.tipo).forEach(k => { if (typeof estado.tipo[k] === 'boolean') estado.tipo[k] = false; });
    estado.tipo.normal = novo;
  } else {
    estado.tipo[key] = !estado.tipo[key];
    if (estado.tipo[key]) estado.tipo.normal = false;
  }
  renderPanel();
}

// ── UTILITÁRIOS DE TEXTO ──
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function juntar(arr) {
  return arr.length <= 1 ? arr.join('') : arr.slice(0, -1).join(', ') + ' e ' + arr[arr.length - 1];
}
function semPrefixo(s, re) { return String(s || '').trim().replace(re, ''); }
function comPrep(s) {
  s = String(s || '').trim();
  if (!s) return '';
  return /^(na|no|nas|nos|em|junto|próximo|proximo|entre|sobre|sob|ao|à|adjacente)(\s|$)/i.test(s) ? s : 'em ' + s;
}
function locJoin(locP, anat) {
  const a = String(anat || '').trim();
  return [locP, a ? esc(a) : ''].filter(Boolean).join(', ');
}
function cap1(str) {
  if (!str) return str;
  const i = str.search(/[a-zà-öø-ÿ]/i);
  if (i === -1) return str;
  return str.slice(0, i) + str.charAt(i).toUpperCase() + str.slice(i + 1);
}
function lat(v) {
  return v === 'direita' ? ' à direita' : v === 'esquerda' ? ' à esquerda' : v === 'bilateral' ? ' bilateral' : '';
}
function planoPorLoc(loc) {
  if (loc === 'pele' || loc === 'subcutaneo') return 'pele';
  if (loc === 'intramuscular' || loc === 'intermuscular' || loc === 'fascial') return 'musc';
  return null;
}
function item(cat, plano, proprio, desc, imp) { return {cat, plano, proprio, desc, imp}; }

// Avalia sinais de alerta (red flags) de uma massa/nódulo, sem gerar
// automaticamente um diagnóstico definitivo — apenas orienta o grau de
// suspeição usado para escolher a linguagem da conclusão.
function avaliarFlagsMassa(m) {
  const flags = [];
  const dmax = maxMed(m.med1, m.med2, m.med3);
  if (['intramuscular','intermuscular','fascial','justacortical'].includes(m.loc)) flags.push('localização profunda');
  if (dmax >= 5) flags.push('maior dimensão ≥ 5 cm');
  if (m.margens === 'infiltrativas') flags.push('margens infiltrativas');
  if (m.margens === 'indistintas') flags.push('margens indistintas');
  if (m.ecogenicidade === 'heterogenea' || m.arquitetura === 'heterogenea') flags.push('heterogeneidade importante');
  if (m.doppler === 'interna' || m.doppler === 'internaEPeriferica') flags.push('vascularização interna');
  if (m.cistico === 'necrose') flags.push('componente necrótico/liquefeito');
  if (m.relacao === 'invasao') flags.push('invasão de estruturas adjacentes');
  if (m.relacao === 'deslocamento') flags.push('deslocamento de estruturas adjacentes');
  if (m.crescimento) flags.push('crescimento/alteração referida pelo paciente');
  if (estado.tipo.calcificacao && flags.length > 0) flags.push('calcificação associada');
  return flags;
}

function gerarBlocoMassa() {
  const m = estado.massa;
  const ms = medStrSeguro(m.med1, m.med2, m.med3);
  const vol = calcVolSeguro(m.med1, m.med2, m.med3);
  const med = ms ? `, medindo ${ms}${vol ? ` (volume estimado de ${vol} cm³)` : ''}` : '';
  const locTxt = locJoin(TXT.locMassa[m.loc], m.anat);
  const loc = locTxt ? `, localizada ${locTxt}` : '';
  const desc = `Identifica-se formação nodular/expansiva de partes moles${loc}, de morfologia ${TXT.morfo[m.morfologia]}, orientação ${TXT.orient[m.orientacao]}, margens ${TXT.margens[m.margens]}, ecogenicidade ${TXT.ecog[m.ecogenicidade]} e arquitetura ${TXT.arq[m.arquitetura]}${TXT.cistico[m.cistico]}${med}, ${TXT.dopMassa[m.doppler]}, ${TXT.compr[m.compressibilidade]}, ${TXT.relacao[m.relacao]}${m.crescimento ? ', com crescimento/alteração referida pelo paciente' : ''}.`;

  const flags = avaliarFlagsMassa(m);
  const refer = TXT.locMassa[m.loc] ? ' ' + TXT.locMassa[m.loc] : ' de partes moles';
  const size = ms ? `, medindo ${ms}` : '';
  // O rótulo "aspecto típico de lipoma" só vale se os demais campos forem coerentes com lipoma.
  const lipomaCoerente = m.lipomaTipico && flags.length === 0 && m.ecogenicidade === 'hiperecoica'
    && m.arquitetura === 'homogenea' && m.orientacao === 'paralela' && m.margens === 'circunscritas' && m.doppler === 'sem';
  let imp;
  if (lipomaCoerente) {
    imp = `Formação nodular${refer}${size}, com aspecto ultrassonográfico sugestivo de lipoma.`;
  } else if (m.lipomaTipico) {
    imp = `Formação nodular${refer}${size}, de características ultrassonográficas indeterminadas.`;
  } else if (m.margens === 'infiltrativas' || m.relacao === 'invasao' || flags.length >= 2) {
    imp = `Massa de partes moles${refer === ' de partes moles' ? '' : refer}${size}, de características ultrassonográficas indeterminadas/suspeitas, recomendando-se complementação por ressonância magnética para melhor caracterização, conforme contexto clínico.`;
  } else if (flags.length === 1) {
    imp = `Formação nodular${refer}${size}, de características indeterminadas, sugerindo-se correlação clínica e, conforme evolução, complementação por ressonância magnética.`;
  } else {
    imp = `Formação nodular${refer}${size}, de aspecto indeterminado, podendo-se considerar acompanhamento clínico-ultrassonográfico ou complementação diagnóstica conforme indicação médica.`;
  }
  return item('massa', planoPorLoc(m.loc), false, desc, imp);
}

function gerarBlocoColecao() {
  const c = estado.colecaoG;
  const ms = medStrSeguro(c.med1, c.med2, c.med3);
  const vol = calcVolSeguro(c.med1, c.med2, c.med3);
  const med = ms ? `, medindo ${ms}${vol ? `, com volume estimado de ${vol} cm³` : ''}` : '';
  const dis = tratarFloat(c.dis) ? `, distando cerca de ${tratarFloat(c.dis)} cm da pele` : '';
  const extras = [];
  if (c.septacoes) extras.push('septações internas');
  if (c.debris && c.conteudo !== 'debris') extras.push('debris');
  if (c.ecosMoveis) extras.push('ecos internos móveis');
  if (c.coagulos) extras.push('coágulos de permeio');
  if (c.gas && c.conteudo !== 'gas') extras.push('focos de gás');
  if (c.nivelLL) extras.push('nível líquido-líquido');
  const extraTxt = extras.length ? `, com ${extras.join(', ')}` : '';
  const locTxt = locJoin(TXT.locCol[c.loc], c.anat);
  const loc = locTxt ? ` localizada ${locTxt}` : '';
  const ctx = TXT.contextoCol[c.contexto] ? `, ${TXT.contextoCol[c.contexto]}` : '';
  const desc = `Coleção líquida${loc}, de paredes ${c.espessura} e ${c.regularidade}, conteúdo ${TXT.conteudoCol[c.conteudo]}${extraTxt}${med}${dis}, ${TXT.dopCol[c.doppler]}${ctx}.`;

  const base = `Coleção líquida${TXT.locCol[c.loc] ? ' ' + TXT.locCol[c.loc] : ''}${ms ? `, medindo ${ms}` : ''}`;
  const criterios = c.contexto === 'inflamatorioInfeccioso' && (c.regularidade === 'irregulares' || c.espessura === 'espessas') && (c.gas || c.debris || c.conteudo === 'gas' || c.conteudo === 'debris' || c.conteudo === 'heterogeneo' || c.conteudo === 'espesso' || c.doppler === 'hiperemiaPeriferica');
  let imp;
  if (criterios) imp = `${base}, com achados sugestivos de processo inflamatório/infeccioso (podendo corresponder a abscesso), conforme contexto clínico e laboratorial.`;
  else if (c.contexto === 'inflamatorioInfeccioso') imp = `${base}, podendo se relacionar a processo inflamatório/infeccioso, conforme contexto clínico.`;
  else imp = `${base}${TXT.contextoCol[c.contexto] ? ', ' + TXT.contextoCol[c.contexto] : ''}.`;
  return item('col', planoPorLoc(c.loc), false, desc, imp);
}

function gerarBlocoHematoma() {
  const h = estado.hematoma;
  const ms = medStrSeguro(h.med1, h.med2, h.med3);
  const vol = calcVolSeguro(h.med1, h.med2, h.med3);
  const med = ms ? `, medindo ${ms}${vol ? `, com volume estimado de ${vol} cm³` : ''}` : '';
  const extras = [];
  if (h.septacoes) extras.push('septações');
  if (h.coagulos) extras.push('coágulos');
  if (h.debris) extras.push('debris');
  const extraTxt = extras.length ? `, com ${extras.join(', ')}` : '';
  const locTxt = locJoin(TXT.locHemat[h.loc], h.anat);
  const loc = locTxt ? ` localizada ${locTxt}` : '';
  const desc = `Coleção${loc}, de conteúdo ${TXT.conteudoHemat[h.conteudo]}${extraTxt}${med}, de aspecto ${TXT.aspectoHemat[h.aspecto]}, ${TXT.dopHemat[h.doppler]}.`;
  const imp = `Coleção${TXT.locHemat[h.loc] ? ' ' + TXT.locHemat[h.loc] : ''}${ms ? `, medindo ${ms},` : ''} com características compatíveis com hematoma ${TXT.aspectoHemat[h.aspecto]}.`;
  return item('col', planoPorLoc(h.loc), false, desc, imp);
}

function gerarBlocoLesaoMuscular() {
  const l = estado.lesaoMuscular;
  const nome = TXT.nomeLes[l.tipoLesao];
  const nomeMus = semPrefixo(l.musculo, /^m[uú]sculo\s+/i);
  const alvo = nomeMus ? `do músculo ${esc(nomeMus)}` : 'do músculo avaliado';
  const loc = TXT.locLes[l.localizacao] ? `, ${TXT.locLes[l.localizacao]}` : '';
  const ruptura = ['parcial','completa','desinsercao','avulsao'].includes(l.tipoLesao);
  const rupturaTotal = ['completa','desinsercao','avulsao'].includes(l.tipoLesao);
  const dims = [];
  if (tratarFloat(l.extLong)) dims.push(`extensão longitudinal de ${tratarFloat(l.extLong)} cm`);
  if (tratarFloat(l.extTransv)) dims.push(`extensão transversal de ${tratarFloat(l.extTransv)} cm`);
  if (tratarFloat(l.profundidade)) dims.push(`profundidade de ${tratarFloat(l.profundidade)} cm`);
  const dimTxt = dims.length ? `, com ${juntar(dims)}` : '';
  // Gap/retração só fazem sentido em rupturas; preservação de fibras não se aplica a ruptura total.
  const gapTxt = (ruptura && tratarFloat(l.gap)) ? `, com gap/diástase de ${tratarFloat(l.gap)} cm entre os cotos` : '';
  const extras = [];
  if (rupturaTotal && l.retracao) extras.push('retração das extremidades musculares');
  if (!rupturaTotal && l.preservacaoParcial) extras.push('preservação parcial das fibras musculares');
  if (l.hematomaAssoc) extras.push('hematoma associado');
  if (l.colecaoAssoc) extras.push('coleção associada');
  const extraTxt = extras.length ? ` Nota-se ainda ${juntar(extras)}.` : '';
  const desc = `Observa-se ${nome} ${alvo}${loc}${dimTxt}${gapTxt}.${extraTxt}`;
  const assoc = [];
  if (l.hematomaAssoc) assoc.push('hematoma associado');
  if (l.colecaoAssoc) assoc.push('coleção associada');
  const imp = `${cap1(nome)} ${alvo}${assoc.length ? ', com ' + juntar(assoc) : ''}.`;
  return item('musc', null, true, desc, imp);
}

function gerarBlocoTendao() {
  const t = estado.tendao;
  const nomeT = semPrefixo(t.nome, /^tend[aã]o\s+/i);
  const nome = nomeT ? esc(nomeT) : 'avaliado';
  const esp = tratarFloat(t.espessura) ? `, espessura de ${tratarFloat(t.espessura)} cm` : '';
  const extras = [];
  if (t.tendinose) extras.push('tendinose');
  if (t.calcificacao) extras.push('calcificação');
  if (t.liquidoBainha) extras.push('líquido na bainha tendínea');
  if (t.hiperemia) extras.push('hiperemia ao Doppler');
  if (t.alteracaoInsercional) extras.push('alteração insercional');
  const extraTxt = extras.length ? `, com ${juntar(extras)}` : '';
  const retr = (t.lesao === 'completa' && t.retracao) ? ' e retração das extremidades' : '';
  const lesaoTxt = t.lesao === 'completa' ? `com ruptura completa${retr}` : t.lesao === 'parcial' ? 'com lesão parcial' : 'sem sinais de lesão';
  const desc = `Tendão ${nome} com ecotextura ${TXT.ecotextTend[t.ecotextura]} e padrão fibrilar ${TXT.fibrilarTend[t.padraoFibrilar]}${esp}${extraTxt}, ${lesaoTxt}.`;

  const alt = [];
  if (t.tendinose) alt.push('tendinose');
  if (t.calcificacao) alt.push('calcificação');
  if (t.liquidoBainha) alt.push('líquido na bainha');
  if (t.hiperemia) alt.push('hiperemia ao Doppler');
  if (t.alteracaoInsercional) alt.push('alteração insercional');
  if (t.ecotextura !== 'normal') alt.push('ecotextura heterogênea');
  if (t.padraoFibrilar !== 'preservado') alt.push('perda do padrão fibrilar');
  let imp;
  if (t.lesao === 'completa') imp = `Ruptura completa do tendão ${nome}${retr}.`;
  else if (t.lesao === 'parcial') imp = `Lesão parcial do tendão ${nome}${alt.length ? ', com ' + juntar(alt) : ''}.`;
  else if (alt.length) imp = `Tendão ${nome} com ${juntar(alt)}.`;
  else imp = `Tendão ${nome} de aspecto ecográfico preservado.`;
  return item('outros', null, false, desc, imp);
}

function gerarBlocoLinfonodo() {
  const n = estado.linfonodo;
  const regiao = String(n.regiao || '').trim() ? ` em cadeia ${esc(String(n.regiao).trim())}` : '';
  const dims = [];
  if (tratarFloat(n.eixoLongo)) dims.push(`maior eixo de ${tratarFloat(n.eixoLongo)} cm`);
  if (tratarFloat(n.eixoCurto)) dims.push(`eixo curto de ${tratarFloat(n.eixoCurto)} cm`);
  const dimTxt = dims.length ? (n.quantidade === 'multiplos' ? `, o maior com ${juntar(dims)}` : `, com ${juntar(dims)}`) : '';
  const extras = [];
  if (n.necrose) extras.push('necrose');
  if (n.calcificacoes) extras.push('calcificações');
  if (n.conglomerado) extras.push('conglomerado linfonodal');
  if (n.alteracoesPerinodais) extras.push('alterações perinodais');
  const extraTxt = extras.length ? `, com ${juntar(extras)}` : '';
  const base = `${TXT.quantLinf[n.quantidade]}${regiao}${lat(n.lateralidade)}`;
  const desc = `${base}, de formato ${TXT.formatoLinf[n.formato]}, hilo ${TXT.hiloLinf[n.hilo]}, ${TXT.corticalLinf[n.corticalEsp]}${dimTxt}, ${TXT.dopLinf[n.doppler]}${extraTxt}.`;

  const atip = [];
  if (n.hilo === 'naoCaracterizado') atip.push('hilo não caracterizado');
  if (n.corticalEsp !== 'ausente') atip.push('espessamento cortical');
  if (n.necrose) atip.push('necrose');
  if (n.calcificacoes) atip.push('calcificações');
  if (n.conglomerado) atip.push('conglomerado linfonodal');
  if (n.alteracoesPerinodais) atip.push('alterações perinodais');
  const imp = atip.length
    ? `${base}, com alterações morfológicas inespecíficas/atípicas (${juntar(atip)}), recomendando-se correlação clínico-laboratorial e, conforme contexto, investigação complementar.`
    : `${base}, de características morfológicas habituais.`;
  return item('massa', null, false, desc, imp);
}

function gerarBlocoCorpoEstranho() {
  const c = estado.corpoEstranho;
  const locP = comPrep(c.loc);
  const loc = locP ? `, localizado ${esc(locP)}` : '';
  const dist = tratarFloat(c.distPele) ? `, distando ${tratarFloat(c.distPele)} cm da pele` : '';
  const comp = tratarFloat(c.comprimento) ? `, medindo cerca de ${tratarFloat(c.comprimento)} cm` : '';
  const extras = [];
  if (c.relMusculo) extras.push('relação com o plano muscular');
  if (c.relTendao) extras.push('relação com estrutura tendínea');
  if (c.relVaso) extras.push('relação com estrutura vascular');
  if (c.halo) extras.push('halo inflamatório periférico');
  if (c.colecaoAssoc) extras.push('coleção associada');
  if (c.hiperemia) extras.push('hiperemia periférica ao Doppler');
  if (c.sombra) extras.push('sombra acústica posterior');
  const extraTxt = extras.length ? `, com ${juntar(extras)}` : '';
  const desc = `Corpo estranho de aspecto compatível com ${TXT.tipoCE[c.tipo]}${loc}${dist}${comp}, de orientação ${TXT.orientCE[c.orientacao]}${extraTxt}.`;
  const compl = [];
  if (c.halo || c.hiperemia) compl.push('reação inflamatória adjacente');
  if (c.colecaoAssoc) compl.push('coleção associada');
  if (c.relTendao) compl.push('relação com estrutura tendínea');
  if (c.relVaso) compl.push('relação com estrutura vascular');
  const imp = `Corpo estranho de aspecto compatível com ${TXT.tipoCE[c.tipo]}${locP ? ', localizado ' + esc(locP) : ' em partes moles'}${comp}${compl.length ? ', com ' + juntar(compl) : ''}.`;
  return item('outros', null, false, desc, imp);
}

function gerarBlocoHernia() {
  const h = estado.hernia;
  const aplicaLat = ['inguinal','incisional','outra'].includes(h.regiao);
  const latTxt = aplicaLat ? lat(h.lateralidade) : '';
  const reg = TXT.regiaoHernia[h.regiao] ? ` ${TXT.regiaoHernia[h.regiao]}` : '';
  const colo = tratarFloat(h.colo) ? `, com colo/defeito medindo ${tratarFloat(h.colo)} cm` : '';
  const din = [];
  if (h.valsalva) din.push('avaliada durante manobra de Valsalva');
  if (h.alteracaoDinamica) din.push('com alteração dinâmica das dimensões ao esforço');
  const dinTxt = din.length ? `, ${din.join(', ')}` : '';
  const desc = `Defeito da parede${reg}${latTxt}${colo}, com conteúdo ${TXT.conteudoHernia[h.conteudo]}, ${TXT.redutivelHernia[h.redutivel]}${dinTxt}.`;
  let imp = `${TXT.nomeHernia[h.regiao]}${latTxt}, de conteúdo ${TXT.conteudoHernia[h.conteudo]}, ${TXT.redutivelHernia[h.redutivel]}.`;
  if (h.encarceramentoSuspeito) {
    imp += ' Observam-se achados que podem sugerir encarceramento, recomendando-se correlação clínica e conduta conforme quadro apresentado.';
  }
  return item('outros', null, false, desc, imp);
}

function gerarBlocoVascular() {
  const v = estado.vascular;
  const ms = medStrSeguro(v.med1, v.med2, v.med3);
  const med = ms ? `, medindo ${ms}` : '';
  const colo = tratarFloat(v.colo) ? `, com colo de ${tratarFloat(v.colo)} cm` : '';
  const fluxo = v.fluxo === 'ausente'
    ? 'sem fluxo detectável ao Doppler'
    : `com fluxo ${TXT.fluxoVasc[v.fluxo]} ao Doppler${v.padrao !== 'ausente' ? `, de padrão ${TXT.padraoVasc[v.padrao]}` : ''}`;
  const desc = `Achado vascular compatível com ${TXT.tipoVasc[v.tipo]}${med}${colo}, ${fluxo}${v.comunicacaoVaso ? ', com comunicação identificada com vaso adjacente' : ''}.`;
  const imp = v.tipo === 'indeterminada'
    ? 'Alteração vascular de partes moles indeterminada; sugere-se correlação clínica e, se pertinente, complementação diagnóstica.'
    : `${cap1(TXT.tipoVasc[v.tipo])}${ms ? ', medindo ' + ms : ''}${v.comunicacaoVaso ? ', com comunicação com vaso adjacente' : ''}.`;
  return item('outros', null, false, desc, imp);
}

function gerarBlocoCalcificacao() {
  const c = estado.calcificacao;
  const locP = comPrep(c.loc);
  const loc = locP ? ` ${esc(locP)}` : '';
  const extras = [];
  if (c.sombraAcustica) extras.push('sombra acústica posterior');
  if (c.ossificacaoPeriferica) extras.push('ossificação periférica');
  const extraTxt = extras.length ? `, com ${juntar(extras)}` : '';
  const desc = `Observa-se calcificação/ossificação de padrão ${TXT.padraoCalc[c.padrao]}${loc}${extraTxt}.`;
  const imp = `Calcificação/ossificação de partes moles, de padrão ${TXT.padraoCalc[c.padrao]}${loc}${extraTxt}.`;
  return item('outros', null, false, desc, imp);
}

function gerarBlocoNervo() {
  const n = estado.nervo;
  const nomeN = semPrefixo(n.nome, /^nervo\s+/i);
  const nome = nomeN ? esc(nomeN) : 'avaliado';
  const extras = [];
  if (n.espessamento) extras.push('espessamento');
  if (n.alteracaoFascicular) extras.push('alteração do padrão fascicular');
  if (n.hiperemia) extras.push('hiperemia ao Doppler');
  if (n.compressao) extras.push('sinais de compressão extrínseca');
  const extraTxt = extras.length ? `, com ${juntar(extras)}` : '';
  const desc = `Nervo ${nome} com continuidade ${n.continuidade}${extraTxt}${n.neuroma ? ', com achados sugestivos de neuroma' : ''}.`;
  let imp;
  if (n.continuidade === 'interrompida') imp = `Descontinuidade do nervo ${nome}${extras.length ? ', com ' + juntar(extras) : ''}.`;
  else if (n.neuroma) imp = `Achados compatíveis com neuroma em topografia do nervo ${nome}.`;
  else if (extras.length) imp = `Nervo ${nome} com ${juntar(extras)}, conforme contexto clínico.`;
  else imp = `Nervo ${nome} de aspecto ecográfico preservado.`;
  return item('outros', null, false, desc, imp);
}

function gerarBlocoEdemaG() {
  const e = estado.edemaG;
  const extras = [];
  if (e.espessamentoCutaneo) extras.push('espessamento cutâneo');
  if (e.aumentoEcogenicidade) extras.push('aumento da ecogenicidade do subcutâneo');
  if (e.padraoReticular) extras.push('padrão reticular do subcutâneo');
  if (e.hiperemia) extras.push('hiperemia ao Doppler');
  if (e.colecaoAssoc) extras.push('coleção associada');
  const extraTxt = extras.length ? `, com ${juntar(extras)}` : '';
  const a = String(e.anat || '').trim();
  const anat = a ? `, ${esc(a)}` : '';
  const desc = `Observa-se processo edematoso/inflamatório de distribuição ${e.distribuicao} do tecido celular subcutâneo${anat}${extraTxt}.`;
  const imp = `Edema/processo inflamatório do tecido celular subcutâneo, de distribuição ${e.distribuicao}${e.colecaoAssoc ? ', com coleção associada' : ''}, conforme contexto clínico.`;
  return item('pele', null, true, desc, imp);
}

// Monta todos os blocos referentes à seção "Tipo de Achado".
function gerarAchadosTipo() {
  const t = estado.tipo;
  const itens = [];
  if (t.massa) itens.push(gerarBlocoMassa());
  if (t.colecao) itens.push(gerarBlocoColecao());
  if (t.edema) itens.push(gerarBlocoEdemaG());
  if (t.hematoma) itens.push(gerarBlocoHematoma());
  if (t.lesaoMuscular) itens.push(gerarBlocoLesaoMuscular());
  if (t.tendao) itens.push(gerarBlocoTendao());
  if (t.linfonodo) itens.push(gerarBlocoLinfonodo());
  if (t.corpoEstranho) itens.push(gerarBlocoCorpoEstranho());
  if (t.hernia) itens.push(gerarBlocoHernia());
  if (t.vascular) itens.push(gerarBlocoVascular());
  if (t.calcificacao) itens.push(gerarBlocoCalcificacao());
  if (t.nervo) itens.push(gerarBlocoNervo());
  if (t.outros && String(t.outrosTexto || '').trim()) {
    const tx = esc(String(t.outrosTexto).trim());
    itens.push(item('outros', null, false, cap1(tx), cap1(tx)));
  }
  return itens;
}

// ── FRASE DA REGIÃO EXAMINADA (técnica) ──
// Resultado: "Exame direcionado para a região XXX." com artigo correto, sem duplicar
// "região" e sem repetir lateralidade quando ela já faz parte do nome da região.
function fraseRegiao() {
  const ar = estado.area;
  let desc = '', modo = 'queixa';
  if (ar.tipo === 'pre' && ar.regiao) {
    const r = REGIOES.find(x => x[0] === ar.regiao);
    if (r) { desc = r[1]; modo = 'pre'; }
  } else if (ar.tipo === 'outra' && String(ar.outra || '').trim()) {
    desc = String(ar.outra).trim(); modo = 'outra';
  }
  if (!desc) { desc = 'região de queixa do paciente'; modo = 'queixa'; }

  let sint;
  if (modo === 'outra') {
    const d = esc(desc);
    if (/^(a|o|as|os|à|ao|às|aos)\s/i.test(desc)) sint = d;
    else if (/^regiões/i.test(desc)) sint = 'as ' + d;
    else if (/^região/i.test(desc)) sint = 'a ' + d;
    else sint = 'a região ' + d;
  } else if (/^regiões/.test(desc)) sint = 'as ' + desc;
  else if (/^região/.test(desc)) sint = 'a ' + desc;
  else sint = (/^(coxa|perna)/.test(desc) ? 'a ' : 'o ') + desc;

  const jaTemLat = /direit[ao]|esquerd[ao]|bilateral/i.test(desc) || /^regiões/.test(desc);
  let lt = '';
  if (ar.lateralidade !== 'nenhuma' && !jaTemLat) {
    const adj = ar.lateralidade;
    if (modo === 'queixa') lt = adj === 'bilateral' ? ', bilateral' : ', à ' + adj;
    else if (modo === 'pre' && /^região/.test(desc)) lt = ' ' + adj;
    else lt = adj === 'bilateral' ? ' bilateral' : ' à ' + adj;
  }
  return `Exame direcionado para ${sint}${lt}.`;
}

// ── GERAR LAUDO ──
// Estrutura fiel à máscara oficial (partes moles.docx):
//   Técnica → Análise (Pele e TCSC / Planos musculares / Coleções / Linfonodomegalias ou massas)
//   → Conclusão. Cada achado é roteado para a linha correspondente; a frase de normalidade
//   da linha só aparece quando não há achado que a contradiga.
function updateLaudo() {
  const ar = estado.area;
  const pe = estado.pele;
  const mu = estado.muscular;
  const ac = estado.achados;
  const t = estado.tipo;

  // ── 1) Coleta de achados (abas Pele/Muscular + aba Tipo de Achado) ──
  const itens = [];
  if (pe.edema && !t.edema) {
    itens.push(item('pele', null, true,
      'Espessamento da pele e aumento difuso da ecogenicidade do tecido celular subcutâneo, sugestivo de edema.',
      'Edema de tecido subcutâneo.'));
  }
  if (pe.lipoma) {
    const ms = medStrSeguro(pe.lipMed1, pe.lipMed2, pe.lipMed3);
    const med = ms ? `, medindo ${ms}` : '';
    const cont = pe.lipReg ? ', de contornos regulares' : '';
    itens.push(item('massa', 'pele', false,
      `No plano do subcutâneo, identifica-se imagem nodular hiperecogênica e homogênea${cont}${med}, de aspecto compatível com lipoma.`,
      `Lipoma de subcutâneo${ms ? ', medindo ' + ms : ''}.`));
  }
  if (pe.nodulo) {
    const ms = medStrSeguro(pe.nodMed1, pe.nodMed2, pe.nodMed3);
    const med = ms ? `, medindo ${ms}` : '';
    itens.push(item('massa', 'pele', false,
      `No plano ${pe.nodLoc}, nota-se nódulo ${pe.nodEco} e ${pe.nodTex}, de contornos ${pe.nodCon}${med}${pe.nodDop ? ', com fluxo ao Doppler' : ''}.`,
      `Nódulo no plano ${pe.nodLoc}${ms ? ', medindo ' + ms : ''}.`));
  }
  if (pe.colOrg) {
    const vol = calcVolSeguro(pe.colOrgMed1, pe.colOrgMed2, pe.colOrgMed3);
    const ms = medStrSeguro(pe.colOrgMed1, pe.colOrgMed2, pe.colOrgMed3);
    const sep = pe.colOrgSep ? ', contendo septos de permeio' : '';
    const med = ms ? `, medindo ${ms}${vol ? `, com volume de ${vol} cm³` : ''}` : '';
    const dis = tratarFloat(pe.colOrgDis) ? `, e seu centro distando ${tratarFloat(pe.colOrgDis)} cm da pele` : '';
    itens.push(item('col', 'pele', false,
      `No plano ${pe.colOrgLoc}, nota-se coleção de paredes ${pe.colOrgPar} e conteúdo ${pe.colOrgCon}${sep}${med}${dis}.`,
      `Coleção organizada no plano ${pe.colOrgLoc}${ms ? ', medindo ' + ms : ''}.`));
  }
  if (pe.colNao) {
    const vol = calcVolSeguro(pe.colNaoMed1, pe.colNaoMed2, pe.colNaoMed3);
    const ms = medStrSeguro(pe.colNaoMed1, pe.colNaoMed2, pe.colNaoMed3);
    const med = ms ? `, medindo cerca de ${ms}${vol ? `, com volume de ${vol} cm³` : ''}` : '';
    const dis = tratarFloat(pe.colNaoDis) ? `, e seu centro distando ${tratarFloat(pe.colNaoDis)} cm da pele` : '';
    itens.push(item('col', 'pele', false,
      `No plano ${pe.colNaoLoc}, nota-se área heterogênea, predominantemente hipoecogênica, de limites imprecisos${med}${dis}.`,
      `Achados sugestivos de coleção em organização no plano ${pe.colNaoLoc}.`));
  }
  if (mu.colOrg) {
    const vol = calcVolSeguro(mu.colOrgMed1, mu.colOrgMed2, mu.colOrgMed3);
    const ms = medStrSeguro(mu.colOrgMed1, mu.colOrgMed2, mu.colOrgMed3);
    const sep = mu.colOrgSep ? ', contendo septos de permeio' : '';
    const med = ms ? `, medindo ${ms}${vol ? `, com volume de ${vol} cm³` : ''}` : '';
    const dis = tratarFloat(mu.colOrgDis) ? `, e seu centro distando ${tratarFloat(mu.colOrgDis)} cm da pele` : '';
    itens.push(item('col', 'musc', false,
      `No plano muscular, nota-se coleção de paredes ${mu.colOrgPar} e conteúdo ${mu.colOrgCon}${sep}${med}${dis}.`,
      `Coleção organizada no plano muscular${ms ? ', medindo ' + ms : ''}.`));
  }
  if (mu.colNao) {
    const vol = calcVolSeguro(mu.colNaoMed1, mu.colNaoMed2, mu.colNaoMed3);
    const ms = medStrSeguro(mu.colNaoMed1, mu.colNaoMed2, mu.colNaoMed3);
    const med = ms ? `, medindo cerca de ${ms}${vol ? `, com volume de ${vol} cm³` : ''}` : '';
    const dis = tratarFloat(mu.colNaoDis) ? `, e seu centro distando ${tratarFloat(mu.colNaoDis)} cm da pele` : '';
    itens.push(item('col', 'musc', false,
      `No plano muscular, nota-se área heterogênea, predominantemente hipoecogênica, de limites imprecisos${med}${dis}.`,
      'Achados sugestivos de coleção em organização no plano muscular.'));
  }
  gerarAchadosTipo().forEach(i => itens.push(i));

  // ── 2) Linhas da análise, na ordem da máscara ──
  function linhaPlano(cat, plano, habitual, normal, excecao) {
    const prop = itens.filter(i => i.cat === cat && i.proprio);
    const foc = itens.filter(i => i.plano === plano && !i.proprio);
    if (prop.length) {
      const p = prop.map(i => i.desc);
      return p;
    }
    if (!habitual) return null;
    if (foc.length) return [foc.length > 1 ? excecao[1] : excecao[0]];
    return [normal];
  }
  const linhaPele = linhaPlano('pele', 'pele', pe.habitual, 'de espessura e ecogenicidade preservadas.',
    ['de espessura e ecogenicidade preservadas, exceto pelo achado focal descrito adiante.', 'de espessura e ecogenicidade preservadas, exceto pelos achados focais descritos adiante.']);
  const linhaMusc = linhaPlano('musc', 'musc', mu.habitual, 'com arquitetura preservada.',
    ['com arquitetura preservada, exceto pelo achado descrito adiante.', 'com arquitetura preservada, exceto pelos achados descritos adiante.']);

  const col = itens.filter(i => i.cat === 'col').map(i => i.desc);
  const linhaCol = col.length ? col : (pe.ausencia ? ['Ausentes.'] : null);
  const mas = itens.filter(i => i.cat === 'massa').map(i => i.desc);
  const linhaMas = mas.length ? mas : (pe.ausencia ? ['Não há.'] : null);

  const outros = itens.filter(i => i.cat === 'outros').map(i => i.desc);
  const textoAdic = String(ac.texto || '').trim();
  if (textoAdic) outros.push(cap1(esc(textoAdic)));
  const linhaOut = outros.length ? outros : null;

  const linhas = [
    ['Pele e tecido celular subcutâneo', linhaPele],
    ['Planos musculares', linhaMusc],
    ['Coleções', linhaCol],
    ['Linfonodomegalias ou massas', linhaMas],
    ['Outros achados', linhaOut],
  ].filter(l => l[1]);

  // ── 3) Técnica ──
  const analiseTxt = linhas.map(l => l[1].join(' ')).join(' ');
  const dopplerUsado = /Doppler/i.test(analiseTxt);
  const dinItens = [];
  if (ar.dinamica || (t.tendao && estado.tendao.avaliacaoDinamica) || (t.nervo && estado.nervo.avaliacaoDinamica) || (t.hernia && estado.hernia.alteracaoDinamica)) dinItens.push('avaliação dinâmica');
  if (ar.valsalva || (t.hernia && estado.hernia.valsalva)) dinItens.push('manobra de Valsalva');
  if (ar.contracao) dinItens.push('avaliação sob contração muscular');
  if (ar.compressao) dinItens.push('compressão com o transdutor');

  const limit = [];
  if (ar.limitacaoEdema) limit.push('por acentuado edema');
  if (ar.limitacaoBiotipo) limit.push('pela intensa atenuação do feixe acústico inerente ao biotipo');
  if (ar.limitacaoProfundidade) limit.push('pela profundidade da lesão');
  if (ar.limitacaoDor) limit.push('pela dor referida pelo paciente');

  // Redação da máscara preservada literalmente; complementos só entram quando selecionados.
  const compl = [];
  if (dopplerUsado) compl.push('Utilizado Doppler colorido.');
  if (dinItens.length) compl.push(`${dinItens.length > 1 ? 'Foram realizadas' : 'Foi realizada'} ${juntar(dinItens)}.`);
  if (ar.contralateral) compl.push('Realizada comparação com o lado contralateral.');
  if (limit.length) compl.push(`Exame parcialmente limitado ${juntar(limit)}.`);

  // ── 4) Conclusão ──
  const vistos = new Set();
  const impressoes = [];
  itens.forEach(i => { if (i.imp && !vistos.has(i.imp)) { vistos.add(i.imp); impressoes.push(i.imp); } });
  if (textoAdic) impressoes.push(cap1(esc(textoAdic)));
  const conclusao = impressoes.length ? impressoes : ['Exame sem achados significativos.'];

  // ── 5) HTML ──
  function htmlLinha(label, paras) {
    return paras.map((p, i) => i === 0
      ? `<div class="doc-p"><span class="doc-label">- ${label}:</span> ${p}</div>`
      : `<div class="doc-p doc-cont">${p}</div>`).join('');
  }
  document.getElementById('laudo-doc').innerHTML = `
    <div class="doc-titulo">ULTRASSONOGRAFIA DE PARTES MOLES / ULTRASSONOGRAFIA DE ESTRUTURAS SUPERFICIAIS</div>
    <div class="doc-secao">
      <span class="doc-label">Técnica:</span>
      <div class="doc-p">Exame realizado com transdutor linear de alta frequência.</div>
      <div class="doc-p">${fraseRegiao()}</div>
      ${compl.length ? `<div class="doc-p">${compl.join(' ')}</div>` : ''}
    </div>
    <div class="doc-secao">
      <span class="doc-label">Análise:</span>
      ${linhas.map(l => htmlLinha(l[0], l[1])).join('')}
    </div>
    <div class="doc-secao">
      <span class="doc-label">Conclusão:</span>
      ${conclusao.map(p => `<div class="doc-p"><span class="doc-label">-</span> ${p}</div>`).join('')}
    </div>`;
}

// ── DARK MODE ──
function toggleDark() {
  const isDark = document.body.classList.toggle('dark');
  const btn = document.getElementById('btn-dark-toggle');
  if (isDark) {
    btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8.5A5.5 5.5 0 0 1 6 3c0-.18.01-.36.03-.53A6 6 0 1 0 13.97 9.5c-.15.01-.31.01-.47 0z"/></svg>Modo claro';
  } else {
    btn.innerHTML = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro';
  }
  localStorage.setItem('darkMode', isDark ? '1' : '0');
}
(function(){ if(localStorage.getItem('darkMode')==='1') toggleDark(); })();

// ── COPIAR ──
function copiar() {
  var el = document.getElementById('laudo-doc');
  if (!el) return;
  if (typeof _copyLaudoRichText === 'function') {
    _copyLaudoRichText(el, function(ok) {
      showToast(ok ? 'Laudo copiado para a área de transferência!' : 'Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
    });
    return;
  }
  // Fallback (quando ../js/copy-pacs.js não está disponível)
  try {
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    var ok = document.execCommand('copy'); s.removeAllRanges();
    showToast(ok ? 'Laudo copiado para a área de transferência!' : 'Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
  } catch (err) {
    showToast('Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
  }
}

function showToast(msg) {
  let t = document.getElementById('toast-notification');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── IMPRIMIR ──
function imprimir() {
  const h = document.getElementById('laudo-doc').innerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Helvetica,Arial,sans-serif;font-size:10pt;padding:32px;color:#111;line-height:1.65;}.doc-titulo{text-align:center;font-weight:700;text-transform:uppercase;margin-bottom:16px;}.doc-label{font-weight:700;}.doc-p{margin-bottom:8px;}.doc-secao{margin-bottom:14px;}.doc-cont{margin-left:14px;}*{color:#111 !important;}.laudo-doc:focus { outline: none; }
</style></head><body>${h}
</body></html>`);
  w.document.close();
  w.print();
}

// Restaura TODOS os campos (originais e novos módulos) para o estado inicial,
// garantindo que estado inicial e estado pós-reset sejam sempre idênticos.
function reiniciar() {
  Object.keys(ESTADO_INICIAL).forEach(k => {
    estado[k] = JSON.parse(JSON.stringify(ESTADO_INICIAL[k]));
  });
  showSection('area');
}
