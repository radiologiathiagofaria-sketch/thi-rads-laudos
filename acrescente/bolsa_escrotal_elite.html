<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> THI-RADS — US Bolsa Escrotal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a56db;--blue-dark:#1140a6;--blue-light:#e8f0fe;--blue-mid:#dbeafe;
  --surface:#f4f6fb;--border:#e2e6ef;--border-strong:#c8cfe0;
  --text:#1a1f2e;--text-2:#4b5570;--text-3:#8892a4;
  --white:#ffffff;--green:#059669;--red:#dc2626;--radius:8px;--radius-lg:12px;
}
body.dark{
  --blue:#4d86f5;--blue-dark:#3a6fd4;--blue-light:#1e2d4a;--blue-mid:#1e2d4a;
  --surface:#141820;--border:#2a2f3d;--border-strong:#3a4155;
  --text:#e2e6f0;--text-2:#9aa3b8;--text-3:#5d6680;
  --white:#1e2230;--green:#34d399;--red:#f87171;
}
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:#1e2230;border-left-color:var(--border);}
body.dark .laudo-body{background:#1e2230;}
body.dark .laudo-header{background:#1e2230;border-bottom-color:var(--border);}
@media print{body.dark .laudo-doc,body.dark .laudo-doc *{color:#111 !important;}}
.btn-dark{margin-left:auto;}
body.dark .btn-dark{background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover{background:#343a4d;color:#fff;}
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text]{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .radio-mark{background:var(--white);}
body.dark .check-box{background:var(--white);}
body.dark .sub-opts{background:#1a2040;border-bottom-color:#2a3460;}
body.dark .sub-opt-label{background:var(--white);color:var(--text-2);}
body.dark .toolbar{background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar{background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd{border-bottom-color:var(--border);}
body.dark .block{background:var(--white);border-color:var(--border);}
body.dark .block-title{background:var(--white);border-bottom-color:var(--border);}
body.dark .radio-opt:hover{background:#1e2d4a;}
body.dark .radio-opt.selected{background:#1e2d4a;}
body.dark .check-row{background:#1a1f2e;}
body.dark .check-row:hover{background:#1e2d4a;}
body.dark .check-row.selected{background:#1e2d4a;}
body.dark .sel-tag{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .dim-nota{background:#1e2d4a;border-color:#2a3d6a;color:#9aa3b8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:10px;height:48px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:6px;margin-right:12px;}
.logo-name{font-size:17px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:.2px;}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);font-weight:500;transition:all .13s;background:var(--white);color:var(--text-2);}
.btn:hover{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.btn-danger{background:#fff5f5;color:var(--red);border-color:#fecaca;}
body.dark .btn-danger{background:#2d1a1a;border-color:#6b2929;}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:148px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.sidebar-titulo{font-size:11px;font-weight:600;color:var(--text);}
.nav-group{padding:6px 0;}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:11.5px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:2px solid transparent;}
.nav-item:hover{background:var(--blue-light);color:var(--blue);}
.nav-item.active{background:var(--blue-light);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}
.panel{width:490px;flex-shrink:0;overflow-y:auto;padding:14px 14px 20px;background:var(--surface);}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';display:block;width:3px;height:16px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:10px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;padding:8px 14px 7px;border-bottom:1px solid var(--border);background:var(--white);}
.block-subtitle{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;padding:6px 14px 5px;border-bottom:1px solid var(--border);background:var(--blue-light);}
.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:#f5f8ff;}
.radio-opt.selected{background:var(--blue-light);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;font-size:12.5px;color:var(--text-2);line-height:1.4;cursor:pointer;flex-wrap:wrap;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:500;}
.radio-mark{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
.radio-opt.selected .radio-mark::after{opacity:1;}
.check-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;background:#fafbff;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:#f0f5ff;}
.check-row.selected{background:#e6eeff;}
.check-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
.check-label{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px 8px 14px;font-size:12px;color:var(--text-2);cursor:pointer;flex-wrap:wrap;}
.check-row.selected .check-label{color:var(--blue);font-weight:500;}
.check-box{width:15px;height:15px;border-radius:4px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:9px;height:9px;}
.check-row.selected .check-box svg{display:block;}
.sub-opts{display:none;padding:8px 14px 9px 36px;gap:12px;background:#eef3ff;border-bottom:1px solid #d0dcff;flex-wrap:wrap;align-items:center;}
.sub-opt-label{font-size:12px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:var(--white);transition:all .12s;}
.sub-opt-label:has(input:checked){background:var(--blue);color:#fff;border-color:var(--blue);}
.sub-opt-label input{position:absolute;opacity:0;pointer-events:none;}
.sel-tag{font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 6px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:5px;cursor:pointer;}
.dim-rows{padding:8px 14px;display:flex;flex-direction:column;gap:6px;}
.dim-row{display:flex;align-items:center;gap:10px;}
.dim-lbl{flex:1;font-size:12px;color:var(--text-2);}
.dim-input{width:60px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.dim-input-sm{width:50px;}
.dim-unit{font-size:12px;color:var(--text-3);}
.dim-nota{font-size:11px;color:var(--text-3);padding:6px 14px 7px;background:#f8f9fc;border-top:1px solid var(--border);line-height:1.5;}
.vol-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;background:var(--blue-light);color:var(--blue);font-size:11px;font-weight:600;}
.vol-badge.warn{background:#fef3c7;color:#d97706;}
.vol-badge.alert{background:#fee2e2;color:var(--red);}
.inline-inputs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:4px;}
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
.urgencia-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;background:#fee2e2;color:var(--red);font-size:11px;font-weight:600;border:1px solid #fca5a5;}
.laudo-doc:focus { outline: none; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-thirads.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <button class="btn" onclick="window.location.href='../laudo-thirads.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>
  <div class="tb-sep"></div>
  <button class="btn" onclick="copiar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copiar laudo</button>
  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>
  <button class="btn btn-dark" id="btn-dark-toggle" onclick="toggleDark()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro</button>
  <button class="btn btn-danger" onclick="reiniciar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 1.5-3.9M2 4v4h4"/></svg>Reiniciar</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd"><div class="sidebar-tipo">Ultrassonografia</div><div class="sidebar-titulo">Bolsa Escrotal</div></div>
    <div class="nav-group">
      <div class="nav-item" id="nav-tecnica" onclick="showSection('tecnica')"><span class="nav-dot"></span>Técnica</div>
      <div class="nav-item" id="nav-testiculoD" onclick="showSection('testiculoD')"><span class="nav-dot"></span>Testículo D</div>
      <div class="nav-item" id="nav-testiculoE" onclick="showSection('testiculoE')"><span class="nav-dot"></span>Testículo E</div>
      <div class="nav-item" id="nav-epididimos" onclick="showSection('epididimos')"><span class="nav-dot"></span>Epidídimos</div>
      <div class="nav-item" id="nav-plexos" onclick="showSection('plexos')"><span class="nav-dot"></span>Plexos Pampin.</div>
      <div class="nav-item" id="nav-liquido" onclick="showSection('liquido')"><span class="nav-dot"></span>Líquido Livre</div>
      <div class="nav-item" id="nav-achados" onclick="showSection('achados')"><span class="nav-dot"></span>Achados Adicionais</div>
    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização do laudo</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

<script>
// ── Estado global ──
const estado = {
  tecnica: {
    urgencia: false,
    indicacao: 'nc',
    indicacaoOutros: '',
    limEdema: false,
    limBiotipo: false
  },
  testiculoD: {
    sit: 'habitual', criLoc: 'canal', protese: false,
    parenquima: 'homogeneo',
    dim1: '', dim2: '', dim3: '',
    doppler: 'habitual',
    achCisto: false, achCistoDim1: '', achCistoDim2: '', achCistoDim3: '',
    achEctasia: false, achEctasiaCal: '',
    achAbscesso: false, achAbscessoDim1: '', achAbscessoDim2: '', achAbscessoDim3: '',
    achEpiCisto: false, achEpiCistoDim1: '', achEpiCistoDim2: '', achEpiCistoDim3: ''
  },
  testiculoE: {
    sit: 'habitual', criLoc: 'canal', protese: false,
    parenquima: 'homogeneo',
    dim1: '', dim2: '', dim3: '',
    doppler: 'habitual',
    achCisto: false, achCistoDim1: '', achCistoDim2: '', achCistoDim3: '',
    achEctasia: false, achEctasiaCal: '',
    achAbscesso: false, achAbscessoDim1: '', achAbscessoDim2: '', achAbscessoDim3: '',
    achEpiCisto: false, achEpiCistoDim1: '', achEpiCistoDim2: '', achEpiCistoDim3: ''
  },
  epididimos: {
    sitD: 'habitual', sitE: 'habitual',
    cistoDDim1: '', cistoDDim2: '',
    cistoEDim1: '', cistoEDim2: ''
  },
  plexos: {
    sitD: 'habitual', sitE: 'habitual',
    calibreD: '', calibreE: '',
    valsalvaD: 'nc', valsalvaE: 'nc',
    duracaoD: '', duracaoE: ''
  },
  liquido: {
    sitD: 'fisio', sitE: 'fisio',
    qtdD: 'discreta', aspD: 'anecoico',
    qtdE: 'discreta', aspE: 'anecoico'
  },
  achados: { texto: '' }
};

let secaoAtual = 'testiculoD';

// ── UTILITÁRIOS ──
function calcVol(d1, d2, d3) {
  const a = parseFloat(d1), b = parseFloat(d2), c = parseFloat(d3);
  if (isNaN(a) || isNaN(b) || isNaN(c) || a <= 0 || b <= 0 || c <= 0) return null;
  return (a * b * c * 0.71).toFixed(1);
}
function fmtDims(d1, d2, d3) {
  const parts = [d1, d2, d3].filter(v => v && parseFloat(v) > 0);
  if (!parts.length) return null;
  return parts.map(v => v + ' cm').join(' x ');
}
function sv(key, field, val) { estado[key][field] = val; updateLaudo(); }
function setRadio(key, field, val) { estado[key][field] = val; renderPanel(secaoAtual); updateLaudo(); }
function toggleChk(key, field) { estado[key][field] = !estado[key][field]; renderPanel(secaoAtual); updateLaudo(); }
function setDim(key, field, val) { estado[key][field] = val; updateLaudo(); }

function radio(id, val, label, key, field, extra='') {
  const sel = estado[key][field] === val ? 'selected' : '';
  return `<div class="radio-opt ${sel}" onclick="setRadio('${key}','${field}','${val}')">
    <label class="radio-label"><span class="radio-mark"></span>${label}${extra}</label>
  </div>`;
}
function chk(id, label, key, field, extra='') {
  const sel = estado[key][field] ? 'selected' : '';
  return `<div class="check-row ${sel}" onclick="toggleChk('${key}','${field}')">
    <label class="check-label"><span class="check-box"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M1.5 5l2.5 2.5 4.5-4.5"/></svg></span>${label}${extra}</label>
  </div>`;
}
function dimInput(id, label, key, field, unit='cm', w='60px') {
  return `<div class="dim-row"><span class="dim-lbl">${label}</span>
    <input class="dim-input" style="width:${w}" type="number" min="0" step="0.1" id="${id}" value="${estado[key][field]}" placeholder="—" oninput="setDim('${key}','${field}',this.value);updateLaudo()">
    <span class="dim-unit">${unit}</span></div>`;
}
function selTag(id, opts, key, field) {
  return `<select class="sel-tag" id="${id}" onchange="sv('${key}','${field}',this.value)" onclick="event.stopPropagation()">${opts.map(o=>`<option value="${o.v}" ${estado[key][field]===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`;
}
function inlineInput(id, key, field, placeholder='—', w='52px') {
  return `<input class="dim-input" style="width:${w}" type="number" min="0" step="0.1" id="${id}" value="${estado[key][field]}" placeholder="${placeholder}" oninput="setDim('${key}','${field}',this.value);updateLaudo()" onclick="event.stopPropagation()">`;
}

// ── NAVEGAÇÃO ──
function showSection(sec) {
  secaoAtual = sec;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-'+sec).classList.add('active');
  renderPanel(sec);
  updateLaudo();
}

function renderPanel(sec) {
  const p = document.getElementById('main-panel');
  const titles = {
    tecnica:'Técnica', testiculoD:'Testículo Direito', testiculoE:'Testículo Esquerdo',
    epididimos:'Epidídimos', plexos:'Plexos Pampiniformes', liquido:'Líquido Livre', achados:'Achados Adicionais'
  };
  let html = `<div class="sec-title">${titles[sec]}</div>`;
  if (sec==='tecnica') html += renderTecnica();
  else if (sec==='testiculoD') html += renderTesticulo('D');
  else if (sec==='testiculoE') html += renderTesticulo('E');
  else if (sec==='epididimos') html += renderEpididimos();
  else if (sec==='plexos') html += renderPlexos();
  else if (sec==='liquido') html += renderLiquido();
  else if (sec==='achados') html += renderAchados();
  p.innerHTML = html;
}

// ── TÉCNICA ──
function renderTecnica() {
  const e = estado.tecnica;
  return `
  <div class="block"><div class="block-title">Caráter do exame</div>
    ${chk('urgencia','Exame realizado em caráter de urgência','tecnica','urgencia')}
  </div>
  <div class="block"><div class="block-title">Indicação clínica</div>
    ${radio('ind-nc','nc','não citar','tecnica','indicacao')}
    ${radio('ind-ede','edema','Edema escrotal','tecnica','indicacao')}
    ${radio('ind-dor','dor','Dor testicular','tecnica','indicacao')}
    ${radio('ind-tor','torcao','Suspeita de torção testicular','tecnica','indicacao')}
    ${radio('ind-mas','massa','Massa palpável','tecnica','indicacao')}
    ${radio('ind-inf','infertilidade','Investigação de infertilidade','tecnica','indicacao')}
    ${radio('ind-out','outros','Outra indicação: <input class="dim-input" style="width:150px" type="text" placeholder="descreva..." value="${e.indicacaoOutros}" oninput="sv(\'tecnica\',\'indicacaoOutros\',this.value)" onclick="event.stopPropagation()">','tecnica','indicacao')}
  </div>
  <div class="block"><div class="block-title">Limitações técnicas</div>
    ${chk('lim-ede','Edema escrotal significativo','tecnica','limEdema')}
    ${chk('lim-bio','Biotipo desfavorável (obesidade)','tecnica','limBiotipo')}
  </div>
  <div class="dim-nota">Exame realizado com transdutor linear de alta frequência, em modo B, com avaliação pelo Doppler colorido e espectral.</div>`;
}

// ── TESTÍCULO ──
function renderTesticulo(lado) {
  const k = 'testiculo' + lado;
  const e = estado[k];
  const vol = calcVol(e.dim1, e.dim2, e.dim3);
  let volBadge = '';
  if (vol !== null) {
    const v = parseFloat(vol);
    if (v < 7) volBadge = `<span class="vol-badge alert">Vol: ${vol.replace('.',',')} cm³ ↓ (VR 7–23 cm³)</span>`;
    else if (v > 23) volBadge = `<span class="vol-badge warn">Vol: ${vol.replace('.',',')} cm³ ↑ (VR 7–23 cm³)</span>`;
    else volBadge = `<span class="vol-badge">Vol: ${vol.replace('.',',')} cm³ ✓</span>`;
  }

  const isCri = e.sit === 'criptorquidia';
  const isOrq = e.sit === 'orquiectomia';

  return `
  <div class="block"><div class="block-title">Situação</div>
    ${radio('sit-hab','habitual','Habitual (escrotal)','testiculo'+lado,'sit')}
    ${radio('sit-cri','criptorquidia','Criptorquidia — localizado: '+selTag('cri-loc-'+lado,[{v:'canal',l:'no canal inguinal'},{v:'inguinal',l:'na região inguinal'},{v:'nao_id',l:'não identificado ao estudo'}],'testiculo'+lado,'criLoc'),'testiculo'+lado,'sit')}
    ${radio('sit-orq','orquiectomia','Orquiectomia (ausência testicular)','testiculo'+lado,'sit',
      `<span style="margin-left:8px;">
        <label class="sub-opt-label" onclick="event.stopPropagation()"><input type="checkbox" ${e.protese?'checked':''} onchange="sv('testiculo${lado}','protese',this.checked)"> com prótese testicular</label>
      </span>`
    )}
  </div>
  ${isOrq ? '' : `
  <div class="block"><div class="block-title">Parênquima</div>
    ${radio('par-hom','homogeneo','Homogêneo, sem lesões focais','testiculo'+lado,'parenquima')}
    ${radio('par-het','heterogeneo','Heterogêneo difuso, sem lesões focais','testiculo'+lado,'parenquima')}
    ${radio('par-mic','microlitiase','Microlitíase testicular (≥5 microcálculos/campo)','testiculo'+lado,'parenquima')}
  </div>
  <div class="block"><div class="block-title">Dimensões e Volume</div>
    <div class="dim-rows">
      ${dimInput('dim1-'+lado,'Comprimento (eixo longitudinal)','testiculo'+lado,'dim1')}
      ${dimInput('dim2-'+lado,'Largura (eixo transverso)','testiculo'+lado,'dim2')}
      ${dimInput('dim3-'+lado,'Espessura (eixo AP)','testiculo'+lado,'dim3')}
      <div class="dim-row"><span class="dim-lbl">Volume calculado</span>${volBadge||'<span style="color:var(--text-3);font-size:12px;">aguardando medidas…</span>'}</div>
    </div>
    <div class="dim-nota">Fórmula elipsoide: V = C × L × E × 0,71 &nbsp;|&nbsp; VR adulto: 7–23 cm³</div>
  </div>
  <div class="block"><div class="block-title">Doppler de fluxo</div>
    ${radio('dop-hab','habitual','Fluxo habitual (simétrico ao contralateral)','testiculo'+lado,'doppler')}
    ${radio('dop-aum','aumentado','Fluxo aumentado — padrão inflamatório/reativo','testiculo'+lado,'doppler')}

    ${chk('ach-cis-'+lado,'Cisto testicular simples medindo: '+inlineInput('cis1-'+lado,'testiculo'+lado,'achCistoDim1')+' x '+inlineInput('cis2-'+lado,'testiculo'+lado,'achCistoDim2')+' x '+inlineInput('cis3-'+lado,'testiculo'+lado,'achCistoDim3')+' cm','testiculo'+lado,'achCisto')}

    ${chk('ach-abs-'+lado,'Abscesso testicular medindo: '+inlineInput('abs1-'+lado,'testiculo'+lado,'achAbscessoDim1')+' x '+inlineInput('abs2-'+lado,'testiculo'+lado,'achAbscessoDim2')+' x '+inlineInput('abs3-'+lado,'testiculo'+lado,'achAbscessoDim3')+' cm','testiculo'+lado,'achAbscesso')}

// ── GERAÇÃO DO LAUDO ──
function updateLaudo() {
  const hd = [];
  const tec = estado.tecnica;
  const tD = estado.testiculoD;
  const tE = estado.testiculoE;
  const epi = estado.epididimos;
  const ple = estado.plexos;
  const liq = estado.liquido;
  const ach = estado.achados;

  // ── TÉCNICA ──
  let fraseTec = 'Exame realizado em aparelho dinâmico com transdutor linear de alta frequência, com avaliação pelo modo B e Doppler colorido/espectral.';
  const lims = [];
  if (tec.limEdema) lims.push('limitado parcialmente pelo acentuado edema escrotal');
  if (tec.limBiotipo) lims.push('limitado parcialmente pela intensa atenuação do feixe acústico inerente ao biotipo');
  if (lims.length) fraseTec = 'Exame realizado em aparelho dinâmico com transdutor linear de alta frequência, ' + lims.join(' e ') + '.';

  // ── TESTÍCULO D ──
  let fraseTestD = '';
  if (tD.sit === 'habitual') {
    fraseTestD += 'Testículo direito em topografia, morfologia e contornos habituais.';
    fraseTestD += buildParenquima('D', tD, hd);
    fraseTestD += buildDimensoes('D', tD, hd);
    fraseTestD += buildDoppler('D', tD, hd);
  } else if (tD.sit === 'criptorquidia') {
    const loc = {canal:'no canal inguinal',inguinal:'na região inguinal',nao_id:'não identificado ao presente estudo'}[tD.criLoc];
    fraseTestD = `Testículo direito não identificado na bolsa escrotal, sugerindo criptorquidia, localizado ${loc}.`;
    hd.push('Criptorquidia à direita.');
  } else if (tD.sit === 'orquiectomia') {
    fraseTestD = 'Ausência do testículo direito, compatível com status pós-orquiectomia.';
    if (tD.protese) fraseTestD += ' Observa-se presença de prótese testicular em topografia esperada.';
    hd.push('Ausência do testículo direito — status pós-orquiectomia.');
  }

  // ── TESTÍCULO E ──
  let fraseTestE = '';
  if (tE.sit === 'habitual') {
    fraseTestE += 'Testículo esquerdo em topografia, morfologia e contornos habituais.';
    fraseTestE += buildParenquima('E', tE, hd);
    fraseTestE += buildDimensoes('E', tE, hd);
    fraseTestE += buildDoppler('E', tE, hd);
  } else if (tE.sit === 'criptorquidia') {
    const loc = {canal:'no canal inguinal',inguinal:'na região inguinal',nao_id:'não identificado ao presente estudo'}[tE.criLoc];
    fraseTestE = `Testículo esquerdo não identificado na bolsa escrotal, sugerindo criptorquidia, localizado ${loc}.`;
    hd.push('Criptorquidia à esquerda.');
  } else if (tE.sit === 'orquiectomia') {
    fraseTestE = 'Ausência do testículo esquerdo, compatível com status pós-orquiectomia.';
    if (tE.protese) fraseTestE += ' Observa-se presença de prótese testicular em topografia esperada.';
    hd.push('Ausência do testículo esquerdo — status pós-orquiectomia.');
  }

  // Mesclar bilaterais
  mergeBilateral(hd, 'Criptorquidia à direita.', 'Criptorquidia à esquerda.', 'Criptorquidia bilateral.');
  mergeBilateral(hd, 'Microlitíase testicular à direita.', 'Microlitíase testicular à esquerda.', 'Microlitíase testicular bilateral.');
  mergeBilateral(hd, 'Cisto testicular à direita.', 'Cisto testicular à esquerda.', 'Cistos testiculares bilaterais.');
  mergeBilateral(hd, 'Ectasia da rede testis à direita.', 'Ectasia da rede testis à esquerda.', 'Ectasia da rede testis bilateral.');
  mergeBilateral(hd, 'Abscesso testicular à direita.', 'Abscesso testicular à esquerda.', 'Abscesso testicular bilateral.');
  mergeBilateral(hd, 'Cisto epidermoide à direita.', 'Cisto epidermoide à esquerda.', 'Cistos epidermoides bilaterais.');

  // ── EPIDÍDIMOS ──
  let fraseEpi = buildEpididimos(epi, hd);
  mergeBilateral(hd, 'Sinais de epididimite à direita.', 'Sinais de epididimite à esquerda.', 'Sinais de epididimite bilateral.');
  mergeBilateral(hd, 'Cisto no epidídimo direito.', 'Cisto no epidídimo esquerdo.', 'Cistos nos epidídimos bilateralmente.');

  // ── PLEXOS ──
  let fraseGrade = buildPlexos(ple, hd);
  mergeBilateral(hd, 'Sinais de varicocele à direita.', 'Sinais de varicocele à esquerda.', 'Sinais de varicocele bilateral.');
  mergeBilateral(hd, 'Sinais de varicocele à direita com refluxo ao Doppler.', 'Sinais de varicocele à esquerda com refluxo ao Doppler.', 'Sinais de varicocele bilateral com refluxo ao Doppler.');

  // ── LÍQUIDO ──
  let fraseLiq = buildLiquido(liq, hd);
  mergeBilateral(hd, 'Hidrocele à direita.', 'Hidrocele à esquerda.', 'Hidrocele bilateral.');

  // ── INDICAÇÃO ──
  let indicacaoHtml = '';
  if (tec.indicacao !== 'nc') {
    const mapInd = {edema:'Edema escrotal.',dor:'Dor testicular.',torcao:'Suspeita de torção testicular.',massa:'Massa palpável.',infertilidade:'Investigação de infertilidade.',outros:tec.indicacaoOutros||'—'};
    indicacaoHtml = `<div class="doc-secao"><span class="doc-label">INDICAÇÃO:</span><div class="doc-p">${mapInd[tec.indicacao]}</div></div>`;
  }

  // ── LIMITAÇÕES ──
  const limHtml = (tec.limEdema || tec.limBiotipo)
    ? `<div class="doc-p" style="color:#b45309;font-style:italic;">${fraseTec}</div>` : '';

  // ── CONCLUSÃO ──
  let conclusao = '';
  if (hd.length === 0) {
    conclusao = 'Estudo ecográfico sem evidentes anormalidades apreciáveis ao método.';
  } else {
    conclusao = hd.join('<br>');
    conclusao += '<br>Demais estruturas avaliadas sem evidentes anormalidades apreciáveis ao método.';
  }

  // ── ACHADOS ADD ──
  const achadosHtml = ach.texto ? `<div class="doc-secao"><span class="doc-label">ACHADOS ADICIONAIS:</span><div class="doc-p">${ach.texto}</div></div>` : '';

  // ── URGÊNCIA ──
  const urgHtml = tec.urgencia ? `<div class="doc-p" style="color:var(--red);font-weight:700;">⚠ Exame realizado em caráter de urgência.</div>` : '';

  document.getElementById('laudo-doc').innerHTML = `
    <div class="doc-titulo">ULTRASSONOGRAFIA DE BOLSA ESCROTAL</div>
    ${urgHtml}
    <div class="doc-secao">
      <span class="doc-label">TÉCNICA:</span>
      ${limHtml || `<div class="doc-p">${fraseTec}</div>`}
    </div>
    ${indicacaoHtml}
    <div class="doc-secao">
      <span class="doc-label">ANÁLISE:</span>
      <div class="doc-p">${fraseTestD}</div>
      <div class="doc-p">${fraseTestE}</div>
      <div class="doc-p">${fraseEpi}</div>
      <div class="doc-p">${fraseGrade}</div>
      <div class="doc-p">${fraseLiq}</div>
    </div>
    ${achadosHtml}
    <div class="doc-secao">
      <span class="doc-label">IMPRESSÃO DIAGNÓSTICA:</span>
      <div class="doc-p">${conclusao}</div>
    </div>`;
}

// ── BUILDERS ──
function buildParenquima(lado, t, hd) {
  const lat = lado === 'D' ? 'direito' : 'esquerdo';
  const achados = [];

  if (t.achCisto) {
    const m = fmtDims(t.achCistoDim1, t.achCistoDim2, t.achCistoDim3);
    achados.push(`imagem cística, de paredes finas e conteúdo anecoico, sem septos${m?' medindo '+m:''}`);
    hd.push(`Cisto testicular à ${lado==='D'?'direita':'esquerda'}.`);
  }
  if (t.achEctasia) {
    const c = t.achEctasiaCal ? parseFloat(t.achEctasiaCal).toFixed(1).replace('.',',')+' cm' : '—';
    achados.push(`múltiplas estruturas tubulares anecoicas no mediastino testicular (ectasia da rede testis), com calibre de até ${c}`);
    hd.push(`Ectasia da rede testis à ${lado==='D'?'direita':'esquerda'}.`);
  }
  if (t.achAbscesso) {
    const m = fmtDims(t.achAbscessoDim1, t.achAbscessoDim2, t.achAbscessoDim3);
    achados.push(`coleção com conteúdo heterogêneo, de paredes espessadas, compatível com abscesso${m?' medindo '+m:''}`);
    hd.push(`Abscesso testicular à ${lado==='D'?'direita':'esquerda'}.`);
  }
  if (t.achEpiCisto) {
    const m = fmtDims(t.achEpiCistoDim1, t.achEpiCistoDim2, t.achEpiCistoDim3);
    achados.push(`lesão com aspecto em camadas concêntricas ("casca de cebola"), sugestivo de cisto epidermoide${m?' medindo '+m:''}`);
    hd.push(`Cisto epidermoide à ${lado==='D'?'direita':'esquerda'}.`);
  }

  let frase = '';
  if (t.parenquima === 'homogeneo') {
    if (achados.length === 0) {
      frase = `\nParênquima testicular ${lat} de ecotextura homogênea, sem lesões focais.`;
    } else if (achados.length === 1) {
      frase = `\nParênquima testicular ${lat} de ecotextura homogênea, exceto por ${achados[0]}.`;
    } else {
      frase = `\nParênquima testicular ${lat} de ecotextura homogênea, com presença dos seguintes achados:\n- ${achados.join(';\n- ')}.`;
    }
  } else if (t.parenquima === 'heterogeneo') {
    hd.push(`Parênquima testicular ${lat} difusamente heterogêneo${achados.length?', com achados focais associados':''}.`);
    if (achados.length === 0) {
      frase = `\nParênquima testicular ${lat} apresentando ecotextura difusamente heterogênea, sem lesões focais definidas.`;
    } else if (achados.length === 1) {
      frase = `\nParênquima testicular ${lat} apresentando ecotextura difusamente heterogênea, com presença de ${achados[0]}.`;
    } else {
      frase = `\nParênquima testicular ${lat} apresentando ecotextura difusamente heterogênea, com presença dos seguintes achados:\n- ${achados.join(';\n- ')}.`;
    }
  } else if (t.parenquima === 'microlitiase') {
    hd.push(`Microlitíase testicular à ${lado==='D'?'direita':'esquerda'}.`);
    frase = `\nParênquima testicular ${lat} apresentando ecotextura heterogênea às custas de múltiplas calcificações puntiformes hiperecogênicas distribuídas pelo parênquima (padrão de microlitíase).`;
    if (achados.length === 1) frase += ` Além disso, ${achados[0]}.`;
    else if (achados.length > 1) frase += ` Achados adicionais:\n- ${achados.join(';\n- ')}.`;
  }
  return frase.replace(/\n/g, '<br>');
}

function buildDimensoes(lado, t, hd) {
  const lat = lado === 'D' ? 'direito' : 'esquerdo';
  const m = fmtDims(t.dim1, t.dim2, t.dim3);
  const vol = calcVol(t.dim1, t.dim2, t.dim3);
  if (!m) return '';
  const volStr = vol ? parseFloat(vol).toFixed(1).replace('.',',') + ' cm³' : '—';
  let frase = `\nDimensões testiculares`;
  if (vol !== null) {
    const v = parseFloat(vol);
    if (v < 7) { frase += ' reduzidas'; hd.push(`Redução volumétrica do testículo ${lat}.`); }
    else if (v > 23) { frase += ' aumentadas'; hd.push(`Aumento volumétrico do testículo ${lat}.`); }
    else frase += ' habituais';
  } else {
    frase += ' habituais';
  }
  frase += `, medindo ${m}, com volume estimado de ${volStr} (VR: 7–23 cm³).`;
  return '<br>' + frase.trim();
}

function buildDoppler(lado, t, hd) {
  const lat = lado === 'D' ? 'direito' : 'esquerdo';
  if (t.doppler === 'habitual') return '';
  if (t.doppler === 'aumentado') {
    hd.push(`Hipervascularização testicular ${lat} ao Doppler — padrão inflamatório/reativo.`);
    return `<br>Ao mapeamento Doppler, observa-se hipervascularização testicular ${lat}, com padrão compatível com processo inflamatório/reativo.`;
  }
  if (t.doppler === 'reduzido') {
    hd.push(`⚠ Fluxo testicular ${lat} reduzido/ausente ao Doppler — considerar torção testicular.`);
    return `<br><b>Ao mapeamento Doppler, observa-se redução/ausência do fluxo vascular intratesticular ${lat}, achado suspeito para torção testicular — correlacionar com quadro clínico com urgência.</b>`;
  }
  return '';
}

function buildEpididimos(epi, hd) {
  const mapD = {habitual:'habituais e ecotextura habitual',heterogenea:'habituais e ecotextura heterogênea',espessamento:'com espessamento focal da cabeça'};
  const mapE = {...mapD};

  if (epi.sitD === 'habitual' && epi.sitE === 'habitual') {
    return 'Epidídimos de dimensões habituais e ecotextura habitual.';
  }

  let frD = '', frE = '';
  if (epi.sitD === 'habitual') frD = 'Epidídimo direito de dimensões habituais e ecotextura habitual.';
  else if (epi.sitD === 'heterogenea') { frD = 'Epidídimo direito de dimensões habituais e ecotextura heterogênea.'; hd.push('Epidídimo direito de ecotextura heterogênea.'); }
  else if (epi.sitD === 'cisto') {
    const m = fmtDims(epi.cistoDDim1, epi.cistoDDim2, null) || '—';
    frD = `Epidídimo direito de dimensões habituais e ecotextura heterogênea às custas de imagem cística, de paredes finas e conteúdo anecoico, medindo aproximadamente ${m}.`;
    hd.push('Cisto no epidídimo direito.');
  } else if (epi.sitD === 'epididimite') { frD = 'Epidídimo direito de dimensões aumentadas e ecotextura difusamente heterogênea, com hipervascularização ao Doppler.'; hd.push('Sinais de epididimite à direita.'); }
  else if (epi.sitD === 'espessamento') { frD = 'Epidídimo direito com espessamento focal da cabeça.'; hd.push('Espessamento focal da cabeça do epidídimo direito.'); }

  if (epi.sitE === 'habitual') frE = 'Epidídimo esquerdo de dimensões habituais e ecotextura habitual.';
  else if (epi.sitE === 'heterogenea') { frE = 'Epidídimo esquerdo de dimensões habituais e ecotextura heterogênea.'; hd.push('Epidídimo esquerdo de ecotextura heterogênea.'); }
  else if (epi.sitE === 'cisto') {
    const m = fmtDims(epi.cistoEDim1, epi.cistoEDim2, null) || '—';
    frE = `Epidídimo esquerdo de dimensões habituais e ecotextura heterogênea às custas de imagem cística, de paredes finas e conteúdo anecoico, medindo aproximadamente ${m}.`;
    hd.push('Cisto no epidídimo esquerdo.');
  } else if (epi.sitE === 'epididimite') { frE = 'Epidídimo esquerdo de dimensões aumentadas e ecotextura difusamente heterogênea, com hipervascularização ao Doppler.'; hd.push('Sinais de epididimite à esquerda.'); }
  else if (epi.sitE === 'espessamento') { frE = 'Epidídimo esquerdo com espessamento focal da cabeça.'; hd.push('Espessamento focal da cabeça do epidídimo esquerdo.'); }

  return [frD, frE].filter(Boolean).join('<br>');
}

function buildPlexos(ple, hd) {
  if (ple.sitD === 'habitual' && ple.sitE === 'habitual') {
    return 'Plexos pampiniformes com calibre habitual.';
  }

  function fraseVarico(lado, sit, cal, vals, dur) {
    const lat = lado === 'D' ? 'direita' : 'esquerda';
    if (sit === 'habitual') return `Plexo pampiniforme à ${lat} com calibre habitual.`;
    if (sit === 'ectasia') {
      let fr = `Plexo pampiniforme à ${lat} com ectasia e tortuosidade das veias do plexo pampiniforme`;
      if (cal && parseFloat(cal) > 0) fr += `, calibre máximo de ${parseFloat(cal).toFixed(1).replace('.',',')} mm`;
      if (vals === 'sem') {
        fr += ', sem refluxo detectável à manobra de Valsalva.';
        hd.push(`Sinais de varicocele à ${lat}.`);
      } else if (vals === 'com') {
        if (dur === 'menor') { fr += ', com refluxo de duração inferior a 3 segundos à manobra de Valsalva.'; }
        else if (dur === 'maior') { fr += ', com refluxo de duração superior a 3 segundos à manobra de Valsalva.'; }
        else { fr += ', com refluxo detectável à manobra de Valsalva.'; }
        fr += '';
        hd.push(`Sinais de varicocele à ${lat} com refluxo ao Doppler.`);
      } else {
        fr += '.';
        hd.push(`Sinais de varicocele à ${lat}.`);
      }
      return fr;
    }
    return '';
  }

  const frD = fraseVarico('D', ple.sitD, ple.calibreD, ple.valsalvaD, ple.duracaoD);
  const frE = fraseVarico('E', ple.sitE, ple.calibreE, ple.valsalvaE, ple.duracaoE);
  return [frD, frE].filter(Boolean).join('<br>');
}

function buildLiquido(liq, hd) {
  const mapAsp = {anecoico:'de aspecto anecoico',septacoes:'com septações',debris:'com debris',septdebris:'com septações e debris'};
  if (liq.sitD === 'fisio' && liq.sitE === 'fisio') {
    return 'Líquido em quantidade fisiológica na bolsa testicular.';
  }
  let parts = [];
  if (liq.sitD === 'hidrocele') {
    parts.push(`presença de ${liq.qtdD} quantidade de líquido ${mapAsp[liq.aspD]} na hemibolsa direita`);
    hd.push('Hidrocele à direita.');
  }
  if (liq.sitE === 'hidrocele') {
    parts.push(`presença de ${liq.qtdE} quantidade de líquido ${mapAsp[liq.aspE]} na hemibolsa esquerda`);
    hd.push('Hidrocele à esquerda.');
  }
  if (parts.length === 1) {
    // capitalize first letter
    return parts[0].charAt(0).toUpperCase() + parts[0].slice(1) + '.';
  }
  return 'Presença de ' + parts[0].replace('presença de ','') + ' e ' + parts[1].replace('presença de ','') + '.';
}

function mergeBilateral(hd, itemD, itemE, itemBi) {
  if (hd.includes(itemD) && hd.includes(itemE)) {
    const iD = hd.indexOf(itemD), iE = hd.indexOf(itemE);
    hd.splice(Math.min(iD,iE), 1);
    hd.splice(Math.max(iD,iE)-1, 1);
    hd.push(itemBi);
  }
}

// --- INÃCIO: FUNÃ‡Ã•ES DE CÃ“PIA RICH-TEXT (PadrÃ£o ObstÃ©trico) ---
function _copyLaudoRichText(sourceEl, callback) {
  var clone = sourceEl.cloneNode(true);
  var RELEVANT_PROPS = [
    'font-family', 'font-size', 'font-weight', 'font-style',
    'line-height', 'text-align', 'text-indent', 'text-decoration',
    'vertical-align', 'white-space', 'display',
    'margin-top', 'margin-right', 'margin-bottom', 'margin-left',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'list-style', 'list-style-type',
    'border-collapse', 'border-spacing'
  ];
  var originalEls = sourceEl.querySelectorAll('*');
  var cloneEls    = clone.querySelectorAll('*');

  _inlineComputedStyles(sourceEl, clone, RELEVANT_PROPS, true);
  for (var i = 0; i < originalEls.length; i++) {
    _inlineComputedStyles(originalEls[i], cloneEls[i], RELEVANT_PROPS, false);
  }

  clone.style.backgroundColor = '#ffffff';
  clone.style.color = '#000000';
  clone.removeAttribute('id');
  clone.removeAttribute('contenteditable');

  var htmlContent = clone.outerHTML;
  var plainText = sourceEl.innerText || sourceEl.textContent || '';

  if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
    try {
      var htmlBlob = new Blob([htmlContent], { type: 'text/html' });
      var textBlob = new Blob([plainText],   { type: 'text/plain' });
      navigator.clipboard.write([
        new ClipboardItem({
          'text/html': htmlBlob,
          'text/plain': textBlob
        })
      ]).then(function() {
        callback(true);
      }).catch(function() {
        _fallbackCopy(htmlContent, plainText, callback);
      });
      return;
    } catch (e) {
    }
  }
  _fallbackCopy(htmlContent, plainText, callback);
}

function _inlineComputedStyles(originalEl, cloneEl, props, isRoot) {
  if (!originalEl || !cloneEl) return;
  if (originalEl.nodeType !== 1 || cloneEl.nodeType !== 1) return;
  var computed = window.getComputedStyle(originalEl);
  for (var i = 0; i < props.length; i++) {
    var prop = props[i];
    var val  = computed.getPropertyValue(prop);
    if (val) {
      cloneEl.style.setProperty(prop, val);
    }
  }
  var bgColor = computed.getPropertyValue('background-color');
  if (bgColor) {
    var bgRgb = _parseRGB(bgColor);
    if (!bgRgb || _isTransparent(bgColor)) {
      cloneEl.style.backgroundColor = 'transparent';
    } else if (bgRgb.r > 200 && bgRgb.g > 200 && bgRgb.b > 200) {
      cloneEl.style.backgroundColor = '#ffffff';
    } else {
      cloneEl.style.backgroundColor = isRoot ? '#ffffff' : 'transparent';
    }
  }
  var textColor = computed.getPropertyValue('color');
  if (textColor) {
    var textRgb = _parseRGB(textColor);
    if (!textRgb || textRgb.r > 100 || textRgb.g > 100 || textRgb.b > 100) {
      cloneEl.style.color = '#000000';
    } else {
      cloneEl.style.color = textColor;
    }
  }
  var tag = originalEl.tagName.toLowerCase();
  if (tag === 'td' || tag === 'th' || tag === 'table') {
    var borderProps = ['border-top', 'border-right', 'border-bottom', 'border-left', 'border'];
    for (var j = 0; j < borderProps.length; j++) {
      var bv = computed.getPropertyValue(borderProps[j]);
      if (bv) {
        cloneEl.style.setProperty(borderProps[j], bv);
      }
    }
  }
  cloneEl.removeAttribute('class');
}

function _fallbackCopy(htmlContent, plainText, callback) {
  var container = document.createElement('div');
  container.innerHTML = htmlContent;
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.opacity = '0';
  document.body.appendChild(container);
  var range = document.createRange();
  range.selectNodeContents(container);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  sel.removeAllRanges();
  document.body.removeChild(container);
  callback(ok);
}

function _isTransparent(colorStr) {
  if (!colorStr) return true;
  if (colorStr === 'transparent') return true;
  var m = colorStr.match(/rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*([\d.]+)\s*\)/);
  if (m && parseFloat(m[4]) === 0) return true;
  return false;
}

function _parseRGB(colorStr) {
  if (!colorStr) return null;
  var m = colorStr.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return { r: parseInt(m[1]), g: parseInt(m[2]), b: parseInt(m[3]) };
  if (colorStr.charAt(0) === '#') {
    var hex = colorStr.replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    if (hex.length === 6) {
      return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
    }
  }
  return null;
}
