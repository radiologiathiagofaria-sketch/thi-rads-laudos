<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thi-Rads — Abdome Total</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a56db;--blue-dark:#1140a6;--blue-light:#e8f0fe;--blue-mid:#dbeafe;
  --surface:#f4f6fb;--border:#e2e6ef;--border-strong:#c8cfe0;
  --text:#1a1f2e;--text-2:#4b5570;--text-3:#8892a4;
  --white:#ffffff;--green:#059669;--red:#dc2626;--radius:8px;--radius-lg:12px;
}
body.dark{
  --blue:#4d86f5;--blue-dark:#3a6fd4;--blue-light:#1e2d4a;--blue-mid:#1e2d4a;
  --surface:#141820;--border:#2a2f3d;--border-strong:#3a4155;
  --text:#e2e6f0;--text-2:#9aa3b8;--text-3:#5d6680;
  --white:#1e2230;--green:#34d399;--red:#f87171;
}
/* Laudo panel: texto branco no modo escuro */
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:#1e2230;border-left-color:var(--border);}
body.dark .laudo-body{background:#1e2230;}
body.dark .laudo-header{background:#1e2230;border-bottom-color:var(--border);}
/* Ao imprimir: força texto preto */
@media print{body.dark .laudo-doc,body.dark .laudo-doc *{color:#111 !important;}}
/* Botão dark mode */
body.dark .btn-dark{background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover{background:#343a4d;color:#fff;}
/* Elementos interativos no dark */
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text]{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .radio-mark{background:var(--white);}
body.dark .check-box{background:var(--white);}
body.dark .sub-opts{background:#1a2040;border-bottom-color:#2a3460;}
body.dark .sub-opt-label{background:var(--white);color:var(--text-2);}
body.dark .lesao-card{background:#141820;border-color:var(--border);}
body.dark .toolbar{background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar{background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd{border-bottom-color:var(--border);}
body.dark .block{background:var(--white);border-color:var(--border);}
body.dark .block-title{background:var(--white);border-bottom-color:var(--border);}
body.dark .radio-opt:hover{background:#1e2d4a;}
body.dark .radio-opt.selected{background:#1e2d4a;}
body.dark .check-row{background:#1a1f2e;}
body.dark .check-row:hover{background:#1e2d4a;}
body.dark .check-row.selected{background:#1e2d4a;}
body.dark .btn-add-lesao{background:var(--white);color:var(--text-2);border-color:var(--border-strong);}
body.dark .sel-tag{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .btn-danger{background:#2d1a1a;border-color:#6b2929;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:10px;height:48px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:6px;margin-right:12px;}
.logo-name{font-size:17px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:.2px;}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);font-weight:500;transition:all .13s;background:var(--white);color:var(--text-2);}
.btn:hover{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.btn-danger{background:#fff5f5;color:var(--red);border-color:#fecaca;}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:136px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.sidebar-titulo{font-size:11px;font-weight:600;color:var(--text);}
.nav-group{padding:6px 0;}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:11.5px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:2px solid transparent;}
.nav-item:hover{background:var(--blue-light);color:var(--blue);}
.nav-item.active{background:var(--blue-light);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}
.panel{width:480px;flex-shrink:0;overflow-y:auto;padding:14px 14px 20px;background:var(--surface);}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';display:block;width:3px;height:16px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:10px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;padding:8px 14px 7px;border-bottom:1px solid var(--border);background:var(--white);}
.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:#f5f8ff;}
.radio-opt.selected{background:var(--blue-light);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;font-size:12.5px;color:var(--text-2);line-height:1.4;cursor:pointer;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:500;}
.radio-mark{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
.radio-opt.selected .radio-mark::after{opacity:1;}
.check-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;background:#fafbff;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:#f0f5ff;}
.check-row.selected{background:#e6eeff;}
.check-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
.check-label{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px 8px 32px;font-size:12px;color:var(--text-2);cursor:pointer;}
.check-row.selected .check-label{color:var(--blue);font-weight:500;}
.check-box{width:15px;height:15px;border-radius:4px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:9px;height:9px;}
.check-row.selected .check-box svg{display:block;}
.sub-opts{display:none;padding:8px 14px 9px 32px;gap:16px;background:#eef3ff;border-bottom:1px solid #d0dcff;flex-wrap:wrap;}
.sub-opt-label{font-size:12px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:var(--white);transition:all .12s;}
.sub-opt-label:has(input:checked){background:var(--blue);color:#fff;border-color:var(--blue);}
.sub-opt-label input{position:absolute;opacity:0;pointer-events:none;}
.sel-tag{font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 6px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:5px;cursor:pointer;}
.dim-rows{padding:8px 14px;display:flex;flex-direction:column;gap:6px;}
.dim-row{display:flex;align-items:center;gap:10px;}
.dim-lbl{flex:1;font-size:12px;color:var(--text-2);}
.dim-input{width:60px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.dim-unit{font-size:12px;color:var(--text-3);}
.lesoes-wrap{padding:8px 14px;display:flex;flex-direction:column;gap:7px;}
.btn-add-lesao{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;transition:all .12s;border:1.5px dashed var(--border-strong);background:var(--white);color:var(--text-2);width:100%;justify-content:center;}
.btn-add-lesao:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
.lesao-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.lesao-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.lesao-hd-title{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;}
.btn-rem{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:4px;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;border:1px solid #fecaca;background:#fff5f5;color:var(--red);transition:all .12s;}
.btn-rem:hover{background:#fee2e2;}
.ff-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.ff{display:flex;flex-direction:column;gap:2px;}
.ff label{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.ff select,.ff input[type=text]{font-size:11px;padding:4px 7px;border:1px solid var(--border-strong);border-radius:5px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);}
.ff select:focus,.ff input:focus{outline:none;border-color:var(--blue);}
.ff input[type=text]{width:58px;text-align:center;}
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
.laudo-doc:focus { outline: none; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-thirads.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudos estruturados</span></div>
  <button class="btn" onclick="window.location.href='../laudo-thirads.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>
  <div class="tb-sep"></div>
  <button class="btn" onclick="copiar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copiar laudo</button>
  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>
  <button class="btn btn-dark" id="btn-dark-toggle" onclick="toggleDark()" style="margin-left:auto;"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro</button>
  <button class="btn btn-danger" onclick="reiniciar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 1.5-3.9M2 4v4h4"/></svg>Reiniciar</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd"><div class="sidebar-tipo">Ultrassonografia</div><div class="sidebar-titulo">Abdome Total</div></div>
    <div class="nav-group">
      <div class="nav-item" id="nav-figado" onclick="showSection('figado')"><span class="nav-dot"></span>Fígado</div>
      <div class="nav-item" id="nav-veias" onclick="showSection('veias')"><span class="nav-dot"></span>Veias Hepáticas</div>
      <div class="nav-item" id="nav-porta" onclick="showSection('porta')"><span class="nav-dot"></span>Veia Porta</div>
      <div class="nav-item" id="nav-biliares" onclick="showSection('biliares')"><span class="nav-dot"></span>Vias Biliares</div>
      <div class="nav-item" id="nav-vesicula" onclick="showSection('vesicula')"><span class="nav-dot"></span>Vesícula Biliar</div>
      <div class="nav-item" id="nav-pancreas" onclick="showSection('pancreas')"><span class="nav-dot"></span>Pâncreas</div>
      <div class="nav-item" id="nav-baco" onclick="showSection('baco')"><span class="nav-dot"></span>Baço</div>
      <div class="nav-item" id="nav-rins" onclick="showSection('rins')"><span class="nav-dot"></span>Rins</div>
      <div class="nav-item" id="nav-bexiga" onclick="showSection('bexiga')"><span class="nav-dot"></span>Bexiga</div>
      <div class="nav-item" id="nav-aorta" onclick="showSection('aorta')"><span class="nav-dot"></span>Aorta</div>
      <div class="nav-item" id="nav-alcas" onclick="showSection('alcas')"><span class="nav-dot"></span>Alças / Apêndice</div>
      <div class="nav-item" id="nav-liquido" onclick="showSection('liquido')"><span class="nav-dot"></span>Líquido Livre</div>
    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

<script>
const SEGS=['I','II','III','IV','IVa','IVb','V','VI','VII','VIII'];
const TERCOS=['terço superior','terço médio','terço inferior'];
const POLOS_BACO=['polo superior','polo inferior','polo médio','região central'];
const LOCS_CALC=['terço superior','terço médio','terço inferior','junção ureterovesical','junção ureteropiélica','ureter proximal','ureter médio','ureter distal'];

const estado = {
  figado:   {sit:'habitual',grauEst:'nao_esp',hmAssoc:false,presCheck:false,presPeriv:false,presPortal:false,presSub:false,tipoHm:'difusa',dimLd:'',dimLe:'',dimLc:'',lesoes:[]},
  veias:    {sit:'habitual',medida:''},
  porta:    {sit:'habitual',medida:''},
  biliares: {sit:'habitual',medDBC:'',medCalc:'',dilatacaoIntra:false},
  vesicula: {sit:'habitual',espParede:'',dimL:'',dimT:'',murphy:false,calculos:'nenhum',calcMedida:'',calcMaior:'',infundibulo:false,polipos:'nenhum',polipLoc:'',polipMed:'',polipMaiorMed:''},
  pancreas: {sit:'habitual',ducto:false,medDucto:''},
  baco:     {sit:'habitual',eco:'homogenea',medIdx:'',lesoes:[]},
  rins:     {sit:'habitual',lado:'bilateral',tercoMaior:'terço superior',rimMaior:'direito',medCisto:'',tipoCisto:'simples',localCisto:'terço superior cortical',ladoCisto:'direito',dimRD1:'',dimRD2:'',dimRD3:'',parRD:'',dimRE1:'',dimRE2:'',dimRE3:'',parRE:'',lesoes:[],dilDir:false,dilDirGrau:'discreta',dilDirUreter:false,dilEsq:false,dilEsqGrau:'discreta',dilEsqUreter:false},
  bexiga:   {sit:'habitual',espParede:'',m1:'',m2:'',m3:'',conteudo:'homogeneo',debris:false,coagulo:false,coagM1:'',coagM2:'',coagM3:'',calculo:false,calcM1:'',calcM2:'',calcM3:'',lesao:false,lesaoLoc:'assoalho vesical',lesaoM1:'',lesaoM2:'',lesaoM3:'',doppler:false,volPre:'',volPos:''},
  aorta:    {sit:'habitual',medEctasia:'',aneurPos:'abaixo',aneurM1:'',aneurM2:'',aneurM3:'',trombo:false,tromboMed:''},
  alcas:    {apendice:'nao_citar',apendMed:'',intuss:false,intussLoc:'hipocôndrio direito',intussM1:'',intussM2:'',divert:false,divertLoc:'cólon sigmóide',divertExt:'',geca:false},
  liquido:  {sit:'ausente',qtd:'discreta',aspecto:'anecoico',local:'abdome'},
};

let secaoAtual='figado', lesaoId=0;

function showSection(sec){
  secaoAtual=sec;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+sec).classList.add('active');
  renderPanel(sec);
  updateLaudo();
}

function renderPanel(sec){
  const p=document.getElementById('main-panel');
  const titles={figado:'Fígado',veias:'Veias Hepáticas',porta:'Veia Porta',biliares:'Vias Biliares',vesicula:'Vesícula Biliar',pancreas:'Pâncreas',baco:'Baço',rins:'Rins',bexiga:'Bexiga',aorta:'Aorta',alcas:'Alças / Apêndice',liquido:'Líquido Livre'};
  let html=`<div class="sec-title">${titles[sec]}</div>`;
  if(sec==='figado') html+=renderFigado();
  else if(sec==='veias') html+=renderVeias();
  else if(sec==='porta') html+=renderPorta();
  else if(sec==='biliares') html+=renderBiliares();
  else if(sec==='vesicula') html+=renderVesicula();
  else if(sec==='pancreas') html+=renderPancreas();
  else if(sec==='baco') html+=renderBaco();
  else if(sec==='rins') html+=renderRins();
  else if(sec==='bexiga') html+=renderBexiga();
  else if(sec==='aorta') html+=renderAorta();
  else if(sec==='alcas') html+=renderAlcas();
  else if(sec==='liquido') html+=renderLiquido();
  p.innerHTML=html;
}

function selTag(id,opts,val,onchange){
  return `<select class="sel-tag" id="${id}" onchange="${onchange}" onclick="event.stopPropagation()">${opts.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`;
}
function dimRow(id,label,val,unit='cm'){
  return `<div class="dim-row"><span class="dim-lbl">${label}</span><input class="dim-input" type="text" id="${id}" value="${val}" placeholder="—" oninput="setDim('${id}',this.value)"><span class="dim-unit">${unit}</span></div>`;
}
function radioOpt(id,sit,label,extra=''){
  return `<div class="radio-opt ${estado[secaoAtual]?.sit===sit?'selected':''}" id="opt-${id}" onclick="setSit('${sit}')"><input type="radio" name="sit_${secaoAtual}"><label class="radio-label"><span class="radio-mark"></span>${label}${extra}</label></div>`;
}
function chkRow(id,label,checked,onchange,indent=true){
  return `<div class="check-row ${checked?'selected':''}" onclick="toggleChk('${id}')"><input type="checkbox" id="${id}" ${checked?'checked':''}><label class="check-label" ${indent?'style="padding-left:28px;"':''}><span class="check-box"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M1.5 5l2.5 2.5 4.5-4.5"/></svg></span>${label}</label></div>`;
}

// ── FÍGADO (igual ao abdome superior) ──
function renderFigado(){
  const e=estado.figado; const isSit=v=>e.sit===v?'selected':'';
  return `
  <div class="block"><div class="block-title">Situação</div>
    <div class="radio-opt ${isSit('habitual')}" onclick="setSit('habitual')"><input type="radio" name="sit_fig"><label class="radio-label"><span class="radio-mark"></span>habitual</label></div>
    <div class="radio-opt ${isSit('esteatose')}" onclick="setSit('esteatose')"><input type="radio" name="sit_fig"><label class="radio-label"><span class="radio-mark"></span>esteatose hepática ${selTag('grau-est',[{v:'nao_esp',l:'grau não especificado'},{v:'leve',l:'leve'},{v:'moderado',l:'moderado'},{v:'acentuado',l:'acentuado'}],e.grauEst,"setVal('figado','grauEst',this.value)")}</label></div>

function renderLesoeRins(){

      <div class="lesao-hd"><span class="lesao-hd-title">${tipo} ${l.id}</span><button class="btn-rem" onclick="remLesaoRim(${l.id})">✕ remover</button></div>
      <div class="ff-grid">
        <div class="ff"><label>Rim</label><select onchange="updLesaoRim(${l.id},'rim',this.value)"><option value="direito" ${l.rim==='direito'?'selected':''}>direito</option><option value="esquerdo" ${l.rim==='esquerdo'?'selected':''}>esquerdo</option></select></div>
        <div class="ff"><label>Localização</label><select onchange="updLesaoRim(${l.id},'loc',this.value)">${LOCS_CALC.map(lc=>`<option value="${lc}" ${l.loc===lc?'selected':''}>${lc}</option>`).join('')}</select></div>

    ${tipo==='nodulo'?`<div class="ff"><label>Composição</label><select onchange="updLesaoFig(${l.id},'comp',this.value)"><option value="sólido" ${l.comp==='sólido'?'selected':''}>sólido</option><option value="sólido-cístico" ${l.comp==='sólido-cístico'?'selected':''}>sólido-cístico</option></select></div><div class="ff"><label>Ecogen.</label><select onchange="updLesaoFig(${l.id},'eco',this.value)"><option value="hipoecoico" ${l.eco==='hipoecoico'?'selected':''}>hipoecoico</option><option value="hiperecoico" ${l.eco==='hiperecoico'?'selected':''}>hiperecoico</option><option value="isoecoico" ${l.eco==='isoecoico'?'selected':''}>isoecoico</option></select></div><div class="ff"><label>Contornos</label><select onchange="updLesaoFig(${l.id},'contornos',this.value)"><option value="regulares" ${l.contornos==='regulares'?'selected':''}>regulares</option><option value="indefinidos" ${l.contornos==='indefinidos'?'selected':''}>indefinidos</option><option value="irregulares" ${l.contornos==='irregulares'?'selected':''}>irregulares</option></select></div>`:''}
    </div><div class="ff-grid">${['m1','m2','m3'].map((m,i)=>`<div class="ff"><label>Med.${i+1} (cm)</label><input type="text" value="${l[m]}" oninput="updLesaoFig(${l.id},'${m}',this.value)" placeholder="—"></div>`).join('')}</div></div>`).join('');
}
function addLesaoFig(tipo){const b={id:++lesaoId,tipo,seg:'I',m1:'',m2:'',m3:''};if(tipo==='cisto')Object.assign(b,{subtipo:'simples',paredes:'lisas'});if(tipo==='nodulo')Object.assign(b,{comp:'sólido',eco:'hipoecoico',contornos:'regulares'});estado.figado.lesoes.push(b);renderPanel('figado');updateLaudo();}
function remLesaoFig(id){estado.figado.lesoes=estado.figado.lesoes.filter(l=>l.id!==id);renderPanel('figado');updateLaudo();}

function medStr(l){const p=[l.m1,l.m2,l.m3].filter(m=>m&&m.trim()!=='');return p.length?`, medindo ${p.join(' x ')} cm`:''}
function vol(a,b,c){const v=parseFloat(a)*parseFloat(b)*parseFloat(c)*0.523;return isNaN(v)?null:v.toFixed(1);}

// ── UPDATE LAUDO ──
function updateLaudo(){
  const f=estado.figado,ve=estado.veias,po=estado.porta,bi=estado.biliares,vs=estado.vesicula,pa=estado.pancreas,ba=estado.baco,ri=estado.rins,bx=estado.bexiga,ao=estado.aorta,al=estado.alcas,li=estado.liquido;

  // ── FÍGADO ──
  const cistos=f.lesoes.filter(l=>l.tipo==='cisto'),nodulos=f.lesoes.filter(l=>l.tipo==='nodulo'),calcs=f.lesoes.filter(l=>l.tipo==='calc');
  const temLF=cistos.length+nodulos.length+calcs.length>0,ecoFig=temLF?'heterogênea':'homogênea';
  const prefHm={difusa:'Fígado com dimensões aumentadas difusamente, contornos regulares e bordos rombos.',direito:'Fígado com dimensões aumentadas à custa do lobo direito, contornos regulares e bordos rombos.',esquerdo:'Fígado com dimensões aumentadas à custa do lobo esquerdo, contornos regulares e bordos rombos.'};
  const locPres=[f.presPeriv&&'perivesicular',f.presPortal&&'periportal',f.presSub&&'subcapsular'].filter(Boolean);
  let fraseFig='',opFig='';
  if(f.sit==='habitual') fraseFig=`Fígado com dimensões normais, contornos regulares e bordos finos. A ecotextura do parênquima hepático encontra-se ${ecoFig}.`;
  else if(f.sit==='esteatose'){const gOp={nao_esp:'',leve:' grau leve',moderado:' grau moderado',acentuado:' grau acentuado'}[f.grauEst];const pref=f.hmAssoc?prefHm.difusa:'Fígado com dimensões normais, contornos regulares e bordos finos.';const suf=f.grauEst==='leve'?` Nota-se leve aumento difuso de sua ecogenicidade. A ecotextura do parênquima hepático encontra-se ${ecoFig}.`:` Nota-se ${f.grauEst==='nao_esp'?'':f.grauEst+' '}aumento difuso de sua ecogenicidade, com atenuação posterior do feixe sonoro, dificultando a caracterização de lesões focais. A ecotextura do parênquima hepático encontra-se ${ecoFig}.`;fraseFig=pref+suf;opFig=`Achados ultrassonográficos sugestivos de esteatose hepática${gOp}${f.hmAssoc?', associado a hepatomegalia difusa':''}${f.presCheck&&locPres.length?', associado a áreas de preservação focal':''}.`;}
  else if(f.sit==='hm'){fraseFig=`${prefHm[f.tipoHm]} A ecotextura do parênquima hepático encontra-se ${ecoFig}.`;opFig='Hepatomegalia.';}

  else if(f.sit==='hc_av'){fraseFig='Fígado com dimensões reduzidas, contornos irregulares e bordos rombos. A ecotextura do parênquima hepático encontra-se difusamente heterogênea.';opFig='Sinais ecográficos compatíveis com hepatopatia crônica.';}
  const frasePresRvacao=(f.sit==='esteatose'&&f.presCheck&&locPres.length)?` Nota-se áreas hipoecoicas de margens geográficas/anguladas, localizadas na região ${locPres.join(', ')} e que não promovem distorção de estruturas adjacentes ou deslocamento de vasos.`:'';
  const fraseBase=fraseFig.replace(/ A ecotextura do parênquima hepático encontra-se (homo|hetero)gênea\./,'');
  let opLF=[];
  const totLF=cistos.length+nodulos.length+calcs.length;
  if(totLF===0) fraseFig=fraseBase+(f.sit==='hc_inc'||f.sit==='hc_av'?'':` A ecotextura do parênquima hepático encontra-se ${ecoFig}.`)+frasePresRvacao;
  else if(totLF===1){const it=f.lesoes[0];if(it.tipo==='cisto'){fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de cisto ${it.subtipo} de paredes ${it.paredes}, localizado em segmento ${it.seg}${medStr(it)}.`+frasePresRvacao;opLF.push(`Cisto hepático ${it.subtipo}.`);}else if(it.tipo==='nodulo'){fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de nódulo ${it.comp}, ${it.eco}, de contornos ${it.contornos}, localizado em segmento ${it.seg}${medStr(it)}.`+frasePresRvacao;opLF.push(it.eco==='hiperecoico'?'Nódulo hepático hiperecoico, achado comumente relacionado a hemangiomas.':'Nódulo hepático indefinido ao método. Sugere-se, a critério clínico, complementação com método axial (tomografia computadorizada ou ressonância magnética) para melhor caracterização do achado.');}else{fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de calcificação localizada em segmento ${it.seg}${medStr(it)}.`+frasePresRvacao;opLF.push('Calcificação hepática residual.');}}
  else{const sC=nodulos.length===0&&calcs.length===0,sN=cistos.length===0&&calcs.length===0,sK=cistos.length===0&&nodulos.length===0;if(sC){fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de cistos assim descritos:\n${cistos.map(c=>`- em segmento ${c.seg}, cisto ${c.subtipo} de paredes ${c.paredes}${medStr(c)};`).join('\n')}`+frasePresRvacao;opLF.push('Múltiplos cistos hepáticos.');}else if(sN){const ig=nodulos.every(n=>n.comp===nodulos[0].comp&&n.eco===nodulos[0].eco&&n.contornos===nodulos[0].contornos);if(ig){const n=nodulos[0],maior=nodulos.reduce((a,b)=>(parseFloat(a.m1)||0)>=(parseFloat(b.m1)||0)?a:b);fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de múltiplos nódulos ${n.comp}, ${n.eco}, de contornos ${n.contornos}, o maior localizado em segmento ${maior.seg}${medStr(maior)}.`+frasePresRvacao;opLF.push('Múltiplos nódulos hepáticos indefinidos ao método. Sugere-se, a critério clínico, complementação com método axial (tomografia computadorizada ou ressonância magnética) para melhor caracterização dos achados.');}else{fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de nódulos assim descritos:\n${nodulos.map(n=>`- em segmento ${n.seg}, nódulo ${n.comp}, ${n.eco}, de contornos ${n.contornos}${medStr(n)};`).join('\n')}`+frasePresRvacao;opLF.push('Nódulos hepáticos indefinidos ao método. Sugere-se, a critério clínico, complementação com método axial (tomografia computadorizada ou ressonância magnética) para melhor caracterização dos achados.');}}else if(sK){const maior=calcs.reduce((a,b)=>(parseFloat(a.m1)||0)>=(parseFloat(b.m1)||0)?a:b);fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de múltiplas calcificações, a maior localizada em segmento ${maior.seg}${medStr(maior)}.`+frasePresRvacao;opLF.push('Calcificações hepáticas residuais.');}else{const linhas=[];cistos.forEach(c=>linhas.push(`- em segmento ${c.seg}, cisto ${c.subtipo} de paredes ${c.paredes}${medStr(c)};`));nodulos.forEach(n=>linhas.push(`- em segmento ${n.seg}, nódulo ${n.comp}, ${n.eco}, de contornos ${n.contornos}${medStr(n)};`));calcs.forEach(c=>linhas.push(`- em segmento ${c.seg}, calcificação${medStr(c)};`));fraseFig=fraseBase+` A ecotextura do parênquima hepático encontra-se heterogênea à custa de lesões focais assim descritas:\n${linhas.join('\n')}`+frasePresRvacao;if(cistos.length===1)opLF.push(`Cisto hepático ${cistos[0].subtipo}.`);else if(cistos.length>1)opLF.push('Múltiplos cistos hepáticos.');const hip=nodulos.filter(n=>n.eco==='hiperecoico'),out=nodulos.filter(n=>n.eco!=='hiperecoico');if(hip.length>0)opLF.push('Nódulo hepático hiperecoico, achado comumente relacionado a hemangiomas.');if(out.length===1)opLF.push('Nódulo hepático indefinido ao método. Sugere-se, a critério clínico, complementação com método axial (tomografia computadorizada ou ressonância magnética) para melhor caracterização do achado.');else if(out.length>1)opLF.push('Nódulos hepáticos indefinidos ao método. Sugere-se, a critério clínico, complementação com método axial (tomografia computadorizada ou ressonância magnética) para melhor caracterização dos achados.');if(calcs.length===1)opLF.push('Calcificação hepática residual.');else if(calcs.length>1)opLF.push('Calcificações hepáticas residuais.');}}
  let dimFig='';
  if(f.dimLd||f.dimLe||f.dimLc){const p=[];if(f.dimLd)p.push(`o lobo direito mede ${f.dimLd} cm no seu maior eixo longitudinal`);if(f.dimLe)p.push(`o lobo esquerdo mede ${f.dimLe} cm`);if(f.dimLc)p.push(`o lobo caudado mede ${f.dimLc} cm`);const t=p.join(', ');dimFig=t.charAt(0).toUpperCase()+t.slice(1)+'.';}
  const pFig=fraseFig.split('\n');

  // ── VEIAS ──
  let frVeias='';
  if(ve.sit==='habitual_med') frVeias=`Veias hepáticas de distribuição e calibre habituais${ve.medida?`, medindo ${ve.medida} cm (VR até 1,0 cm)`:''}. `;

  else if(bi.sit==='dil_dbc_calc'){frBil=`${bi.dilatacaoIntra?'Dilatação das vias biliares intra-hepáticas. ':'Ausência de dilatação das vias biliares intra-hepáticas. '}Ducto biliar comum com calibre aumentado, medindo cerca de ${bi.medDBC||'_'} cm, à custa de cálculo localizado em segmento distal medindo cerca de ${bi.medCalc||'_'} cm.`;opBil=bi.dilatacaoIntra?'Coledocolitíase associada a dilatação de vias biliares intra e extra-hepáticas.':'Coledocolitíase.';}

  // ── VESÍCULA ──

  else if(vs.sit==='esp_reacional'){const causaR=vs.espReacionalCausa||'_';frVes=`A vesícula biliar apresenta espessamento das suas paredes, medindo ${vs.espParede||'_'} cm (VR ≤0,4 cm), conteúdo anecóide e homogêneo, achado que pode estar relacionado ao quadro de ${causaR}, na dependência de correlação com dados clínicos.`;opVes=`Espessamento parietal vesicular, podendo estar relacionado ao quadro ${causaR}.`;}

    const infStr=vs.infundibulo?', impactado no infundíbulo':'';
    if(vs.calculos==='lama'){frCalc=' Em seu interior destacam-se conteúdo ecogênico formando nível líquido-debris e móvel às mudanças de decúbito.';opCalc='Lama biliar.';}
    else if(vs.calculos==='unico'){frCalc=` Em seu interior destaca-se cálculo único${vs.calcMedida?` medindo cerca de ${vs.calcMedida} cm`:''}${infStr}, promovendo sombra acústica posterior, móvel à mudança de decúbito.`;opCalc='Colecistolitíase.';}
    else if(vs.calculos==='mult_sub'){frCalc=` Em seu interior destacam-se múltiplos cálculos subcentimétricos${vs.infundibulo?', com um cálculo impactado no infundíbulo':''}, promovendo sombra acústica posterior, móveis à mudança de decúbito.`;opCalc='Colecistolitíase.';}
    else if(vs.calculos==='mult_maior'){frCalc=` Em seu interior destacam-se múltiplos cálculos${vs.calcMedida?`, o maior medindo ${vs.calcMedida} cm`:''}${vs.infundibulo?', impactado no infundíbulo':''}, promovendo sombra acústica posterior, móveis à mudança de decúbito.`;opCalc='Colecistolitíase.';}
    if(frCalc&&frVes) frVes=frVes.replace(' Não há imagens sugestivas de cálculos em seu interior.','').replace(' O conteúdo vesicular apresenta-se anecóide, sem cálculos no interior.','')+frCalc;
    if(vs.polipos==='unico'){
      const _prepPol=['fundo','infundíbulo'].includes(vs.polipLoc)?'no':'na';
      const locPol=vs.polipLoc?`, ${_prepPol} ${vs.polipLoc}`:'';
      const semCalcPol=vs.calculos==='nenhum'?' O conteúdo vesicular apresenta-se anecóide, sem cálculos no interior.':'';
      frVes=`Vesícula biliar normodistendida e com paredes finas, apresentando formação nodular sólida${locPol}, hiperecogênica, de aspecto polipóide, medindo ${vs.polipMed||'_'} cm e contornos regulares, imóvel à mudança de decúbito, com pedículo vascularizado ao estudo complementar com Doppler.${semCalcPol}`;
      if(frCalc) frVes+=frCalc;
      if(!opVes)opVes='Formação nodular intra-vesicular, sugestiva de pólipo vesicular.';
    } else if(vs.polipos==='multiplos'){
      const _prepPolM=['fundo','infundíbulo'].includes(vs.polipLoc)?'no':'na';
      const locPolM=vs.polipLoc?`, localizada ${_prepPolM} ${vs.polipLoc},`:'';
      const semCalcPolM=vs.calculos==='nenhum'?' O conteúdo vesicular apresenta-se anecóide, sem cálculos no interior.':'';
      frVes=`Vesícula biliar normodistendida e com paredes finas, apresentando múltiplas formações nodulares sólidas, hiperecogênicas, de aspecto polipóide, a maior medindo ${vs.polipMaiorMed||'_'} cm${locPolM} de contornos regulares, imóvel à mudança de decúbito, com pedículo vascularizado ao estudo complementar com Doppler.${semCalcPolM}`;
      if(frCalc) frVes+=frCalc;
      if(!opVes)opVes='Formações nodulares intra-vesicular, sugestivas de pólipos vesiculares.';
    }
  }
  if(opCalc&&!opVes)opVes=opCalc;
  else if(opCalc&&opVes&&opCalc!==opVes)opVes=opVes+'\n'+opCalc;

  // ── PÂNCREAS ──
  let frPanc='',opPanc='';
  if(pa.sit==='habitual') frPanc='Pâncreas com dimensões, forma, contornos e ecotextura normais.';
  else if(pa.sit==='parcial') frPanc='Pâncreas parcialmente caracterizado (cabeça e corpo), com dimensões, forma, contornos e ecotextura normais.';
  else if(pa.sit==='nao_car') frPanc='Pâncreas não caracterizado devido acentuada interposição gasosa de alças intestinais.';
  else if(pa.sit==='aguda'){frPanc='Pâncreas com dimensões aumentadas apresentando ecotextura heterogênea e hipoecogenicidade difusa.';opPanc='Os achados ecográficos pancreáticos descritos, em estreita correlação clínica, sugerem pancreatopatia aguda.';}
  else if(pa.sit==='cronica'){frPanc='Pâncreas com dimensões reduzidas apresentando ecotextura heterogênea à custa de múltiplas calcificações grosseiras dispersas pelo parênquima.';opPanc='Achados ecográficos compatíveis com pancreatopatia crônica.';}
  else if(pa.sit==='lipossub') frPanc='Pâncreas com dimensões, forma e contornos normais, com ecogenicidade difusamente aumentada.';
  if(pa.ducto){frPanc+=` Ducto pancreático principal dilatado, medindo cerca de ${pa.medDucto||'_'} cm.`;opPanc='Dilatação do ducto pancreático principal, sem identificação do fator causal.';}

  // ── BAÇO ──
  let frBaco='',opBaco='';
  const ecoBaco=ba.eco==='homogenea'?'homogênea':'heterogênea';
  if(ba.sit==='habitual') frBaco=`Baço com forma, contornos e dimensões normais, com ecotextura ${ecoBaco}.`;
  else if(ba.sit==='esplenomegalia'){frBaco=`Baço com contornos preservados e dimensões aumentadas, com ecotextura ${ecoBaco}.${ba.medIdx?` O índice esplênico é de ${ba.medIdx} (VR até 60,0).`:''}`;opBaco=`Esplenomegalia ${ecoBaco}.`;}
  else if(ba.sit==='ausente'){frBaco='Baço não caracterizado (status pós-operatório).';opBaco='Status pós-esplenectomia.';}

  // ── RINS ──
  let frRins='',opRins='';
  const BASE_RINS='Rins com dimensões usuais e contornos regulares. Parênquima com espessura preservada e diferenciação corticomedular mantida. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
  const BASE_NORMAL='Rins em topografia habitual, com dimensões usuais e contornos regulares. Parênquima com espessura preservada e diferenciação corticomedular mantida. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';

  if(ri.sit==='habitual') frRins=BASE_NORMAL;
  else if(ri.sit==='ectopico_d_iliaca'){frRins=`Rim direito localizado em fossa ilíaca direita. Rim esquerdo em topografia habitual. ${BASE_RINS}`;opRins='Rim direito ectópico.';}
  else if(ri.sit==='ectopico_d_pelve'){frRins=`Rim direito localizado na pelve. Rim esquerdo em topografia habitual. ${BASE_RINS}`;opRins='Rim direito ectópico.';}
  else if(ri.sit==='ectopico_e_iliaca'){frRins=`Rim esquerdo localizado em fossa ilíaca esquerda. Rim direito em topografia habitual. ${BASE_RINS}`;opRins='Rim esquerdo ectópico.';}
  else if(ri.sit==='ectopico_e_pelve'){frRins=`Rim esquerdo localizado na pelve. Rim direito em topografia habitual. ${BASE_RINS}`;opRins='Rim esquerdo ectópico.';}
  else if(ri.sit==='ferradura'){frRins='Rins apresentando desvio anterior do seu eixo de rotação assim como fusão de seus polos inferiores em topografia de linha média, anteriormente à aorta abdominal. Parênquima com espessura preservada e diferenciação corticomedular mantida. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';opRins='Rins em ferradura.';}
  else if(ri.sit==='policicistica'){frRins=`Rins em topografia habitual, com dimensões aumentadas e contornos lobulados. Presença de alteração ecotextural caracterizada por distorção arquitetural difusa à custa de múltiplos cistos dispersos por todo o parênquima renal bilateralmente, predominantemente corticais${ri.medCisto?`, o maior localizado no ${ri.tercoMaior} do rim ${ri.rimMaior}, medindo cerca de ${ri.medCisto} cm`:'' }. Não há evidências de cálculos calicinais. Ausência de hidronefrose.`;opRins='Achados ecográficos compatíveis com doença renal policística autossômica dominante.';}
  else if(ri.sit==='ir_incipiente'){frRins=`Rins em topografia habitual, com dimensões habituais e contornos lobulados. Parênquima com espessura discretamente reduzida e diferenciação corticomedular mantida. Não há evidências de cálculos calicinais. Ausência de hidronefrose.`;opRins=`Achados ecográficos sugestivos de insuficiência renal incipiente ${ri.lado}.`;}
  else if(ri.sit==='nefropatia_aguda'){
    const lado=ri.lado;
    if(lado==='direita') frRins='Rins em topografia habitual, com contornos regulares. Rim direito encontra-se com dimensões aumentadas, enquanto que o rim esquerdo conserva dimensões. Parênquima com espessura preservada e diferenciação corticomedular mantida. Observa-se aumento difuso da ecogenicidade cortical renal à direita. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
    else if(lado==='esquerda') frRins='Rins em topografia habitual, com contornos regulares. Rim esquerdo encontra-se com dimensões aumentadas, enquanto que o rim direito conserva dimensões. Parênquima com espessura preservada e diferenciação corticomedular mantida. Observa-se aumento difuso da ecogenicidade cortical renal à esquerda. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
    else frRins='Rins em topografia habitual, com dimensões aumentadas e contornos regulares. Parênquima com espessura preservada e diferenciação corticomedular mantida. Observa-se aumento difuso da ecogenicidade cortical renal bilateralmente. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
    opRins=`Achados ecográficos compatíveis com nefropatia parenquimatosa aguda ${lado}.`;
  }
  else if(ri.sit==='nefropatia_cronica'){
    const lado=ri.lado;
    if(lado==='direita') frRins='Rins em topografia habitual, com contornos regulares. Rim direito encontra-se com dimensões reduzidas, enquanto que o rim esquerdo conserva dimensões. Parênquima com espessura reduzida e perda da diferenciação corticomedular, associado a aumento difuso da ecogenicidade cortical renal à direita. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
    else if(lado==='esquerda') frRins='Rins em topografia habitual, com contornos regulares. Rim esquerdo encontra-se com dimensões reduzidas, enquanto que o rim direito conserva dimensões. Parênquima com espessura reduzida e perda da diferenciação corticomedular, associado a aumento difuso da ecogenicidade cortical renal à esquerda. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
    else frRins='Rins em topografia habitual, com dimensões reduzidas e contornos irregulares. Parênquima com espessura reduzida e perda da diferenciação corticomedular, associado a aumento difuso da ecogenicidade cortical renal bilateralmente. Não há evidências de cálculos calicinais. Ausência de hidronefrose.';
    opRins=`Achados ecográficos compatíveis com nefropatia crônica ${lado}.`;
  }
  else if(ri.sit==='nefrectomia_d'){frRins='Rim esquerdo em topografia habitual, com dimensões usuais e contornos regulares. Parênquima com espessura preservada e diferenciação corticomedular mantida. Não há evidências de cálculos calicinais. Ausência de hidronefrose. Rim direito não caracterizado (status pós-operatório).';opRins='Status pós-nefrectomia direita.';}
  else if(ri.sit==='nefrectomia_e'){frRins='Rim direito em topografia habitual, com dimensões usuais e contornos regulares. Parênquima com espessura preservada e diferenciação corticomedular mantida. Não há evidências de cálculos calicinais. Ausência de hidronefrose. Rim esquerdo não caracterizado (status pós-operatório).';opRins='Status pós-nefrectomia esquerda.';}

  // Dimensões dos rins
  let dimRinsStr='';
  const rd1=ri.dimRD1,rd2=ri.dimRD2,rd3=ri.dimRD3,parRD=ri.parRD;
  const re1=ri.dimRE1,re2=ri.dimRE2,re3=ri.dimRE3,parRE=ri.parRE;
  if(rd1||rd2||rd3||parRD){
    let s='Rim direito mede ';
    if(rd1&&rd2&&rd3){const v=vol(rd1,rd2,rd3);s+=`${rd1} x ${rd2} x ${rd3} cm, com volume de ${v} cm³.`;if(parRD)s+=` Espessura do parênquima à direita: ${parRD} cm.`;}
    else if(rd1){s+=`${rd1} cm.`;if(parRD)s+=` Espessura do parênquima à direita: ${parRD} cm.`;}
    dimRinsStr+=s+' ';
  }
  if(re1||re2||re3||parRE){
    let s='Rim esquerdo mede ';
    if(re1&&re2&&re3){const v=vol(re1,re2,re3);s+=`${re1} x ${re2} x ${re3} cm, com volume de ${v} cm³.`;if(parRE)s+=` Espessura do parênquima à esquerda: ${parRE} cm.`;}
    else if(re1){s+=`${re1} cm.`;if(parRE)s+=` Espessura do parênquima à esquerda: ${parRE} cm.`;}
    dimRinsStr+=s;
  }

  // Lesões renais
  let frLesRins='', opLesRins=[];
  const calcsRins=ri.lesoes.filter(l=>l.tipo==='calc');
  const cistosRins=ri.lesoes.filter(l=>l.tipo==='cisto');
  const nodulosRins=ri.lesoes.filter(l=>l.tipo==='nodulo');
  const temLesRins=ri.lesoes.length>0;

  if(temLesRins){
    const partes=[];
    let hidronefroseFrase=[];

    // Remover "Não há evidências de cálculos calicinais. Ausência de hidronefrose." se houver lesões
    frRins=frRins.replace(' Não há evidências de cálculos calicinais. Ausência de hidronefrose.','').replace('Não há evidências de cálculos calicinais. Ausência de hidronefrose.','');

    // Cálculos
    if(calcsRins.length===1){
      const c=calcsRins[0];
      const obsStr=c.obstrutivo==='sim'?'obstrutivo':'não obstrutivo';
      if(c.hidro&&c.hidro!=='nao') hidronefroseFrase.push(`${c.hidro} dilatação do sistema coletor ${c.rim==='direito'?'à direita':'à esquerda'}, associado a dilatação do ureter ${c.rim==='direito'?'à direita':'à esquerda'}, a montante`);
      partes.push(`Nota-se cálculo ${obsStr} em ${c.loc} ${c.rim==='direito'?'à direita':'à esquerda'}${medStr(c)}.`);
      opLesRins.push(c.obstrutivo==='sim'?`Cálculo obstrutivo em ${c.loc} ${c.rim==='direito'?'à direita':'à esquerda'}.${c.hidro&&c.hidro!=='nao'?`\n${c.hidro.charAt(0).toUpperCase()+c.hidro.slice(1)} dilatação do sistema coletor ${c.rim==='direito'?'à direita':'à esquerda'}.`:''}`:` Nefrolitíase não obstrutiva ${c.rim==='direito'?'à direita':'à esquerda'}.`);
    } else if(calcsRins.length>1){
      const linhas=calcsRins.map(c=>{
        const obs=c.obstrutivo==='sim'?'obstrutivo':'não obstrutivo';
        if(c.hidro&&c.hidro!=='nao') hidronefroseFrase.push(`${c.hidro} dilatação do sistema coletor ${c.rim==='direito'?'à direita':'à esquerda'} a montante`);
        return `- cálculo ${obs} em ${c.loc} ${c.rim==='direito'?'à direita':'à esquerda'}${medStr(c)};`;
      });
      partes.push(`Presença de cálculos, assim caracterizados:\n${linhas.join('\n')}`);
      calcsRins.forEach(c=>{opLesRins.push(c.obstrutivo==='sim'?`Cálculo obstrutivo em ${c.loc} ${c.rim==='direito'?'à direita':'à esquerda'}.`:` Nefrolitíase não obstrutiva ${c.rim==='direito'?'à direita':'à esquerda'}.`);});
    }

    // Cistos
    if(cistosRins.length===1){const c=cistosRins[0];partes.push(`Cisto ${c.subtipo} em ${c.loc} ${c.local2} ${c.rim==='direito'?'à direita':'à esquerda'}${medStr(c)}.`);opLesRins.push(`Cisto renal ${c.rim==='direito'?'à direita':'à esquerda'}.`);}
    else if(cistosRins.length>1){
      // Verificar se são bilaterais
      const dir=cistosRins.filter(c=>c.rim==='direito'),esq=cistosRins.filter(c=>c.rim==='esquerdo');
      if(dir.length&&esq.length){
        const linhas=cistosRins.map(c=>`- cisto ${c.subtipo} em ${c.loc} ${c.local2} ${c.rim==='direito'?'à direita':'à esquerda'}${medStr(c)};`);
        partes.push(`Presença de achados assim caracterizados:\n${linhas.join('\n')}`);opLesRins.push('Cistos renais bilaterais.');
      } else {
        const lado=dir.length?'direita':'esquerda',todos=dir.length?dir:esq;
        const maior=todos.reduce((a,b)=>(parseFloat(a.m1)||0)>=(parseFloat(b.m1)||0)?a:b);
        partes.push(`Múltiplos cistos simples corticais, o maior localizado no ${maior.loc} ${lado==='direita'?'à direita':'à esquerda'}${medStr(maior)}.`);
        opLesRins.push(`Múltiplos cistos renais ${lado==='direita'?'à direita':'à esquerda'}.`);
      }
    }

    // Nódulos
    if(nodulosRins.length===1){const n=nodulosRins[0];partes.push(`Nódulo ${n.compNod} de contornos ${n.contNod} em ${n.loc} ${n.rim==='direito'?'à direita':'à esquerda'}${medStr(n)}.`);opLesRins.push(`Nódulo renal ${n.compNod} em rim ${n.rim}. Sugere-se, a critério clínico, prosseguimento da investigação com tomografia computadorizada ou ressonância magnética com contraste.`);}
    else if(nodulosRins.length>1){const linhas=nodulosRins.map(n=>`- nódulo ${n.compNod} de contornos ${n.contNod} em ${n.loc} ${n.rim==='direito'?'à direita':'à esquerda'}${medStr(n)};`);partes.push(`Presença de achados assim caracterizados:\n${linhas.join('\n')}`);opLesRins.push('Nódulos renais sólido-císticos bilaterais. Sugere-se, a critério clínico, prosseguimento da investigação com tomografia computadorizada ou ressonância magnética com contraste.');}

    // Hidronefrose
    let hidrofrase='';
    if(hidronefroseFrase.length>0) hidrofrase=`${hidronefroseFrase.join('. ')}.`;

    // Sem hidronefrose adicional
    const semHidro=calcsRins.every(c=>!c.hidro||c.hidro==='nao');

    frLesRins=partes.join('\n')+(hidrofrase?' '+hidrofrase:'')+(semHidro&&nodulosRins.length===0?' Ausência de hidronefrose.':'');

    if(calcsRins.length===0&&cistosRins.length===0&&nodulosRins.length===0) frLesRins='';
  }

  // Dilatação sistema coletor (sem cálculo)
  let frDilacao='',opDilacao='';
  const temDilDir=ri.dilDir,temDilEsq=ri.dilEsq;
  if(temDilDir||temDilEsq){
    if(temDilDir&&temDilEsq){
      const g1=ri.dilDirGrau,g2=ri.dilEsqGrau;
      if(g1===g2) frDilacao=`${g1.charAt(0).toUpperCase()+g1.slice(1)} dilatação do sistema coletor bilateralmente, sem caracterização de fator obstrutivo ao presente método${(ri.dilDirUreter||ri.dilEsqUreter)?', associado a dilatação ureteral '+(ri.dilDirUreter&&ri.dilEsqUreter?'bilateral':(ri.dilDirUreter?'à direita':'à esquerda')):''}. `;
      else frDilacao=`Dilatação do sistema coletor bilateralmente, sem caracterização de fator obstrutivo ao presente método, sendo ${g1} à direita e ${g2} à esquerda${(ri.dilDirUreter||ri.dilEsqUreter)?', associado a dilatação ureteral '+(ri.dilDirUreter&&ri.dilEsqUreter?'bilateral':(ri.dilDirUreter?'à direita':'à esquerda')):''}. `;
      opDilacao='Dilatação do sistema coletor bilateralmente.';
    } else if(temDilDir){
      frDilacao=`${ri.dilDirGrau.charAt(0).toUpperCase()+ri.dilDirGrau.slice(1)} dilatação do sistema coletor à direita${ri.dilDirUreter?', associado a dilatação do ureter à direita,':''} sem caracterização de fator obstrutivo ao presente método. `;
      opDilacao='Dilatação do sistema coletor à direita.';
    } else {
      frDilacao=`${ri.dilEsqGrau.charAt(0).toUpperCase()+ri.dilEsqGrau.slice(1)} dilatação do sistema coletor à esquerda${ri.dilEsqUreter?', associado a dilatação do ureter à esquerda,':''} sem caracterização de fator obstrutivo ao presente método. `;
      opDilacao='Dilatação do sistema coletor à esquerda.';
    }
    // Remove "ausência de hidronefrose" da frase base se há dilatação
    frRins=frRins.replace(' Ausência de hidronefrose.','');
    if(frLesRins) frLesRins=frLesRins.replace(' Ausência de hidronefrose.','');
  }

  const frRinsCompleto=frRins+(frLesRins?' '+frLesRins:'')+' '+(frDilacao||(!temLesRins&&!temDilDir&&!temDilEsq?'':'')).trim()+(dimRinsStr?'\n'+dimRinsStr.trim():'');

  // ── BEXIGA ──
  let frBexiga='',opBexiga='';
  if(bx.sit==='vazia') frBexiga='Bexiga vazia, limitando a sua adequada avaliação ecográfica.';
  else{
    const dist={habitual:'com distensão adequada',parcial:'com distensão parcial',espessada:'com distensão adequada'}[bx.sit]||'com distensão adequada';
    const paredes=bx.sit==='espessada'?`paredes com espessura aumentada, medindo até ${bx.espParede||'_'} cm`:'parede com espessura normal';
    let conteudo='conteúdo homogêneo';
    const extras=[];
    if(bx.debris) extras.push('ecos em suspensão');
    if(bx.coagulo) extras.push(`coágulo móvel${bx.coagM1?` medindo cerca de ${bx.coagM1}${bx.coagM2?' x '+bx.coagM2:''}${bx.coagM3?' x '+bx.coagM3:''} cm`:''}`);
    if(bx.calculo) extras.push(`cálculo medindo cerca de ${bx.calcM1||'_'}${bx.calcM2?' x '+bx.calcM2:''}${bx.calcM3?' x '+bx.calcM3:''} cm`);
    if(extras.length) conteudo=`conteúdo heterogêneo à custa de ${extras.join(', ')}`;
    frBexiga=`Bexiga ${dist}, apresentando contornos regulares, ${paredes} e ${conteudo}.`;
    if(bx.sit==='espessada'){opBexiga=`Espessamento parietal vesical difuso${bx.divertVes?' (associado a divertículos)':''}.`;}
    if(bx.debris) opBexiga=(opBexiga?opBexiga+'\n':'')+'Bexiga contendo debris em seu interior.';
    if(bx.coagulo) opBexiga=(opBexiga?opBexiga+'\n':'')+'Coágulo vesical.';
    if(bx.calculo) opBexiga=(opBexiga?opBexiga+'\n':'')+'Litíase vesical.';
    if(bx.lesao){
      frBexiga=frBexiga.replace(` e ${conteudo}.`,` e conteúdo heterogêneo à custa de lesão exofítica de contornos irregulares localizada no ${bx.lesaoLoc}${bx.lesaoM1?`, medindo cerca de ${bx.lesaoM1}${bx.lesaoM2?' x '+bx.lesaoM2:''}${bx.lesaoM3?' x '+bx.lesaoM3:''} cm`:''}, ${bx.doppler?'caracterizando':'não caracterizando'} fluxo vascular interno ao estudo complementar com Doppler.`);
      opBexiga=(opBexiga?opBexiga+'\n':'')+'Lesão vesical de provável natureza neoplásica. Sugere-se, a critério clínico, complementação diagnóstica com cistoscopia.';
    }
    // Volume
    if(bx.volPre) frBexiga+=`\nVolume vesical pré-miccional estimado em ${bx.volPre} mL.`;
    if(bx.volPos){
      const vPos=parseFloat(bx.volPos);
      let classRes='desprezível';
      if(vPos>=150) classRes=`acentuado (${bx.volPos} mL)`;
      else if(vPos>=80) classRes=`moderado (${bx.volPos} mL)`;
      else if(vPos>=30) classRes=`pequeno (${bx.volPos} mL)`;
      frBexiga+=`\nResíduo vesical pós-miccional ${classRes}.`;
    }
  }

  // ── AORTA ──
  let frAorta='',opAorta='';
  if(ao.sit==='habitual') frAorta='Aorta com trajeto, calibre e contornos normais.';
  else if(ao.sit==='ectasia'){frAorta=`Aorta com trajeto habitual, apresentando ectasia com seu maior diâmetro de até ${ao.medEctasia||'_'} cm.`;opAorta='Ectasia da aorta abdominal.';}
  else if(ao.sit==='aneurisma'){
    const pos={abaixo:'abaixo da emergência',acima:'acima da emergência',nivel:'a nível da emergência'}[ao.aneurPos];
    frAorta=`Dilatação aneurismática da aorta abdominal ${pos} das artérias renais${ao.aneurM1?`, medindo ${ao.aneurM1} x ${ao.aneurM2||'_'} x ${ao.aneurM3||'_'} cm (L x AP x A)`:''}. `;
    if(ao.trombo) frAorta+=`Observa-se trombo mural em seu interior que reduz a luz para ${ao.tromboMed||'_'} cm no diâmetro ântero-posterior. `;
    opAorta='Aneurisma da aorta abdominal.';
  }
  else if(ao.sit==='nao_car') frAorta='Aorta não caracterizada devido à intensa interposição gasosa de alças intestinais.';
  else if(ao.sit==='ateromatose'){frAorta='Aorta com trajeto e calibre normais, apresentando placas parietais fibrocalcificadas esparsas.';opAorta='Ateromatose aórtica.';}

  // ── ALÇAS / APÊNDICE ──
  let frAlcas='',opAlcas='';
  if(al.apendice==='nao_car') frAlcas='Apêndice cecal não caracterizado ao presente exame.';
  else if(al.apendice==='nao_excluido') frAlcas='Estudo ultrassonográfico complementar com sonda linear de 10MHz, dirigido para região abdominal, apresenta-se alças intestinais com peristalse habitual, ecogenicidade da gordura mesentérica preservada, não sendo caracterizado ecograficamente o apêndice cecal. Tais achados não excluem a possibilidade de processo inflamatório/infeccioso do mesmo, caso persista interesse clínico e não haja contra-indicações, um estudo por tomografia poderá trazer maiores informações.';
  else if(al.apendice==='habitual') frAlcas=`Apêndice cecal caracterizado em fossa ilíaca direita de aspecto ecográfico habitual${al.apendMed?` com calibre de até ${al.apendMed} cm`:''}.`;
  else if(al.apendice==='apendicite'){frAlcas=`Apêndice cecal caracterizado em fossa ilíaca direita, não compressível, com calibre aumentado, medindo até ${al.apendMed||'_'} cm.`;opAlcas='Os achados ecográficos descritos são sugestivos de processo inflamatório/infeccioso agudo do apêndice cecal (apendicite).';}
  else if(al.apendice==='apendicite_gordura'){frAlcas=`Apêndice cecal caracterizado em fossa ilíaca direita, não compressível, com calibre aumentado, medindo até ${al.apendMed||'_'} cm. Associa-se aumento da ecogenicidade do tecido adiposo adjacente.`;opAlcas='Os achados ecográficos descritos são sugestivos de processo inflamatório/infeccioso agudo do apêndice cecal (apendicite).';}
  else if(al.apendice==='apendicite_linfonodos'){frAlcas=`Apêndice cecal caracterizado em fossa ilíaca direita, não compressível, com calibre aumentado, medindo até ${al.apendMed||'_'} cm. Associa-se aumento da ecogenicidade do tecido adiposo adjacente e linfonodos mesentéricos aumentados em número.`;opAlcas='Os achados ecográficos descritos são sugestivos de processo inflamatório/infeccioso agudo do apêndice cecal (apendicite).';}

  if(al.intuss){frAlcas+=(frAlcas?' ':'')+`Em topografia de ${al.intussLoc}, observa-se imagem com aspecto de "alça dentro de alça"${al.intussM1?` medindo cerca de ${al.intussM1}${al.intussM2?' x '+al.intussM2:''} cm (L x AP)`:''}.`;opAlcas=(opAlcas?opAlcas+'\n':'')+'Achados ecográficos sugestivos de intussuscepção intestinal.';}
  if(al.divert){frAlcas+=(frAlcas?' ':'')+`Em topografia de ${al.divertLoc}, observa-se espessamento segmentar circunferencial colônico${al.divertExt?`, medindo ${al.divertExt} cm de extensão`:''}, associado a formações saculares compatíveis com divertículos, apresentando paredes espessadas e conteúdo gasoso em seu interior. Associa-se hiperecogenicidade da gordura pericólica.`;opAlcas=(opAlcas?opAlcas+'\n':'')+'Achados ecográficos sugestivos de doença diverticular aguda, sendo conveniente complementar com estudo tomográfico.';}
  if(al.geca){frAlcas+=(frAlcas?' ':'')+`Nas regiões de mesogástrio, hipogástrio e fossas ilíacas são visualizadas alças intestinais com paredes discretamente espessadas e distendidas por conteúdo líquido com moderados debris.`;opAlcas=(opAlcas?opAlcas+'\n':'')+'Dentre as hipóteses diagnósticas considerar a possibilidade de processo inflamatório/infeccioso da mucosa gastrointestinal (gastroenterite).';}

  // ── LÍQUIDO LIVRE ──
  let frLiq='',opLiq='';
  if(li.sit==='ausente') frLiq='Ausência de líquido livre.';
  else{frLiq=`Presença de ${li.qtd} quantidade de líquido livre ${li.aspecto} em ${li.local}.`;opLiq=`Presença de ${li.qtd} quantidade de líquido ${li.aspecto} em ${li.local}.`;}

  // ── OPINIÕES ──
  const ops=[opFig,...opLF,opVeias,opPorta,opBil,opVes,opPanc,opBaco,opRins,...opLesRins,opDilacao,opBexiga,opAorta,opAlcas,opLiq].filter(Boolean);
  const opFinal=ops.length===0?'Estudo ecográfico sem evidentes anormalidades apreciáveis ao método.':ops.join('\n')+'\nDemais estruturas sem evidentes anormalidades apreciáveis ao método.';

  // Formatar frasescom quebras de linha
  function p(fr){return fr?`<div class="doc-p">${fr.replace(/\n/g,'<br>')}</div>`:'';}
  const veiaHtml=frVeias?p(frVeias+frPorta):p(frPorta);
  const bilHtml=frBil.includes('\n')?frBil.split('\n').map(l=>p(l)).join(''):p(frBil);
  const rinsPartes=frRinsCompleto.split('\n');
  const rinsHtml=rinsPartes.map(r=>p(r.trim())).filter(Boolean).join('');

  document.getElementById('laudo-doc').innerHTML=`
    <div class="doc-titulo">ULTRASSONOGRAFIA DE ABDOME TOTAL</div>
    <div class="doc-secao"><span class="doc-label">TÉCNICA:</span><div class="doc-p">Exame realizado em aparelho dinâmico com transdutor convexo por via abdominal.</div></div>
    <div class="doc-secao"><span class="doc-label">ANÁLISE:</span>
      ${analHtml}${veiaHtml}${bilHtml}
      ${bi.sit!=='colecistectomia'&&frVes?p(frVes):''}
      ${p(frPanc)}${p(frBaco)}
      ${rinsHtml}
      ${p(frBexiga)}
      ${p(frAorta)}
      ${frAlcas?p(frAlcas):''}
      ${p(frLiq)}
    </div>
    <div class="doc-secao"><span class="doc-label">IMPRESSÃO DIAGNÓSTICA:</span><div class="doc-p">${opFinal.replace(/\n/g,'<br>')}</div></div>`;
}

function copiar() {
  var el = document.getElementById('laudo-doc');
  if (!el) return;
  _copyLaudoRichText(el, function(ok) {
    if (ok) {
      showToast('Laudo copiado para a área de transferência!');
    } else {
      showToast('Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');

// --- INÃCIO: FUNÃ‡Ã•ES DE CÃ“PIA RICH-TEXT (PadrÃ£o ObstÃ©trico) ---
function _copyLaudoRichText(sourceEl, callback) {
  var clone = sourceEl.cloneNode(true);
  var RELEVANT_PROPS = [
    'font-family', 'font-size', 'font-weight', 'font-style',
    'line-height', 'text-align', 'text-indent', 'text-decoration',
    'vertical-align', 'white-space', 'display',
    'margin-top', 'margin-right', 'margin-bottom', 'margin-left',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'list-style', 'list-style-type',
    'border-collapse', 'border-spacing'
  ];
  var originalEls = sourceEl.querySelectorAll('*');
  var cloneEls    = clone.querySelectorAll('*');

  _inlineComputedStyles(sourceEl, clone, RELEVANT_PROPS, true);
  for (var i = 0; i < originalEls.length; i++) {
    _inlineComputedStyles(originalEls[i], cloneEls[i], RELEVANT_PROPS, false);
  }

  clone.style.backgroundColor = '#ffffff';
  clone.style.color = '#000000';
  clone.removeAttribute('id');
  clone.removeAttribute('contenteditable');

  var htmlContent = clone.outerHTML;
  var plainText = sourceEl.innerText || sourceEl.textContent || '';

  if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
    try {
      var htmlBlob = new Blob([htmlContent], { type: 'text/html' });
      var textBlob = new Blob([plainText],   { type: 'text/plain' });
      navigator.clipboard.write([
        new ClipboardItem({
          'text/html': htmlBlob,
          'text/plain': textBlob
        })
      ]).then(function() {
        callback(true);
      }).catch(function() {
        _fallbackCopy(htmlContent, plainText, callback);
      });
      return;
    } catch (e) {
    }
  }
  _fallbackCopy(htmlContent, plainText, callback);
}

function _inlineComputedStyles(originalEl, cloneEl, props, isRoot) {
  if (!originalEl || !cloneEl) return;
  if (originalEl.nodeType !== 1 || cloneEl.nodeType !== 1) return;
  var computed = window.getComputedStyle(originalEl);
  for (var i = 0; i < props.length; i++) {
    var prop = props[i];
    var val  = computed.getPropertyValue(prop);
    if (val) {
      cloneEl.style.setProperty(prop, val);
    }
  }
  var bgColor = computed.getPropertyValue('background-color');
  if (bgColor) {
    var bgRgb = _parseRGB(bgColor);
    if (!bgRgb || _isTransparent(bgColor)) {
      cloneEl.style.backgroundColor = 'transparent';
    } else if (bgRgb.r > 200 && bgRgb.g > 200 && bgRgb.b > 200) {
      cloneEl.style.backgroundColor = '#ffffff';
    } else {
      cloneEl.style.backgroundColor = isRoot ? '#ffffff' : 'transparent';
    }
  }
  var textColor = computed.getPropertyValue('color');
  if (textColor) {
    var textRgb = _parseRGB(textColor);
    if (!textRgb || textRgb.r > 100 || textRgb.g > 100 || textRgb.b > 100) {
      cloneEl.style.color = '#000000';
    } else {
      cloneEl.style.color = textColor;
    }
  }
  var tag = originalEl.tagName.toLowerCase();
  if (tag === 'td' || tag === 'th' || tag === 'table') {
    var borderProps = ['border-top', 'border-right', 'border-bottom', 'border-left', 'border'];
    for (var j = 0; j < borderProps.length; j++) {
      var bv = computed.getPropertyValue(borderProps[j]);
      if (bv) {
        cloneEl.style.setProperty(borderProps[j], bv);
      }
    }
  }
  cloneEl.removeAttribute('class');
}

function _fallbackCopy(htmlContent, plainText, callback) {
  var container = document.createElement('div');
  container.innerHTML = htmlContent;
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.opacity = '0';
  document.body.appendChild(container);
  var range = document.createRange();
  range.selectNodeContents(container);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  sel.removeAllRanges();
  document.body.removeChild(container);
  callback(ok);
}

function _isTransparent(colorStr) {
  if (!colorStr) return true;
  if (colorStr === 'transparent') return true;
  var m = colorStr.match(/rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*([\d.]+)\s*\)/);
  if (m && parseFloat(m[4]) === 0) return true;
  return false;
}

function _parseRGB(colorStr) {
  if (!colorStr) return null;
  var m = colorStr.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return { r: parseInt(m[1]), g: parseInt(m[2]), b: parseInt(m[3]) };
  if (colorStr.charAt(0) === '#') {
    var hex = colorStr.replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    if (hex.length === 6) {
      return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
    }
  }
  return null;
}
