<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THI-RADS — Laudo Estruturado</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Paleta alinhada ao app obstétrico (slate escuro + ciano) ===== */
:root{
  --blue:#0e6a83;--blue-dark:#0c566b;--blue-light:#d3e6ec;--blue-mid:#c0dce5;
  --surface:#e1e6ee;--border:#c9d1de;--border-strong:#9eacc2;
  --text:#1b2538;--text-2:#34425b;--text-3:#5c6a83;
  --white:#f3f5f9;--green:#047857;--red:#c93a3a;--radius:10px;--radius-lg:14px;
  --hover:#dfeaf0;--sel-bg:#cbe3ec;--focus-ring:rgba(14,106,131,.22);
}
body.dark{
  --blue:#2fa9c2;--blue-dark:#2490a8;--blue-light:#12293d;--blue-mid:#12293d;
  --surface:#090e19;--border:#1a263b;--border-strong:#33445f;
  --text:#c9d2e0;--text-2:#a3afc4;--text-3:#7a879f;
  --white:#0e1626;--green:#2fbf8c;--red:#e07a7a;
  --hover:#13203a;--sel-bg:#12324a;--focus-ring:rgba(47,169,194,.28);
}
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:var(--white);border-left-color:var(--border);}
body.dark .laudo-body{background:var(--white);}
body.dark .laudo-header{background:var(--white);border-bottom-color:var(--border);}
@media print{
  body.dark .laudo-doc,
  body.dark .laudo-doc *{color:#111 !important;}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ----- Barra superior ----- */
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;gap:10px;height:58px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:14px;}
.logo-name{font-size:20px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:13px;color:var(--text-3);font-weight:400;}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border-strong);font-weight:500;transition:all .13s;background:var(--white);color:var(--text);}
.btn:hover{background:var(--hover);border-color:var(--blue);color:var(--blue);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
body.dark .btn-primary{color:#06202b;}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
body.dark .btn-primary:hover{color:#06202b;}
.btn-danger{background:#f6e6e8;color:var(--red);border-color:#e3a9ad;}
body.dark .btn-danger{background:#2d1a1f;border-color:#7a3038;}
.btn-danger:hover{background:#fee2e2;border-color:#f87171;color:var(--red);}
body.dark .btn-danger:hover{background:#3a2026;}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.btn-dark{margin-left:auto;}
.btn:focus-visible,.nav-item:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

.body{display:flex;flex:1;overflow:hidden;}

/* ----- Coluna esquerda: navegação ----- */
.sidebar{width:208px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:16px 16px 14px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:3px;}
.sidebar-titulo{font-size:19px;font-weight:600;color:var(--text);}
.nav-group{padding:8px 0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:3px solid transparent;line-height:1.25;}
.nav-item:hover{background:var(--hover);color:var(--text);}
.nav-item.active{background:var(--sel-bg);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.45;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}

/* ----- Coluna central: formulário ----- */
.panel{width:560px;flex-shrink:0;overflow-y:auto;padding:18px 18px 26px;background:var(--surface);}
.panel .doc-p{font-size:14px !important;}
.sec-title{font-size:19px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:9px;}
.sec-title::before{content:'';display:block;width:4px;height:22px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:14px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:13px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.6px;padding:11px 16px 10px;border-bottom:1px solid var(--border);background:var(--white);}
body.dark .block-title{border-bottom-color:var(--border);}

.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:var(--hover);}
.radio-opt.selected{background:var(--sel-bg);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-size:15px;color:var(--text);line-height:1.4;cursor:pointer;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:600;}
.radio-mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
body.dark .radio-mark::after{background:#06202b;}
.radio-opt.selected .radio-mark::after{opacity:1;}

.check-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;background:var(--surface);}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:var(--hover);}
.check-row.selected{background:var(--sel-bg);}
.check-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
.check-label{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px 11px 34px;font-size:14.5px;color:var(--text);cursor:pointer;}
.check-row.selected .check-label{color:var(--blue);font-weight:600;}
.check-box{width:19px;height:19px;border-radius:5px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:12px;height:12px;}
.check-row.selected .check-box svg{display:block;}
body.dark .check-box svg{stroke:#06202b;}
.sel-tag{font-size:13px;border:1px solid var(--border-strong);border-radius:6px;padding:4px 8px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:6px;cursor:pointer;}

.dim-rows{padding:12px 16px;display:flex;flex-direction:column;gap:9px;}
.dim-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.dim-lbl{flex:1;font-size:14.5px;color:var(--text);}
.dim-input{width:76px;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:14.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
.dim-unit{font-size:14px;color:var(--text-3);}
.nodulo-wrap{padding:12px 16px;display:flex;flex-direction:column;gap:10px;}

.btn-add-lesao{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:600;transition:all .12s;border:1.5px dashed var(--blue);background:transparent;color:var(--blue);width:100%;justify-content:center;}
.btn-add-lesao:hover{background:var(--sel-bg);}
.lesao-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px;margin-bottom:10px;}
.lesao-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.lesao-hd-title{font-size:13px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;}
.btn-rem{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;border:1px solid #e3a9ad;background:#f6e6e8;color:var(--red);transition:all .12s;}
body.dark .btn-rem{background:#2d1a1f;border-color:#7a3038;}
.btn-rem:hover{background:#fee2e2;}
body.dark .btn-rem:hover{background:#3a2026;}

.ff-grid{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:8px;}
.ff{display:flex;flex-direction:column;gap:4px;}
.ff label{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.ff select,.ff input[type=text],.ff input[type=number]{font-size:14px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:7px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);}
.ff select:focus,.ff input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
.ff input[type=text],.ff input[type=number]{width:68px;text-align:center;}
.inline-select{font-size:14px;padding:6px 9px;border:1px solid var(--border-strong);border-radius:7px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:5px;}
.inline-select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
.inline-num{width:60px;font-size:14px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:7px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);text-align:center;margin:0 2px;}
.inline-num:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus-ring);}
body.dark .sub-opts{background:var(--hover);border-bottom-color:var(--border);}
.sub-opt-label{color:var(--text-2);}
body.dark .sub-opt-label{background:var(--white);color:var(--text);}
.panel select option{background:var(--white);color:var(--text);}

/* ----- Coluna direita: LAUDO (fonte e estrutura preservadas) ----- */
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
.laudo-doc:focus { outline: none; }

.toast-notification{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--white);font-size:12.5px;font-weight:500;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:999;}
.toast-notification.show{opacity:1;transform:translateX(-50%) translateY(0);}
body.dark .toast-notification{background:#3a4155;color:#e2e6f0;}

/* --- CUSTOM COMPONENTS RESTORED --- */
body.dark .btn-dark {background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover {background:#343a4d;color:#fff;}
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text],body.dark select.sel-tag,body.dark input.dim-input {background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .toolbar {background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar {background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd {border-bottom-color:var(--border);}
body.dark .radio-opt:hover {background:#1e2d4a;}
body.dark .radio-opt.selected {background:#1e2d4a;}
body.dark .check-row {background:#1a1f2e;}
body.dark .check-row:hover {background:#1e2d4a;}
body.dark .check-row.selected {background:#1e2d4a;}
body.dark select {background:var(--white);color:var(--text);border-color:var(--border-strong);}
.sub-opt-label:has(input:checked) {background:var(--blue);color:#fff;border-color:var(--blue);}
.sub-opt-label input {position:absolute;opacity:0;pointer-events:none;}
.dim-inline {display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:12px;color:var(--text-2);flex-wrap:wrap;}
.dim-inline .dim-input {width:54px;}
.dim-inline .dim-unit {color:var(--text-3);}
.inline-field {padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2);}
.inline-field:last-child {border-bottom:none;}
.inline-field label {color:var(--text-2);}


/* --- FIX TEXTAREA --- */
textarea { background: var(--white); color: var(--text); }
body.dark textarea { background: var(--white); color: var(--text); border-color: var(--border-strong); }
</style>

</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-thirads.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <button class="btn" onclick="window.location.href='../laudo-thirads.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>
  <div class="tb-sep"></div>
  <button class="btn" onclick="copiar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copiar laudo</button>
  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>
  <button class="btn btn-dark" id="btn-dark-toggle" onclick="toggleDark()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro</button>
  <button class="btn btn-danger" onclick="reiniciar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 1.5-3.9M2 4v4h4"/></svg>Reiniciar</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd"><div class="sidebar-tipo">Ultrassonografia</div><div class="sidebar-titulo">Pélvica Abdominal</div></div>
    <div class="nav-group">
      <div class="nav-item" id="nav-antecedentes" onclick="showSection('antecedentes')"><span class="nav-dot"></span>Ant. Ginecológicos</div>
      <div class="nav-item" id="nav-bexiga" onclick="showSection('bexiga')"><span class="nav-dot"></span>Bexiga</div>
      <div class="nav-item" id="nav-utero" onclick="showSection('utero')"><span class="nav-dot"></span>Útero</div>
      <div class="nav-item" id="nav-endometrio" onclick="showSection('endometrio')"><span class="nav-dot"></span>Endométrio</div>
      <div class="nav-item" id="nav-ovarioD" onclick="showSection('ovarioD')"><span class="nav-dot"></span>Ovário Direito</div>
      <div class="nav-item" id="nav-ovarioE" onclick="showSection('ovarioE')"><span class="nav-dot"></span>Ovário Esquerdo</div>
      <div class="nav-item" id="nav-liquido" onclick="showSection('liquido')"><span class="nav-dot"></span>Líquido Livre</div>
      <div class="nav-item" id="nav-achados" onclick="showSection('achados')"><span class="nav-dot"></span>Achados Adicionais</div>
    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

<script>
// ── Estado global ──
const estado = {
  antecedentes: { status:'fertil', gesta:'0', dum:'nc', dumData:'', dumValor:'10', dumUnidade:'dias' },
  bexiga: { sit:'habitual', debris:false, coagulo:false, calculo:false, lesao:false, sonda:false, jatos:'nc' },
  utero: { sit:'habitual', formato:'',desvio:'centrado', flexao:'ante', contornos:'regulares', d1:'', d2:'', d3:'',
           miometrio:'homogeneo', adenomiose:false, nod1:false, nod1d1:'', nod1d2:'', nod1d3:'', nod1eco:'hipoecogenico', nod1loc:'intramural',
           nod2:false, nod2d1:'', nod2d2:'', nod2d3:'', nod2eco:'hipoecogenico', nod2loc:'intramural',
           nodMul:false, nodMulD1:'', nodMulD2:'', nodMulD3:'', nodMulEco:'hipoecogenico', nodMulLoc:'intramural',
           colo:'habitual', coloCisto:false, coloColpite:false },
  endometrio: { sit:'habitual', espessura:'', car:'habitual', diu:'nao', polipo:false, polipoDim:'', liquido:false },
  ovarioD: { sit:'habitual', d1:'', d2:'', d3:'', loc:'nc', folFun:false, funD1:'', funD2:'', funD3:'',
             cLuteo:false, lutD1:'', lutD2:'', lutD3:'',
             cSimples:false, simD1:'', simD2:'', simD3:'',
             cHem:false, hemD1:'', hemD2:'', hemD3:'',
             endometrioma:false, endD1:'', endD2:'', endD3:'',
             cDermoide:false, derD1:'', derD2:'', derD3:'',
             ncMotivo:'nc', ncLivre:true, mulAte:'' },
  ovarioE: { sit:'habitual', d1:'', d2:'', d3:'', loc:'nc', folFun:false, funD1:'', funD2:'', funD3:'',
             cLuteo:false, lutD1:'', lutD2:'', lutD3:'',
             cSimples:false, simD1:'', simD2:'', simD3:'',
             cHem:false, hemD1:'', hemD2:'', hemD3:'',
             endometrioma:false, endD1:'', endD2:'', endD3:'',
             cDermoide:false, derD1:'', derD2:'', derD3:'',
             ncMotivo:'nc', ncLivre:true, mulAte:'' },
  liquido: { sit:'ausente', qtd:'discreta', aspecto:'anecoico', local:'pélvica' },
  achados: { texto:'' },
};

let secaoAtual = 'antecedentes';

// ── HELPERS ──
function fmt(v){ return v||'_'; }
function vol(a,b,c){
  const x=parseFloat(a),y=parseFloat(b),z=parseFloat(c);
  if(isNaN(x)||isNaN(y)||isNaN(z)) return null;
  return (x*y*z*0.52).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function medStr(d1,d2,d3){
  if(!d1) return '_';
  let s = fmt(d1);
  if(d2) s+=' x '+fmt(d2);
  if(d3) s+=' x '+fmt(d3);
  return s+' cm';
}

function chkIcon(){return `<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M1.5 5l2.5 2.5 4.5-4.5"/></svg>`;}

function radioOpt(val,label,current,key,sub=''){
  const sel=current===val?'selected':'';
  return `<div class="radio-opt ${sel}" onclick="setV('${key}','sit','${val}')">
    <input type="radio" name="r_${key}">
    <label class="radio-label"><span class="radio-mark"></span>${label}${sub}</label>
  </div>`;
}
function chkRow(id,label,checked,cb,indent=false){
  const sel=checked?'selected':'';
  const pad=indent?'padding-left:28px;':'';
  return `<div class="check-row ${sel}" id="crow-${id}" onclick="${cb}">
    <input type="checkbox" id="${id}" ${checked?'checked':''}>
    <label class="check-label" style="${pad}"><span class="check-box">${chkIcon()}</span>${label}</label>
  </div>`;
}
function dimInput(id,label,val,unit='cm',extra=''){
  return `<div class="dim-row"><span class="dim-lbl">${label}</span>
    <input class="dim-input" type="text" id="${id}" value="${val}" placeholder="—" oninput="${extra||'updateLaudo()'}">
    <span class="dim-unit">${unit}</span></div>`;
}
function triDim(pre,label,d1,d2,d3,unit='cm'){
  return `<div style="padding:9px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:12px;flex-wrap:wrap;color:var(--text-2);">

function setV(sec, key, val){
  estado[sec][key]=val;
  renderPanel(secaoAtual);
  updateLaudo();
}
function toggle(sec, key){
  estado[sec][key]=!estado[sec][key];
  renderPanel(secaoAtual);
  updateLaudo();
}

// ── NAVEGAÇÃO ──
function showSection(sec){
  secaoAtual=sec;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+sec).classList.add('active');
  renderPanel(sec);
  updateLaudo();
}
function renderPanel(sec){
  const p=document.getElementById('main-panel');
  const titles={antecedentes:'Antecedentes Ginecológicos',bexiga:'Bexiga',utero:'Útero',endometrio:'Endométrio',ovarioD:'Ovário Direito',ovarioE:'Ovário Esquerdo',liquido:'Líquido Livre',achados:'Achados Adicionais',tecnica:'Técnica',indicacao:'Indicação',miometrio:'Miométrio',anexos:'Região Anexial',recomend:'Recomendações'};
  let html=`<div class="sec-title">${titles[sec]}</div>`;
  if(sec==='antecedentes') html+=renderAntecedentes()+EXTRA.antX();
  else if(sec==='bexiga') html+=renderBexiga()+EXTRA.bexX();
  else if(sec==='utero') html+=renderUtero()+EXTRA.malf();
  else if(sec==='endometrio') html+=renderEndometrio()+endExtra();
  else if(sec==='ovarioD') html+=renderOvario('D')+ovExtra('D');
  else if(sec==='ovarioE') html+=renderOvario('E')+ovExtra('E');
  else if(sec==='liquido') html+=renderLiquido()+EXTRA.liqX();
  else if(sec==='achados') html+=renderAchados()+EXTRA.achX();
  else if(EXTRA[sec]) html+=EXTRA[sec]();
  p.innerHTML=html;
}

  if(e.cist){P(`Espessamento parietal da bexiga${e.cistV?', medindo '+e.cistV+' mm':''}, podendo corresponder a cistite.`,'Espessamento parietal vesical / cistite.');if(e.enf)P('Focos gasosos na parede vesical, compatíveis com cistite enfisematosa.','Cistite enfisematosa.');}
  if(e.calc)P(`Cálculo vesical${e.calcV?' medindo '+e.calcV+' cm':''}, ${e.calcTipo==='impactado'?'impactado na JUV à '+e.calcLado:'móvel às mudanças de decúbito'}.`,'Cálculo vesical.');
  if(e.mult)P('Múltiplos cálculos vesicais menores.','Cálculos vesicais.');
  if(e.coag)P(`Coágulo / hematoma intravesical${mm('cg')?' medindo '+mm('cg'):''}${e.coagFl?', sem fluxo ao Doppler':''}.`,'Coágulo / hematoma intravesical.');
  if(e.esforco)P('Aspecto de bexiga de esforço / neurogênica.','Bexiga de esforço / neurogênica.');
  if(e.ureter)P(`Ureterocele à ${e.ureL}${e.ureV?', medindo '+e.ureV+' cm':''}.`,`Ureterocele à ${e.ureL}.`);
  if(e.mass)P(`Massa vesical ${e.massT}${mm('ms')?', medindo '+mm('ms'):''}, localizada em ${e.massTop}${e.massVasc?', vascularizada ao Doppler':''}${e.massCalc?', com calcificação de permeio':''}.`,'Massa vesical.');
  if(e.endoV)P(`Lesão compatível com endometriose vesical${mm('ev')?', medindo '+mm('ev'):''}${e.endoMuc?', com mucosa preservada':''}.`,'Endometriose vesical.');
  if(e.sonda)P(`Sonda vesical de demora${e.sondaVaz?', com bexiga vazia ao redor do balão':''}.`);
  e.div.forEach(d=>{const m=[d.d1,d.d2,d.d3].filter(Boolean).join(' x ');P(`Divertículo vesical${m?' medindo '+m+' cm':''}${d.colo?', com colo de '+d.colo+' mm':''}.`,'Divertículo vesical.');});
  return o.length?' '+o.join(' '):'';}

function liqFraseX(f){const l=estado.liquido,x=estado.liqX;if(l.sit!=='presente'||!(x.pequena||x.espesso||x.sept||x.complexo||x.anD||x.anE))return f;

   +R('hern','hérnia',`${sel('achX','hernT',O(['inguinal à direita','inguinal à esquerda']))}<span>conteúdo</span>${sel('achX','hernC',O(['adiposo','intestinal']))}<span>colo</span>${tIn('achX','hernV')}<span>cm</span>${sel('achX','hernR',[['nc','redutível? não citar'],['redutível','redutível'],['não redutível','não redutível']])}`))

function inserirNodulo(){const e=estado.achX;if(!e.nd1)return;const t=`Nódulo medindo ${medStr(e.nd1,e.nd2,e.nd3)} (volume: ${vol(e.nd1,e.nd2,e.nd3)} cm³).`;

function achXTxt(){const e=estado.achX,o=[],S={direito:'à direita',esquerdo:'à esquerda',bilateral:'bilateral'};
  if(e.hid)o.push(`Hidronefrose no rim ${e.hidL}${e.hidV?', com pelve renal de '+e.hidV+' cm no diâmetro anteroposterior':''}.`);
  if(e.nef)o.push(`Nefrolitíase ${S[e.nefL]}, ${e.nefT}${e.nefV?', o maior medindo '+e.nefV+' cm':''}.`);
  if(e.dur)o.push(`Dilatação do ureter distal ${e.durL}${e.durV?', com calibre de '+e.durV+' cm':''}.`);
  if(e.alca)o.push(`Alça intestinal espessada em ${e.alcaS}, com aspecto de ${e.alcaT}${e.alcaV?', com espessura de '+e.alcaV+' cm':''}.`);
  if(e.apen)o.push(`Apêndice cecal com aspecto sugestivo de apendicite${e.apenV?', com diâmetro de '+e.apenV+' cm':''}.`);
  if(e.lin){const m=[e.ln1,e.ln2].filter(Boolean).join(' x ');o.push(`Linfonodomegalia ilíaca ${e.linL}${m?', medindo '+m+' cm':''}.`);}
  if(e.hern)o.push(`Hérnia ${e.hernT}, com conteúdo ${e.hernC}${e.hernV?', colo de '+e.hernV+' cm':''}${e.hernR!=='nc'?', '+e.hernR:''}.`);
  return o.join(' ');}

function blocoTecnica(){ORADS_REC=[];const t=estado.tecnica;
  const v={adequada:'adequada',parcial:'parcial',excessiva:'excessiva (esvaziamento parcial realizado)',ausente:'ausente'}[t.vesical];
  const l=LIM.filter(x=>t[x[0]]).map(x=>x[1]);
  const so={nc:'',convexa:' com transdutor convexo por via pélvica',endo:' com transdutor endocavitário por via transvaginal',ambas:' com transdutor convexo por via pélvica e transdutor endocavitário por via transvaginal'}[t.sonda];
  let s=`Exame realizado${so}${so?',':''} com repleção vesical ${v}.`;
  if(l.length) s+=` Limitações técnicas: ${lista(l)}.`;
  let h=`<div class="doc-secao"><span class="doc-label">TÉCNICA:</span><div class="doc-p">${s}</div></div>`;
  const i=estado.indicacao;
  if(!i.nc){const x=IND.filter(a=>i[a[0]]).map(a=>a[1]);if(i.outra.trim())x.push(i.outra.trim());
    if(x.length) h+=`<div class="doc-secao"><span class="doc-label">INDICAÇÃO:</span><div class="doc-p">${lista(x)}.</div></div>`;}
  h+=blocoClinico();
  return h;}

function extrasAnalise(hd){const m=estado.miometrio,a=estado.anexos;let h='';
  if(a.var){let s=`Varizes pélvicas ${a.varLado}`;
    if(a.varMult) s+=', com múltiplas veias dilatadas';
    if(a.varDiam) s+=`, com diâmetro venoso máximo de ${a.varDiam} mm`;
    if(a.varHemo!=='nc') s+=`, com ${a.varHemo}`;
    if(a.varDist!=='nc') s+=`, acometendo ${a.varDist}`;
    if(a.varPred!=='nc') s+=`, ${a.varPred}`;
    h+=`<div class="doc-p">${s}.</div>`;hd.push(`Varizes pélvicas ${a.varLado}.`);}
  if(a.ascite){h+='<div class="doc-p">Presença de ascite ou nódulos peritoneais.</div>';hd.push('Ascite ou nódulos peritoneais.');}
  TUB.forEach(t=>['D','E'].forEach(l=>{if(!a[t[0]+l]) return;
    const lado=l==='D'?'à direita':'à esquerda',med=dimTxt(a,t[0]+l);
    h+=`<div class="doc-p">${t[1]} ${lado}${med?', medindo '+med:''}${t[0]==='hidro'?', classificada como ACR O-RADS 2':''}.</div>`;hd.push(`${t[1]} ${lado}${t[0]==='hidro'?' (ACR O-RADS 2)':''}.`);}));
  return h;}

function blocoRecomend(){const r=estado.recomend;if(!r.incluir) return '';
  const x=REC.filter(a=>r[a[0]]).map(a=>a[1].charAt(0).toUpperCase()+a[1].slice(1));if(ORADS_REC.length)x.push('O-RADS '+Math.max(...ORADS_REC)+': '+OR_REC[Math.max(...ORADS_REC)]+'.');if(r.extra.trim()) x.push(r.extra.trim());
  return x.length?`<div class="doc-secao"><span class="doc-label">RECOMENDAÇÕES:</span><div class="doc-p">${x.join('<br>')}</div></div>`:'';}

// ── GERAÇÃO DO LAUDO ──
function updateLaudo(){
  // Sincronizar valores de inputs dinâmicos
  syncInputs();

  const hd=[];
  let laudoHtml='';

  // Título
  laudoHtml+=`<div class="doc-titulo">ULTRASSONOGRAFIA PÉLVICA ABDOMINAL</div>`;

  // Técnica
  laudoHtml+=blocoTecnica();

  // Antecedentes (inline, sem bloco separado)
  const ant=estado.antecedentes;
  let fraseAnt='';
  if(ant.dum==='precisa'&&ant.dumData){
    const d=new Date(ant.dumData+'T12:00:00');
    const hoje=new Date();
    const diff=Math.round((hoje-d)/(1000*60*60*24));
    if(diff>=0&&diff<=35) fraseAnt=`${diff}º dia do ciclo menstrual.`;
    else if(diff>35&&diff<365) fraseAnt=`${diff} dias de amenorreia.`;
    else if(diff>=365) fraseAnt='Paciente menopausada.';
  } else if(ant.dum==='estimado'){
    fraseAnt=`Amenorreia de aproximadamente ${ant.dumValor} ${ant.dumUnidade}.`;
  }

  // ANÁLISE
  laudoHtml+=`<div class="doc-secao"><span class="doc-label">ANÁLISE:</span>`;

  // Bexiga
  const bex=estado.bexiga;
  let fraseBex='';
  if(bex.sit!=='nc'){
    const achados=[];
    if(bex.debris) { achados.push('ecos em suspensão'); hd.push('Bexiga contendo debris em seu interior.'); }
    if(bex.coagulo) { achados.push('coágulo móvel'); hd.push('Coágulo vesical.'); }
    if(bex.calculo) { achados.push('cálculo'); hd.push('Litíase vesical.'); }
    if(bex.lesao) { achados.push('lesão exofítica parietal'); hd.push('Lesão vesical. Sugere-se complementação com cistoscopia.'); }

    let conteudo = achados.length===0
      ? 'e conteúdo homogêneo.'
      : 'e conteúdo heterogêneo à custa de '+achados.join(', ')+'.';

    if(bex.sit==='habitual') fraseBex=`Bexiga com distensão adequada, apresentando contornos regulares, parede com espessura normal ${conteudo}`;
    else if(bex.sit==='parcial') fraseBex=`Bexiga com distensão parcial, apresentando contornos regulares, paredes com espessura normal ${conteudo}`;
    else if(bex.sit==='espessada') { fraseBex=`Bexiga com distensão adequada, apresentando contornos regulares, paredes com espessura aumentada ${conteudo}`; hd.push('Espessamento parietal vesical difuso.'); }
    else if(bex.sit==='vazia') { fraseBex='Bexiga com repleção insuficiente.'; hd.push('Bexiga com repleção insuficiente.'); }

    if(bex.sonda) { fraseBex+=' Presença de balonete de sonda vesical.'; hd.push('Bexiga cateterizada.'); }

    if(bex.jatos==='presentes') fraseBex+='<br>Jatos ureterais presentes e simétricos.';
    else if(bex.jatos==='reduzidos') { fraseBex+='<br>Jatos ureterais assimétricos.'; hd.push('Jatos ureterais assimétricos.'); }
    else if(bex.jatos==='ausentes') { fraseBex+='<br>Jatos ureterais não caracterizados.'; hd.push('Jatos ureterais não caracterizados.'); }

    laudoHtml+=`<div class="doc-p">${fraseBex}${bexExtraTxt(hd)}</div>`;
  }

  // Útero
  const ute=estado.utero;
  let fraseUte='', opUte='';
  const refUte=ant.status==='menopausa'?70:(ant.gesta==='0'?90:ant.gesta==='1'?140:ant.gesta==='3'?160:180);
  const refUteStr=refUte.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
  const volUte=vol(ute.d1,ute.d2,ute.d3);
  const volUteStr=volUte||'_';
  const flexaoMap={ante:'anteversoflexão',medio:'médioversoflexão',retro:'retroversoflexão'};
  const flex=flexaoMap[ute.flexao]||ute.flexao;

  if(ute.sit==='habitual'||ute.sit==='aumentado'){
    const fm=ute.formato?` ${ute.formato},`:'';
    const dsv={'centrado':'centrado','à direita':'desviado à direita','à esquerda':'desviado à esquerda'}[ute.desvio]||'centrado';
    const dm=ute.d1?`medindo cerca de ${medStr(ute.d1,ute.d2,ute.d3)}${volUte?`, com volume estimado de ${volUteStr} cm³`:''}`:'dimensões habituais';
    fraseUte=`Útero${fm} em ${flex}, ${dsv}, com contornos ${ute.contornos}, ${dm}. ${miometrioAlterado()?'':`Miométrio ${ute.miometrio==='homogeneo'?'homogêneo':'heterogêneo'}.`}`;
  } else if(ute.sit==='parcial'){
    fraseUte='Sinais de histerectomia parcial, com colo uterino remanescente de aspecto habitual.';
    hd.push('Status pós-histerectomia parcial.');
  } else if(ute.sit==='total'){
    fraseUte='Sinais de histerectomia total. Não se visualiza o corpo uterino.';
    hd.push('Status pós-histerectomia total.');
  }

  // Adenomiose e miomas
  if(ute.sit!=='parcial'&&ute.sit!=='total'){
    fraseUte=uteroMalfTxt(fraseUte,hd);
    fraseUte+=miometrioTxt(hd);

    // Colo
    if(ute.colo==='habitual'){
      fraseUte+='<br>Colo uterino e canal endocervical de aspecto habitual.';
    } else if(ute.colo==='colpite'){
      fraseUte+='<br>Colo uterino com sinais de colpite.';
      hd.push('Sinais de colpite.');
    }
    if(ute.coloCisto){ fraseUte+=' Presença de cisto nabothiano.'; hd.push('Cisto nabothiano.'); }
  }

  laudoHtml+=`<div class="doc-p">${fraseUte}</div>`;

  // Endométrio (só se útero não for total/parcial)
  if(ute.sit!=='parcial'&&ute.sit!=='total'){
    const end=estado.endometrio;
    let fraseEnd='';
    const esp=end.espessura||'_';
    const car=end.car==='parcial'?'parcialmente caracterizado, ':'';

    if(end.diu==='normoposicionado'){
      fraseEnd='Cavidade uterina ocupada por DIU, com seu extremo inferior da haste central acima do orifício cervical interno, com suas hastes transversais simétricas e abertas no sentido látero-lateral, sem alterações de rotação.';
      hd.push('DIU tópico.');
    } else if(end.diu==='baixo'){
      fraseEnd='Cavidade uterina parcialmente ocupada por DIU, com seu extremo inferior da haste central abaixo do orifício cervical interno, com suas hastes transversais parcialmente abertas.';
      hd.push('DIU em posição baixa na cavidade uterina.');
    } else if(end.diu==='deslocado'){
      fraseEnd='Dispositivo intra-uterino (DIU) com trajeto intramural, deslocado de sua posição habitual.';
      hd.push('DIU deslocado / intramural.');
    } else if(end.sit==='nc'){
      fraseEnd='Endométrio não caracterizado.';
    } else if(end.sit==='habitual'){
      fraseEnd=`Endométrio ${car}regular e homogêneo, com espessura de ${esp} mm.`;
    } else if(end.sit==='laminar'){
      fraseEnd=`Endométrio ${car}regular, de aspecto trilaminar, com espessura de ${esp} mm.`;
    } else if(end.sit==='secretor'){
      fraseEnd=`Endométrio ${car}regular, de aspecto secretor, com espessura de ${esp} mm.`;
    } else if(end.sit==='heterogeneo'){
      fraseEnd=`Endométrio ${car}com espessura de ${esp} mm, de aspecto heterogêneo.`;
      hd.push('Endométrio de aspecto heterogêneo.');
    } else if(end.sit==='espessado'){
      fraseEnd=`Endométrio ${car}espessado e homogêneo, com espessura de ${esp} mm.`;
      hd.push('Espessamento endometrial. Sugere-se correlação clínica.');
    } else if(end.sit==='atrofico'){
      fraseEnd=`Endométrio ${car}atrófico, de aspecto laminar fino, com espessura de ${esp} mm.`;
    }

    if(end.liquido&&end.diu==='nao'){ fraseEnd+=' Presença de discreta quantidade de líquido anecoico intracavitário.'; hd.push('Líquido intracavitário (mucometra/hemometra?).'); }
    if(end.polipo&&end.diu==='nao'){ fraseEnd+=' Presença de imagem polipoide hiperecoica endometrial.'; hd.push('Lesão polipoide endometrial.'); }

    laudoHtml+=`<div class="doc-p">${endDuplo(fraseEnd)}</div>`;
    laudoHtml+=endExtraTxt(hd);
  }

  // Ovários
  function fraseOvario(lado){
    const key='ovario'+lado;
    const e=estado[key];
    const lbl=lado==='D'?'Direito':'Esquerdo';
    const lblMin=lado==='D'?'direito':'esquerdo';
    const refOv=ant.status==='menopausa'?5:10;
    const refOvStr=`${refOv.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}`;
    const v=vol(e.d1,e.d2,e.d3);
    const vStr=v||'_';

    let s='';
    if(e.sit==='nc'){
      if(e.ncMotivo==='ooforectomia'){ s=`Sinais de ooforectomia à ${lblMin}.`; hd.push(`Sinais de ooforectomia à ${lblMin}.`); }
      else if(e.ncMotivo==='atrofia'){ s=`Ovário ${lblMin} não caracterizado ao método, compatível com provável involução fisiológica.`; }
      else if(e.ncMotivo==='interposicao'){ s=`Ovário ${lblMin} não caracterizado ao método por interposição gasosa.`; }
      else { s=`Ovário ${lblMin} não caracterizado ao método.`; }
    } else if(e.sit==='habitual'){
      s=`Ovário ${lblMin} tópico, de contornos regulares, medindo cerca de ${medStr(e.d1,e.d2,e.d3)} com volume de ${vStr} cm³ (normal até ${refOvStr} cm³). O parênquima tem ecotextura habitual.`;
    } else if(e.sit==='aumentado'){
      s=`Ovário ${lblMin} tópico, de contornos regulares, com dimensões aumentadas, medindo cerca de ${medStr(e.d1,e.d2,e.d3)} com volume de ${vStr} cm³.`;
      hd.push(`Ovário ${lblMin} de dimensões aumentadas.`);
    } else if(e.sit==='multifolicular'){
      s=`Ovário ${lblMin} tópico, de dimensões ${e.d1?`medindo ${medStr(e.d1,e.d2,e.d3)} com volume de ${vStr} cm³`:'habituais'}, apresentando padrão multifolicular com cistos de até ${e.mulAte||'_'} cm.`;
    } else if(e.sit==='policistico'){
      s=`Ovário ${lblMin} com aspecto policístico, medindo ${medStr(e.d1,e.d2,e.d3)} com volume de ${vStr} cm³.`;
      hd.push(`Ovário ${lblMin} com aspecto policístico.`);
    }

    // Achados
    const achs=[];
    if(e.folFun){ achs.push(`folículo dominante medindo ${medStr(e.funD1,e.funD2,e.funD3)}`); hd.push(`Folículo no ovário ${lblMin}.`); }
    if(e.cLuteo){ achs.push(`corpo lúteo medindo ${medStr(e.lutD1,e.lutD2,e.lutD3)}`); hd.push(`Corpo lúteo no ovário ${lblMin}.`); }
    if(e.cSimples){ achs.push(`cisto de aspecto simples, anecoico, de paredes finas, medindo ${medStr(e.simD1,e.simD2,e.simD3)}`); hd.push(`Cisto de aspecto simples no ovário ${lblMin}.`); }
    if(e.cHem){ achs.push(`cisto hemorrágico medindo ${medStr(e.hemD1,e.hemD2,e.hemD3)}`); hd.push(`Cisto hemorrágico no ovário ${lblMin}.`); }
    if(e.endometrioma){ achs.push(`endometrioma de conteúdo espesso e homogêneo, medindo ${medStr(e.endD1,e.endD2,e.endD3)}`); hd.push(`Endometrioma no ovário ${lblMin}.`); }
    if(e.cDermoide){ achs.push(`cisto dermoide medindo ${medStr(e.derD1,e.derD2,e.derD3)}`); hd.push(`Cisto dermoide no ovário ${lblMin}.`); }

    if(achs.length===1) s+=` Presença de ${achs[0]}.`;
    else if(achs.length>1) s+=` Presença de: ${achs.join('; ')}.`;

    return s;
  }

  laudoHtml+=`<div class="doc-p">${fraseOvario('D')}</div>`+ovExtraTxt('D',hd);
  laudoHtml+=`<div class="doc-p">${fraseOvario('E')}</div>`+ovExtraTxt('E',hd);

  // Líquido livre
  const liq=estado.liquido;
  let fraseLiq='';
  if(liq.sit==='ausente'){
    fraseLiq='Ausência de líquido livre na cavidade pélvica.';
  } else {
    const aspMap={anecoico:'anecoico',ecos:'com ecos em suspensão',hetero:'heterogêneo'};
    const locMap={pélvica:'na cavidade pélvica',douglas:'no fundo de saco de Douglas',periuterino:'em região periuterina / periovarianas',abdominal:'nas cavidades pélvica e abdominal'};
    fraseLiq=`Presença de ${liq.qtd} quantidade de líquido ${aspMap[liq.aspecto]||liq.aspecto} ${locMap[liq.local]||liq.local}.`;
    hd.push(`Líquido livre ${locMap[liq.local]||liq.local}.`);
  }
  laudoHtml+=`<div class="doc-p">${liqFraseX(fraseLiq)}</div>`;
  laudoHtml+=extrasAnalise(hd);

  laudoHtml+='</div>';

  // Opinião
  let opiniao='';
  if(hd.length===0){
    opiniao='Estudo ecográfico sem evidentes anormalidades apreciáveis ao método.';
  } else {
    opiniao=hd.join('<br>')+'\n<br>Demais estruturas sem evidentes anormalidades apreciáveis ao método.';
  }

  laudoHtml+=`<div class="doc-secao"><span class="doc-label">IMPRESSÃO DIAGNÓSTICA:</span><div class="doc-p">${opiniao.replace(/\n/g,'')}</div></div>`;

  // Achados adicionais
  const _ax=achXTxt();
  if(estado.achados.texto||_ax){
    laudoHtml+=`<div class="doc-secao"><span class="doc-label">ACHADOS ADICIONAIS:</span><div class="doc-p">${_ax}${_ax&&estado.achados.texto?' ':''}${estado.achados.texto}</div></div>`;
  }

  laudoHtml+=blocoRecomend();
  document.getElementById('laudo-doc').innerHTML=laudoHtml;
}

// Sincronizar inputs dinâmicos que surgem com chkRow/triDim
function syncInputs(){
  function getVal(id){ const el=document.getElementById(id); return el?el.value:''; }

  // Útero dims
  const ud1=getVal('uteD1'),ud2=getVal('uteD2'),ud3=getVal('uteD3');
  if(ud1!==undefined){ estado.utero.d1=ud1; estado.utero.d2=ud2; estado.utero.d3=ud3; }

  // Miomas
  if(estado.utero.nod1){
    estado.utero.nod1d1=getVal('uteN1D1'); estado.utero.nod1d2=getVal('uteN1D2'); estado.utero.nod1d3=getVal('uteN1D3');
  }
  if(estado.utero.nod2){
    estado.utero.nod2d1=getVal('uteN2D1'); estado.utero.nod2d2=getVal('uteN2D2'); estado.utero.nod2d3=getVal('uteN2D3');
  }
  if(estado.utero.nodMul){
    estado.utero.nodMulD1=getVal('uteNMD1'); estado.utero.nodMulD2=getVal('uteNMD2'); estado.utero.nodMulD3=getVal('uteNMD3');
  }

  // Ovário D
  estado.ovarioD.d1=getVal('ovaDdD1')||getVal('ovaDdim1')||''; // fallback
  function syncOva(l){
    const key='ovario'+l;
    const e=estado[key];
    const pf='ova'+l;
    const fd=getVal(pf+'D1'); if(fd!==undefined){ e.d1=fd||''; e.d2=getVal(pf+'D2')||''; e.d3=getVal(pf+'D3')||''; }
    if(e.folFun){ e.funD1=getVal(pf+'FunD1'); e.funD2=getVal(pf+'FunD2'); e.funD3=getVal(pf+'FunD3'); }
    if(e.cLuteo){ e.lutD1=getVal(pf+'LutD1'); e.lutD2=getVal(pf+'LutD2'); e.lutD3=getVal(pf+'LutD3'); }
    if(e.cSimples){ e.simD1=getVal(pf+'SimD1'); e.simD2=getVal(pf+'SimD2'); e.simD3=getVal(pf+'SimD3'); }
    if(e.cHem){ e.hemD1=getVal(pf+'HemD1'); e.hemD2=getVal(pf+'HemD2'); e.hemD3=getVal(pf+'HemD3'); }
    if(e.endometrioma){ e.endD1=getVal(pf+'EndD1'); e.endD2=getVal(pf+'EndD2'); e.endD3=getVal(pf+'EndD3'); }
    if(e.cDermoide){ e.derD1=getVal(pf+'DerD1'); e.derD2=getVal(pf+'DerD2'); e.derD3=getVal(pf+'DerD3'); }
  }
  syncOva('D'); syncOva('E');

  // Endométrio
  const endEl=document.getElementById('end-esp');
  if(endEl) estado.endometrio.espessura=endEl.value;
}

function copiar() {
  var el = document.getElementById('laudo-doc');
  if (!el) return;
  _copyLaudoRichText(el, function(ok) {
    if (ok) {
      showToast('Laudo copiado para a área de transferência!');
    } else {
      showToast('Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
    }
  });
}

// Intercepta copy manual no dark mode para remover fundo escuro
document.getElementById('laudo-doc').addEventListener('copy', function(e) {
  if (!document.body.classList.contains('dark')) return;
  document.body.classList.remove('dark');
  document.body.offsetHeight;
  setTimeout(function() {
    document.body.classList.add('dark');
  }, 0);
});

function showToast(msg) {
  let t = document.getElementById('toast-notification');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
