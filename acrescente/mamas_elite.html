<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Mamas — THI-RADS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a56db;--blue-dark:#1140a6;--blue-light:#e8f0fe;--blue-mid:#dbeafe;
  --surface:#f4f6fb;--border:#e2e6ef;--border-strong:#c8cfe0;
  --text:#1a1f2e;--text-2:#4b5570;--text-3:#8892a4;
  --white:#ffffff;--green:#059669;--red:#dc2626;--radius:8px;--radius-lg:12px;
}
body.dark{
  --blue:#4d86f5;--blue-dark:#3a6fd4;--blue-light:#1e2d4a;--blue-mid:#1e2d4a;
  --surface:#141820;--border:#2a2f3d;--border-strong:#3a4155;
  --text:#e2e6f0;--text-2:#9aa3b8;--text-3:#5d6680;
  --white:#1e2230;--green:#34d399;--red:#f87171;
}
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:#1e2230;border-left-color:var(--border);}
body.dark .laudo-body{background:#1e2230;}
body.dark .laudo-header{background:#1e2230;border-bottom-color:var(--border);}
@media print{
  body.dark .laudo-doc,
  body.dark .laudo-doc *{color:#111 !important;}
}
.btn-dark{margin-left:auto;}
body.dark .btn-dark{background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover{background:#343a4d;color:#fff;}
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text],body.dark .ff input[type=number]{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .radio-mark{background:var(--white);}
body.dark .check-box{background:var(--white);}
body.dark .sub-opts{background:#1a2040;border-bottom-color:#2a3460;}
body.dark .sub-opt-label{background:var(--white);color:var(--text-2);}
body.dark .lesao-card{background:#141820;border-color:var(--border);}
body.dark .toolbar{background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar{background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd{border-bottom-color:var(--border);}
body.dark .block{background:var(--white);border-color:var(--border);}
body.dark .block-title{background:var(--white);border-bottom-color:var(--border);}
body.dark .radio-opt:hover{background:#1e2d4a;}
body.dark .radio-opt.selected{background:#1e2d4a;}
body.dark .check-row{background:#1a1f2e;}
body.dark .check-row:hover{background:#1e2d4a;}
body.dark .check-row.selected{background:#1e2d4a;}
body.dark .btn-add-lesao{background:var(--white);color:var(--text-2);border-color:var(--border-strong);}
body.dark .sel-tag{background:var(--white);color:var(--text);border-color:var(--border-strong);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:10px;height:48px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:6px;margin-right:12px;}
.logo-name{font-size:17px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:.2px;}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);font-weight:500;transition:all .13s;background:var(--white);color:var(--text-2);}
.btn:hover{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.btn-danger{background:#fff5f5;color:var(--red);border-color:#fecaca;}
body.dark .btn-danger{background:#2d1a1a;border-color:#6b2929;}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:148px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.sidebar-titulo{font-size:11px;font-weight:600;color:var(--text);}
.nav-group{padding:6px 0;}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:11.5px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:2px solid transparent;}
.nav-item:hover{background:var(--blue-light);color:var(--blue);}
.nav-item.active{background:var(--blue-light);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}
.panel{width:500px;flex-shrink:0;overflow-y:auto;padding:14px 14px 20px;background:var(--surface);}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';display:block;width:3px;height:16px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:10px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;padding:8px 14px 7px;border-bottom:1px solid var(--border);background:var(--white);}
.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:#f5f8ff;}
.radio-opt.selected{background:var(--blue-light);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;font-size:12.5px;color:var(--text-2);line-height:1.4;cursor:pointer;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:500;}
.radio-mark{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
.radio-opt.selected .radio-mark::after{opacity:1;}
.check-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;background:#fafbff;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:#f0f5ff;}
.check-row.selected{background:#e6eeff;}
.check-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
.check-label{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px 8px 32px;font-size:12px;color:var(--text-2);cursor:pointer;}
.check-row.selected .check-label{color:var(--blue);font-weight:500;}
.check-box{width:15px;height:15px;border-radius:4px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:9px;height:9px;}
.check-row.selected .check-box svg{display:block;}
.sel-tag{font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 6px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:5px;cursor:pointer;}
.dim-rows{padding:8px 14px;display:flex;flex-direction:column;gap:6px;}
.dim-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.dim-lbl{flex:1;font-size:12px;color:var(--text-2);}
.dim-input{width:60px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.dim-unit{font-size:12px;color:var(--text-3);}
.nodulo-wrap{padding:8px 14px;display:flex;flex-direction:column;gap:7px;}
.btn-add-lesao{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;transition:all .12s;border:1.5px dashed var(--border-strong);background:var(--white);color:var(--text-2);width:100%;justify-content:center;}
.btn-add-lesao:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
.lesao-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;}
.lesao-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.lesao-hd-title{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;}
.btn-rem{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:4px;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;border:1px solid #fecaca;background:#fff5f5;color:var(--red);transition:all .12s;}
.btn-rem:hover{background:#fee2e2;}
.ff-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.ff{display:flex;flex-direction:column;gap:2px;}
.ff label{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.ff select,.ff input[type=text],.ff input[type=number]{font-size:11px;padding:4px 7px;border:1px solid var(--border-strong);border-radius:5px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);}
.ff select:focus,.ff input:focus{outline:none;border-color:var(--blue);}
.ff input[type=text],.ff input[type=number]{width:58px;text-align:center;}
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
.inline-select{font-size:11px;padding:3px 6px;border:1px solid var(--border-strong);border-radius:5px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:4px;}
.inline-select:focus{outline:none;border-color:var(--blue);}
.inline-num{width:52px;font-size:11px;padding:3px 6px;border:1px solid var(--border-strong);border-radius:5px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);text-align:center;margin:0 2px;}
.inline-num:focus{outline:none;border-color:var(--blue);}
.laudo-doc:focus { outline: none; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-thirads.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <button class="btn" onclick="window.location.href='../laudo-thirads.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>
  <div class="tb-sep"></div>
  <button class="btn" onclick="copiar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copiar laudo</button>
  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>
  <button class="btn btn-dark" id="btn-dark-toggle" onclick="toggleDark()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro</button>
  <button class="btn btn-danger" onclick="reiniciar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 1.5-3.9M2 4v4h4"/></svg>Reiniciar</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd"><div class="sidebar-tipo">Ultrassonografia</div><div class="sidebar-titulo">Mamas</div></div>
    <div class="nav-group">
      <div class="nav-item" id="nav-composicao" onclick="showSection('composicao')"><span class="nav-dot"></span>Composição</div>
      <div class="nav-item" id="nav-cirurgias" onclick="showSection('cirurgias')"><span class="nav-dot"></span>Cirurgias</div>
      <div class="nav-item" id="nav-implantes" onclick="showSection('implantes')"><span class="nav-dot"></span>Implantes</div>
      <div class="nav-item" id="nav-cistos" onclick="showSection('cistos')"><span class="nav-dot"></span>Cistos</div>
      <div class="nav-item" id="nav-nodulos" onclick="showSection('nodulos')"><span class="nav-dot"></span>Nódulos</div>
      <div class="nav-item" id="nav-linfonodo" onclick="showSection('linfonodo')"><span class="nav-dot"></span>Linfonodo IM</div>
      <div class="nav-item" id="nav-ectasias" onclick="showSection('ectasias')"><span class="nav-dot"></span>Ectasias Ductais</div>
      <div class="nav-item" id="nav-distorcao" onclick="showSection('distorcao')"><span class="nav-dot"></span>Distorção Arq.</div>
      <div class="nav-item" id="nav-muscular" onclick="showSection('muscular')"><span class="nav-dot"></span>Planos Musc.</div>
      <div class="nav-item" id="nav-birads" onclick="showSection('birads')"><span class="nav-dot"></span>BIRADS</div>
    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

<script>
// ── ESTADO ──
const estado = {
  composicao: 'fibroglandular',
  cirurgias: { mastDir:false, mastEsq:false, mastBil:false, recDir:false, recEsq:false, recBil:false, quadDir:false, quadEsq:false, quadBil:false, mamDir:false, mamEsq:false, mamBil:false },
  implantes: { sit:'ausentes', loc:'retroglandular', lat:'bilateralmente', intDir:false, intEsq:false, intBil:false, extDir:false, extEsq:false, extBil:false, hetDir:false, hetEsq:false, hetBil:false },
  cistos: [],
  cistosMultDir:false, cistosMultEsq:false, cistosMultBil:false,
  nodulos: [],
  linfonodo: { sit:'ausentes', locDir:'qsl', locEsq:'qsl' },
  ectasias: { sit:'ausentes', preLoc:'rra', preLat:'bilateral', preCon:'anecoico', preCal:'', nodLoc:'rra', nodLat:'bilateral', nodCal:'', nodMed1:'', nodMed2:'', nodMed3:'', nodDop:'sem', nodPap:'', nodPel:'' },
  distorcao: { sit:'ausente', sitLoc:'qsl', sitLat:'direita', forLoc:'qsl', forLat:'direita' },
  muscular: { habitual:true, colOrg:false, orgPar:'finas', orgCon:'anecoico', orgMed1:'', orgMed2:'', orgMed3:'', orgDis:'', orgSep:false, colNao:false, naoMed1:'', naoMed2:'', naoMed3:'', naoDis:'' },
  birads: { modo:'auto' }
};

let cistoCont = 0;
let noduloCont = 0;

// ── HELPERS ──
function sv(k,v){ eval(`estado.${k}=v`); updateLaudo(); }
function setSit(sec,v){ estado[sec].sit=v; renderSection(sec); updateLaudo(); }

function chkSvg(){ return `<svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="2"><polyline points="1.5,5 4,7.5 8.5,2.5"/></svg>`; }

function radio(name, val, label, cur, onclick){
  const sel = cur===val;
  return `<div class="radio-opt${sel?' selected':''}" onclick="${onclick}">
    <input type="radio" name="${name}">
    <label class="radio-label"><span class="radio-mark"></span>${label}</label>
  </div>`;
}

function chk(id, label, checked, onclick){
  const sel = checked;
  return `<div class="check-row${sel?' selected':''}" onclick="${onclick}">
    <input type="checkbox" id="${id}">
    <label class="check-label"><span class="check-box">${sel?chkSvg():''}</span>${label}</label>
  </div>`;
}

function dimInput(id, label, val, unit='cm', extra=''){
  return `<div class="dim-row">
    <span class="dim-lbl">${label}</span>
    <input class="dim-input" type="number" id="${id}" value="${val}" step="0.1" min="0" onchange="sv('${extra||id}',this.value);updateLaudo()" oninput="sv('${extra||id}',this.value);updateLaudo()">
    <span class="dim-unit">${unit}</span>
  </div>`;
}

function sel(id, opts, cur, onch, style=''){
  return `<select class="inline-select" id="${id}" onchange="${onch}" style="${style}">${opts.map(([v,l])=>`<option value="${v}"${cur===v?' selected':''}>${l}</option>`).join('')}</select>`;
}

const LOCS = [['01','01h'],['02','02h'],['03','03h'],['04','04h'],['05','05h'],['06','06h'],['07','07h'],['08','08h'],['09','09h'],['10','10h'],['11','11h'],['12','12h'],['rra','ret. retroareolar'],['qsm','QSM'],['qsl','QSL'],['qim','QIM'],['qil','QIL']];
const LOCS2 = [['rra','ret. retroareolar'],['qsm','QSM'],['qsl','QSL'],['qim','QIM'],['qil','QIL']];
const LOCS_TXT = {
  '01':'01 hora','02':'02 horas','03':'03 horas','04':'04 horas','05':'05 horas','06':'06 horas',
  '07':'07 horas','08':'08 horas','09':'09 horas','10':'10 horas','11':'11 horas','12':'12 horas',
  'rra':'região retroareolar','qsm':'quadrante superior medial','qsl':'quadrante superior lateral',
  'qim':'quadrante inferior medial','qil':'quadrante inferior lateral'
};

// ── SEÇÕES ──
function renderSection(sec){
  const funcs = {
    composicao: renderComposicao,
    cirurgias: renderCirurgias,
    implantes: renderImplantes,
    cistos: renderCistos,
    nodulos: renderNodulos,
    linfonodo: renderLinfonodo,
    ectasias: renderEctasias,
    distorcao: renderDistorcao,
    muscular: renderMuscular,
    birads: renderBirads,
  };
  const fn = funcs[sec];
  if(fn) document.getElementById('main-panel').innerHTML = `<div class="sec-title">${secLabel(sec)}</div>${fn()}`;
  // Set nav active
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const ni = document.getElementById('nav-'+sec);
  if(ni) ni.classList.add('active');
}

function secLabel(s){
  const m = {composicao:'Composição das Mamas',cirurgias:'Cirurgias',implantes:'Implantes',cistos:'Cistos',nodulos:'Nódulos',linfonodo:'Linfonodo Intramamário',ectasias:'Ectasias Ductais',distorcao:'Distorção Arquitetural',muscular:'Planos Musculares',birads:'BIRADS'};
  return m[s]||s;
}

function showSection(s){ renderSection(s); }

// ── COMPOSIÇÃO ──
function renderComposicao(){
  const c = estado.composicao;
  const r = (v,l) => radio('comp',v,l,c,`estado.composicao='${v}';renderSection('composicao');updateLaudo()`);
  return `<div class="block"><div class="block-title">Padrão de ecotextura de fundo</div>
    ${r('fibroglandular','predomínio fibroglandular')}
    ${r('adiposa','predomínio adiposo')}
    ${r('heterogenea','ecotextura heterogênea (áreas adiposas com áreas fibroglandulares)')}
    ${r('lactacional','paciente em período lactacional com dilatação ductal')}
    ${r('lactacionalSem','paciente em período lactacional sem dilatação ductal')}
  </div>`;
}

// ── CIRURGIAS ──
function renderCirurgias(){
  const ci = estado.cirurgias;
  return `<div class="block"><div class="block-title">Mastectomia</div>
    ${chk('cmas-dir','mastectomia direita', ci.mastDir, "estado.cirurgias.mastDir=!estado.cirurgias.mastDir;renderSection('cirurgias');updateLaudo()")}
    ${chk('cmas-esq','mastectomia esquerda', ci.mastEsq, "estado.cirurgias.mastEsq=!estado.cirurgias.mastEsq;renderSection('cirurgias');updateLaudo()")}

  ${mu.colNao?`<div class="block"><div class="block-title">Coleção não organizada — detalhes</div>
    <div class="dim-rows">
      <div class="dim-row"><span class="dim-lbl">med 1 (cm):</span><input class="dim-input" type="number" step="0.1" value="${mu.naoMed1}" onchange="estado.muscular.naoMed1=this.value;updateLaudo()"></div>
      <div class="dim-row"><span class="dim-lbl">med 2 (cm):</span><input class="dim-input" type="number" step="0.1" value="${mu.naoMed2}" onchange="estado.muscular.naoMed2=this.value;updateLaudo()"></div>
      <div class="dim-row"><span class="dim-lbl">med 3 (cm):</span><input class="dim-input" type="number" step="0.1" value="${mu.naoMed3}" onchange="estado.muscular.naoMed3=this.value;updateLaudo()"></div>
      <div class="dim-row"><span class="dim-lbl">dist. pele (cm):</span><input class="dim-input" type="number" step="0.1" value="${mu.naoDis}" onchange="estado.muscular.naoDis=this.value;updateLaudo()"></div>
    </div>
  </div>`:''}`;
}

// ── BIRADS ──
function renderBirads(){
  const bi = estado.birads;
  const biAuto = calcBirads();
  return `<div class="block"><div class="block-title">Classificação</div>
    ${radio('bir','auto',`classificação automática: ACR BIRADS® ${biAuto}`,bi.modo,"estado.birads.modo='auto';renderSection('birads');updateLaudo()")}
    ${radio('bir','manual','classificação manual:',bi.modo,"estado.birads.modo='manual';renderSection('birads');updateLaudo()")}
    ${bi.modo==='manual'?`<div style="padding:8px 14px">
      <select class="inline-select" id="bir-man" onchange="estado.birads.manual=this.value;updateLaudo()">
        ${['0','1','2','3','4','4a','4b','4c','5','6'].map(v=>`<option value="${v}"${(bi.manual||'1')===v?' selected':''}>BIRADS ${v}</option>`).join('')}
      </select></div>`:''}
  </div>`;
}

// ── CÁLCULO BIRADS AUTO ──
function calcBirads(){
  let b = 1;
  const ci = estado.cirurgias;
  if(ci.mastDir||ci.mastEsq||ci.mastBil||ci.quadDir||ci.quadEsq||ci.quadBil||ci.mamDir||ci.mamEsq||ci.mamBil) b=Math.max(b,2);
  if(estado.implantes.sit==='presentes'){
    if(estado.implantes.intDir||estado.implantes.intEsq||estado.implantes.extDir||estado.implantes.extEsq||estado.implantes.hetDir||estado.implantes.hetEsq) b=Math.max(b,2);
    else b=Math.max(b,2);
  }
  estado.cistos.forEach(c=>{
    if(c.par==='espessas'||c.sep==='espessas') b=Math.max(b,3);
    else b=Math.max(b,2);
  });
  if(estado.cistosMultDir||estado.cistosMultEsq||estado.cistosMultBil) b=Math.max(b,2);
  estado.nodulos.forEach(n=>{
    if(n.com==='solido'&&n.for==='oval'&&n.eco==='hipoecoico'&&n.mar==='circunscritas'&&n.ori==='paralelo') b=Math.max(b,3);
    else b=Math.max(b,4);
  });
  if(estado.linfonodo.sit!=='ausentes') b=Math.max(b,2);
  if(estado.ectasias.sit==='nodulo') b=Math.max(b,4);
  if(estado.distorcao.sit==='fora') b=Math.max(b,4);
  return b;
}

// ── GERAÇÃO DO LAUDO ──
function updateLaudo(){
  const ci = estado.cirurgias;
  const im = estado.implantes;
  const ln = estado.linfonodo;
  const ec = estado.ectasias;
  const di = estado.distorcao;
  const mu = estado.muscular;
  const bi = estado.birads;

  let opiniao = [];
  let laudoBirads = bi.modo==='manual'?(bi.manual||'1'):calcBirads();

  // ── TÉCNICA ──
  let tecHtml = `<div class="doc-p">Exame realizado em aparelho dinâmico com transdutor linear de alta frequência.</div>`;

  // ── ANÁLISE: MAMAS / CIRURGIAS ──
  let analiseHtml = '';

  // Morfologia geral
  let mamBase = 'Mamas de morfologia normal e contornos regulares.';
  if(ci.mastBil) { mamBase='Mamas ausentes (status pós-manipulação cirúrgica bilateral).'; opiniao.push('Status pós-mastectomia bilateral.'); }
  else if(ci.mastDir&&!ci.mastEsq) { mamBase='Mama direita ausente (status pós-manipulação cirúrgica).<br>Mama esquerda de morfologia normal e contornos regulares.'; opiniao.push('Status pós-mastectomia direita.'); }
  else if(ci.mastEsq&&!ci.mastDir) { mamBase='Mama esquerda ausente (status pós-manipulação cirúrgica).<br>Mama direita de morfologia normal e contornos regulares.'; opiniao.push('Status pós-mastectomia esquerda.'); }
  else if(ci.quadBil) { mamBase='Distorção arquitetural do parênquima de natureza cicatricial bilateralmente.'; opiniao.push('Status pós-manipulação cirúrgica bilateral.'); }
  else if(ci.quadDir) { mamBase='Mama direita apresentando distorção arquitetural do parênquima de natureza cicatricial.'; opiniao.push('Status pós-manipulação cirúrgica em mama direita.'); }
  else if(ci.quadEsq) { mamBase='Mama esquerda apresentando distorção arquitetural do parênquima de natureza cicatricial.'; opiniao.push('Status pós-manipulação cirúrgica em mama esquerda.'); }
  else if(ci.mamBil) { mamBase='Distorção arquitetural de natureza cirúrgica bilateralmente (mamoplastia).'; opiniao.push('Status pós-mamoplastia.'); }
  else if(ci.mamDir) { mamBase='Mama direita apresentando distorção arquitetural de natureza cirúrgica (mamoplastia).'; opiniao.push('Status pós-mamoplastia.'); }
  else if(ci.mamEsq) { mamBase='Mama esquerda apresentando distorção arquitetural de natureza cirúrgica (mamoplastia).'; opiniao.push('Status pós-mamoplastia.'); }
  analiseHtml += `<div class="doc-p">${mamBase}</div>`;

  // Pele
  analiseHtml += `<div class="doc-p">Pele e tecido subcutâneo sem anormalidades detectáveis.</div>`;

  // Composição
  let compFrase = '';
  if(estado.composicao==='fibroglandular') compFrase='A composição mamária apresenta ecotextura de fundo homogênea com predomínio fibroglandular.';
  else if(estado.composicao==='adiposa') compFrase='A composição mamária apresenta ecotextura de fundo homogênea com predomínio adiposo.';
  else if(estado.composicao==='heterogenea') compFrase='A composição mamária apresenta ecotextura de fundo heterogênea, com áreas adiposas entremeando o tecido fibroglandular.';
  else if(estado.composicao==='lactacional') compFrase='A composição mamária apresenta ecotextura de fundo heterogênea, hiperecogenicidade difusa e predomínio acentuado de tecido fibroglandular denso, com dilatação ductal.';
  else if(estado.composicao==='lactacionalSem') compFrase='A composição mamária apresenta ecotextura de fundo heterogênea, hiperecogenicidade difusa e predomínio acentuado de tecido fibroglandular denso.';
  analiseHtml += `<div class="doc-p">${compFrase}</div>`;

  // Implantes
  if(im.sit==='presentes'){
    const achados = [];
    if(im.intDir) achados.push({tipo:'intra',lat:'à direita'});
    if(im.intEsq) achados.push({tipo:'intra',lat:'à esquerda'});
    if(im.extDir) achados.push({tipo:'extra',lat:'à direita'});
    if(im.extEsq) achados.push({tipo:'extra',lat:'à esquerda'});
    if(im.hetDir) achados.push({tipo:'het',lat:'à direita'});
    if(im.hetEsq) achados.push({tipo:'het',lat:'à esquerda'});
    if(achados.length===0){
      const plural = im.lat==='bilateralmente';
      analiseHtml += `<div class="doc-p">Implante${plural?'s':''} mamári${plural?'os':'o'} de silicone, normoposicionad${plural?'os':'o'}, em localização ${im.loc} ${im.lat}, com conteúdo sintético homogêneo, cápsula fibrosa fina, sem coleções adjacentes${plural?', com simetria de eixos ântero-posteriores':''}.`;
      opiniao.push(plural?'Implantes mamários íntegros bilateralmente.':`Implante mamário íntegro ${im.lat}.`);
      analiseHtml += `</div>`;
    } else {
      achados.forEach(a=>{
        const plural = im.lat==='bilateralmente';
        let frase = `Presença de implante${plural?'s':''} de silicone, normoposicionad${plural?'os':'o'}, em localização ${im.loc} ${im.lat}, observando-se `;
        if(a.tipo==='intra'){ frase+=`perda da integridade do elastômero ${a.lat} associada a conteúdo espesso e ecogênico intracapsular nessa topografia.`; opiniao.push(`Sinais ecográficos sugestivos de rotura intracapsular ${a.lat}.`); }
        if(a.tipo==='extra'){ frase+=`perda da integridade do elastômero ${a.lat} associada a conteúdo espesso e ecogênico extracapsular nessa topografia.`; opiniao.push(`Sinais ecográficos sugestivos de rotura extracapsular ${a.lat}.`); }
        if(a.tipo==='het'){ frase+=`conteúdo heterogêneo no implante ${a.lat} que costuma relacionar-se a alteração de composição química.`; opiniao.push(`Conteúdo heterogêneo em implante ${a.lat}.`); }
        analiseHtml += `<div class="doc-p">${frase}</div>`;
      });
    }
  }

  // Cistos
  let cistoFrases = [];
  estado.cistos.forEach((c,i)=>{
    if(!c.m1) return;
    let med = c.m1||'_';
    if(c.m2) med += ` x ${c.m2}`;
    const con = {anecoico:'anecoico',espesso:'de conteúdo espesso',espessonivel:'de conteúdo espesso formando nível líquido-debris',espessodebris:'de conteúdo espesso com ecos em suspensão'}[c.con]||c.con;
    const sep = c.sep!=='ausentes'?`, com septações ${c.sep}`:'';
    const par = c.par==='espessas'?', de paredes espessas':'';
    cistoFrases.push(`Cisto ${con}, localizado em ${LOCS_TXT[c.loc]||c.loc} da mama ${c.mam}, medindo cerca de ${med} cm${par}${sep}.`);
    if(c.par==='espessas'||c.sep==='espessas') opiniao.push(`Cisto com paredes/septações espessas em mama ${c.mam}.`);
    else opiniao.push(`Cisto benigno em mama ${c.mam}.`);
  });
  if(estado.cistosMultBil) { cistoFrases.push('Presença de múltiplos cistos bilaterais.'); opiniao.push('Cistos bilaterais.'); }
  if(estado.cistosMultDir) { cistoFrases.push('Presença de múltiplos cistos em mama direita.'); opiniao.push('Cistos em mama direita.'); }
  if(estado.cistosMultEsq) { cistoFrases.push('Presença de múltiplos cistos em mama esquerda.'); opiniao.push('Cistos em mama esquerda.'); }
  if(cistoFrases.length>0){
    cistoFrases.forEach(f=> analiseHtml+=`<div class="doc-p">${f}</div>`);
  } else {
    analiseHtml += `<div class="doc-p">Não há evidências de imagens císticas.</div>`;
  }

  // Nódulos
  let nodFrases = [];
  estado.nodulos.forEach((n,i)=>{
    if(!n.m1) return;
    let med = n.m1;
    if(n.m2) med += ` x ${n.m2}`;
    if(n.m3) med += ` x ${n.m3}`;
    const com = n.com==='complexo'?'complexo sólido-cístico':n.com;
    const efe = n.efe==='nenhum'?'sem fenômeno acústico posterior':`com ${({reforco:'reforço acústico posterior',sombra:'sombra acústica posterior',combinado:'efeito acústico posterior combinado'})[n.efe]}`;
    let distPP='';
    if(n.pap&&n.pel) distPP=`, distando cerca de ${n.pap} cm da papila e ${n.pel} cm da pele`;
    else if(n.pap) distPP=`, distando cerca de ${n.pap} cm da papila`;
    else if(n.pel) distPP=`, distando cerca de ${n.pel} cm da pele`;
    nodFrases.push(`- N${i+1}: nódulo ${com}, ${n.eco}, ${n.for}, de margens ${n.mar}, ${n.ori} à pele, ${efe}, localizado em ${LOCS_TXT[n.loc]||n.loc} da mama ${n.mam}, medindo cerca de ${med} cm${distPP};`);
    if(n.com==='solido'&&n.for==='oval'&&n.eco==='hipoecoico'&&n.mar==='circunscritas'&&n.ori==='paralelo') opiniao.push(`Nódulo com características tipicamente benignas em mama ${n.mam}.`);
    else opiniao.push(`Nódulo suspeito em mama ${n.mam}.`);
  });
  if(nodFrases.length>0){
    analiseHtml += `<div class="doc-p">Presença de nódulos assim descritos:<br>${nodFrases.join('<br>')}</div>`;
  } else {
    analiseHtml += `<div class="doc-p">Não há evidências de imagens nodulares.</div>`;
  }

  // Linfonodo IM
  if(ln.sit!=='ausentes'){
    const loc = ln.sit==='direita'?ln.locDir:ln.locEsq;
    analiseHtml += `<div class="doc-p">Presença de linfonodo intramamário localizado em ${LOCS_TXT[loc]||loc} da mama ${ln.sit}.</div>`;
    opiniao.push(`Linfonodo intramamário em mama ${ln.sit}.`);
  }

  // Regiões retroareolares
  analiseHtml += `<div class="doc-p">Regiões retroareolares sem alterações.</div>`;

  // Ectasias
  if(ec.sit!=='ausentes'){
    if(ec.sit==='presentes'){
      const cal = ec.preCal?` de calibre de até ${ec.preCal} mm`:'';
      analiseHtml += `<div class="doc-p">Presença de ectasias ductais de conteúdo ${ec.preCon} em ${LOCS_TXT[ec.preLoc]||ec.preLoc} ${ec.preLat}${cal}, sem nódulo intraductal em seu interior.</div>`;
      opiniao.push('Ectasias ductais.');
    } else if(ec.sit==='nodulo'){
      let med='_';
      if(ec.nodMed1){ med=ec.nodMed1; if(ec.nodMed2)med+=` x ${ec.nodMed2}`; if(ec.nodMed3)med+=` x ${ec.nodMed3}`; }
      const cal = ec.nodCal?` de calibre de até ${ec.nodCal} mm`:'';
      let distPP='';
      if(ec.nodPap&&ec.nodPel) distPP=`, distando cerca de ${ec.nodPap} cm da papila e ${ec.nodPel} cm da pele`;
      else if(ec.nodPap) distPP=`, distando cerca de ${ec.nodPap} cm da papila`;
      analiseHtml += `<div class="doc-p">Presença de ectasias ductais em ${LOCS_TXT[ec.nodLoc]||ec.nodLoc} ${ec.nodLat}${cal}, contendo nódulo intraductal medindo cerca de ${med} cm, ${ec.nodDop==='com'?'com':'sem'} sinal Doppler, em seu interior${distPP}.</div>`;
      opiniao.push('Nódulo intraductal — correlacionar clinicamente.');
    }
  }

  // Distorção
  if(di.sit!=='ausente'){
    if(di.sit==='cicatricial'){
      analiseHtml += `<div class="doc-p">Presença de distorção arquitetural em ${LOCS_TXT[di.sitLoc]||di.sitLoc} ${di.sitLat}, de provável natureza cirúrgica.</div>`;
      opiniao.push(`Distorção arquitetural ${di.sitLat}, de provável natureza cirúrgica.`);
    } else {
      analiseHtml += `<div class="doc-p">Presença de distorção arquitetural em ${LOCS_TXT[di.forLoc]||di.forLoc} ${di.forLat}.</div>`;
      opiniao.push(`Distorção arquitetural ${di.forLat}.`);
    }
  }

  // Muscular
  if(mu.colOrg){
    let med='_';
    if(mu.orgMed1){ med=mu.orgMed1; if(mu.orgMed2)med+=` x ${mu.orgMed2}`; if(mu.orgMed3)med+=` x ${mu.orgMed3}`; }
    const dis = mu.orgDis?`, distando ${mu.orgDis} cm da pele`:'';
    const sep = mu.orgSep?', contendo septos de permeio':'';
    analiseHtml += `<div class="doc-p">Coleção organizada, localizada no plano muscular, de paredes ${mu.orgPar} e conteúdo ${mu.orgCon}, medindo ${med} cm${dis}${sep}.</div>`;
    opiniao.push('Coleção organizada no plano muscular.');
  }
  if(mu.colNao){
    let med='_';
    if(mu.naoMed1){ med=mu.naoMed1; if(mu.naoMed2)med+=` x ${mu.naoMed2}`; if(mu.naoMed3)med+=` x ${mu.naoMed3}`; }
    const dis = mu.naoDis?`, distando ${mu.naoDis} cm da pele`:'';
    analiseHtml += `<div class="doc-p">Coleção não organizada, localizada no plano muscular, medindo ${med} cm${dis}.</div>`;
    opiniao.push('Coleção não organizada no plano muscular.');
  }
  if(!mu.colOrg&&!mu.colNao&&mu.habitual){
    analiseHtml += `<div class="doc-p">Planos musculares de aspecto preservado.</div>`;
  }

  // ── OPINIÃO ──
  let opFinal;
  if(opiniao.length===0) opFinal='Estudo ecográfico sem evidentes anormalidades apreciáveis ao método.\nClassificação ACR BIRADS ®: '+laudoBirads;
  else opFinal=opiniao.join('\n')+'\nDemais estruturas sem evidentes anormalidades apreciáveis ao método.\nClassificação ACR BIRADS ®: '+laudoBirads;

  // ── RECOMENDAÇÕES ──
  const recMap = {'0':'Recomendação para aquisição de imagens adicionais.','1':'Rastreamento de rotina.','2':'Seguimento de rotina ou a critério clínico.','3':'Seguimento de curto prazo (controle em 6, 12, 24 e 36 meses).','4':'Diagnóstico tecidual.','4a':'Diagnóstico tecidual.','4b':'Diagnóstico tecidual.','4c':'Diagnóstico tecidual.','5':'Diagnóstico tecidual.','6':'Seguimento de curto prazo (controle em 6, 12, 24 e 36 meses).'};
  const rec = recMap[String(laudoBirads)]||'Rastreamento de rotina.';

  document.getElementById('laudo-doc').innerHTML=`
    <div class="doc-titulo">ULTRASSONOGRAFIA DE MAMAS</div>
    <div class="doc-secao">
      <span class="doc-label">TÉCNICA:</span>
      ${tecHtml}
    </div>
    <div class="doc-secao">
      <span class="doc-label">ANÁLISE:</span>
      ${analiseHtml}
    </div>
    <div class="doc-secao">
      <span class="doc-label">OPINIÃO DO RELATÓRIO:</span>
      <div class="doc-p">${opFinal.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="doc-secao">
      <span class="doc-label">RECOMENDAÇÕES:</span>
      <div class="doc-p">${rec}</div>
    </div>
    <div class="doc-secao" style="margin-top:18px;font-size:8pt;color:#555;">
      <div class="doc-p" style="font-size:8pt;font-style:italic;">Referências:<br>
      1. Mendelson, Ellen B., et al. "ACR BI-RADS® Ultrasound." ACR BI-RADS® Atlas, Breast Imaging Reporting and Data System 2013 (2013).</div>
    </div>`;
}

function copiar() {
  const isDark = document.body.classList.contains('dark');
  if (isDark) document.body.classList.remove('dark');
  
  const el = document.getElementById('laudo-doc');
  const range = document.createRange();
  range.selectNodeContents(el);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  
  let success = false;
  try {
    success = document.execCommand('copy');
  } catch (err) {
  }
  
  selection.removeAllRanges();
  if (isDark) document.body.classList.add('dark');
  
  if (success) {
    showToast('Laudo copiado para a área de transferência!');
  } else {
    showToast('Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
  }
}

function showToast(msg) {
  let t = document.getElementById('toast-notification');

}
