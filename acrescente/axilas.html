<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THI-RADS | US Axilas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0e6a83;--blue-dark:#0c566b;--surface:#e1e6ee;--border:#c9d1de;--bs:#9eacc2;--text:#1b2538;--text2:#34425b;--text3:#5c6a83;--white:#f3f5f9;--red:#c93a3a;--hover:#dfeaf0;--sel:#cbe3ec;--ring:rgba(14,106,131,.22);--onblue:#fff;--dbg:#f6e6e8;--info:#e8f1f5;--paper:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--blue:#2fa9c2;--blue-dark:#2490a8;--surface:#090e19;--border:#1a263b;--bs:#33445f;--text:#c9d2e0;--text2:#a3afc4;--text3:#7a879f;--white:#0e1626;--red:#e07a7a;--hover:#13203a;--sel:#12324a;--ring:rgba(47,169,194,.28);--onblue:#06202b;--dbg:#2d1a1f;--info:#12293d;--paper:#0e1626}}
:root[data-theme="dark"]{--blue:#2fa9c2;--blue-dark:#2490a8;--surface:#090e19;--border:#1a263b;--bs:#33445f;--text:#c9d2e0;--text2:#a3afc4;--text3:#7a879f;--white:#0e1626;--red:#e07a7a;--hover:#13203a;--sel:#12324a;--ring:rgba(47,169,194,.28);--onblue:#06202b;--dbg:#2d1a1f;--info:#12293d;--paper:#0e1626}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;background:var(--surface);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 22px;display:flex;align-items:center;gap:10px;min-height:58px;flex-shrink:0;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;margin-right:14px}.logo-name{font-size:20px;font-weight:600;color:var(--blue);letter-spacing:-.3px}.logo-sub{font-size:13px;color:var(--text3)}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font:500 14px 'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--bs);background:var(--white);color:var(--text);transition:all .13s}
.btn:hover{background:var(--hover);border-color:var(--blue);color:var(--blue)}
.btn-primary{background:var(--blue);color:var(--onblue);border-color:var(--blue);font-weight:600}.btn-primary:hover{background:var(--blue-dark);color:var(--onblue)}
.btn-danger{background:var(--dbg);color:var(--red);border-color:var(--red)}.btn-danger:hover{color:var(--red)}
.btn svg{width:16px;height:16px}.btn-dark{margin-left:auto}
.btn:focus-visible,.nav-item:focus-visible,.radio-opt:focus-visible,.check-row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.body{display:flex;flex:1;overflow:hidden;min-height:0}
.sidebar{width:208px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0}
.sidebar-hd{padding:16px;border-bottom:1px solid var(--border)}.sidebar-tipo{font-size:12px;font-weight:600;color:var(--text3);margin-bottom:3px}.sidebar-titulo{font-size:19px;font-weight:600}
.nav-group{padding:8px 0}.nav-group-hd{padding:8px 16px 3px;font-size:12px;font-weight:600;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:15px;color:var(--text2);cursor:pointer;border-left:3px solid transparent;line-height:1.25}
.nav-item:hover{background:var(--hover);color:var(--text)}.nav-item.active{background:var(--sel);color:var(--blue);border-left-color:var(--blue);font-weight:600}
.nav-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0}.nav-item.active .nav-dot{opacity:1}.nav-item.alt .nav-dot{background:var(--red);opacity:1}
.panel{width:560px;flex-shrink:0;overflow-y:auto;padding:18px 18px 26px;background:var(--surface)}
.sec-title{font-size:19px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:9px}.sec-title::before{content:'';width:4px;height:22px;background:var(--blue);border-radius:2px}
.block{margin-bottom:14px;background:var(--white);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.block-title{font-size:14px;font-weight:600;color:var(--text2);padding:11px 16px 10px;border-bottom:1px solid var(--border)}
.radio-opt,.check-row{display:flex;border-bottom:1px solid var(--border);cursor:pointer}.radio-opt:last-child,.check-row:last-child{border-bottom:0}
.radio-opt:hover,.check-row:hover{background:var(--hover)}.radio-opt.selected,.check-row.selected{background:var(--sel)}
.radio-label,.check-label{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;font-size:15px;line-height:1.4;cursor:pointer}
.radio-opt.selected .radio-label,.check-row.selected .check-label{color:var(--blue);font-weight:600}
.radio-mark,.check-box{width:20px;height:20px;border:2px solid var(--bs);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--white);color:transparent}
.radio-mark{border-radius:50%}.check-box{border-radius:5px}.check-box svg{width:12px;height:12px}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 4px var(--blue),inset 0 0 0 10px var(--onblue)}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);color:var(--onblue)}
.ff-grid{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px}.ff{display:flex;flex-direction:column;gap:4px}
.ff label{font-size:13px;color:var(--text2);font-weight:600}
.sel,.num,.txt{font:14px 'DM Sans',sans-serif;padding:8px 10px;border:1px solid var(--bs);border-radius:8px;background:var(--white);color:var(--text)}
.num{width:84px;text-align:center}.txt{width:100%;resize:vertical;min-height:90px}
.sel:focus,.num:focus,.txt:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.info{padding:10px 16px;font-size:13px;line-height:1.6;color:var(--text2);background:var(--info);border-top:1px solid var(--border)}.info:first-child{border-top:0}
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.laudo-header{padding:10px 20px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text3)}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px}
.laudo-doc{font:10pt/1.65 Helvetica,Arial,sans-serif;max-width:720px;color:var(--text)}.laudo-doc:focus{outline:none}
.doc-titulo{text-align:center;font-weight:700;margin-bottom:16px}.doc-label{font-weight:700}.doc-p{margin-bottom:8px}.doc-secao{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--white);font-size:13px;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){html,body{height:auto}body{overflow:auto}.body{flex-direction:column;overflow:visible}.sidebar{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--border)}.sidebar-hd,.nav-group-hd{display:none}.nav-group{display:flex;padding:4px}.nav-item{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}.nav-item.active{border-bottom-color:var(--blue)}.panel{width:auto}.laudo-panel{border-left:0}.laudo-body{padding:18px}.toolbar{padding:8px 14px}}
.ff-grid .btn{padding:7px 12px;font-size:13px}.block-title .btn{padding:5px 12px;font-size:12px}
</style>
</head>
<body>
<div class="toolbar">
  <div class="logo"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <div class="tb-sep"></div>
  <button class="btn" onclick="copiar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copiar laudo</button>
  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>
  <button class="btn btn-dark" onclick="tema()">Alternar tema</button>
  <button class="btn btn-danger" onclick="reiniciar()">Reiniciar</button>
</div>
<div class="body">
  <div class="sidebar"><div class="sidebar-hd"><div class="sidebar-tipo">Ultrassonografia</div><div class="sidebar-titulo">Axilas</div></div><div id="nav"></div></div>
  <div class="panel" id="panel"></div>
  <div class="laudo-panel"><div class="laudo-header">Pré-visualização do laudo</div><div class="laudo-body"><div class="laudo-doc" id="doc" contenteditable="true"></div></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const LADOS={direita:'DIREITA',esquerda:'ESQUERDA',bilateral:'BILATERAL'};
const LAB={direita:'axila direita',esquerda:'axila esquerda'};
const LIM=[['ede','edema','por acentuado edema'],['bio','biotipo (obesidade)','pela intensa atenuação do feixe acústico inerente ao biotipo'],['dor','dor à compressão pelo transdutor','por dor à compressão pelo transdutor'],['pos','limitação do posicionamento do membro superior','pela limitação do posicionamento do membro superior'],['cic','alterações cutâneas / cicatriz pós-operatória','por alterações cutâneas / cicatriz pós-operatória'],['cur','curativo ou ferida no local','pela presença de curativo ou ferida no local'],['lnf','linfedema do membro superior','por linfedema do membro superior']];
const IND=['rastreamento oncológico mamário (complemento à mamografia/ressonância)','avaliação de linfonodos axilares aumentados','avaliação pós-mastectomia','seguimento de câncer de mama conhecido','investigação de suspeita de recidiva tumoral','avaliação pré-estadiamento','guia para procedimento (PAAF / core biopsy)','investigação de linfedema de membro superior','avaliação de massa axilar palpável'];
const MET=['ultrassonografia','mamografia','ressonância magnética','tomografia computadorizada'];
const COMP=['estável, sem alterações significativas','aumento do achado prévio','redução do achado prévio','surgimento de novo achado','resolução do achado prévio','achado prévio não identificado no exame atual'];
const COMP_D=['','com aumento dimensional do achado previamente descrito','com redução dimensional do achado previamente descrito','com identificação de novo achado no exame atual','com resolução do achado previamente descrito','não se identificando, no exame atual, correspondência com o achado previamente descrito'];
const COMP_C=['Achado estável em relação ao exame prévio.','Aumento dimensional do achado em relação ao exame prévio.','Redução dimensional do achado em relação ao exame prévio.','Surgimento de novo achado em relação ao exame prévio.','Resolução do achado previamente descrito.','Não caracterizado, no exame atual, o achado previamente descrito.'];
const REC=[['clin','correlação clínica','Correlação clínica.'],['rm','ressonância magnética','Ressonância magnética para complementação.'],['tc','tomografia computadorizada','Tomografia computadorizada.'],['ac','acompanhamento ultrassonográfico seriado','Acompanhamento ultrassonográfico seriado.'],['bx','biópsia / punção de linfonodo axilar','Biópsia / punção de linfonodo axilar para avaliação anatomopatológica.']];
const SEC=[['lat','Lateralidade','Geral'],['tec','Técnica'],['ind','Indicação'],['pele','Pele e Subcutâneo','Achados'],['mus','Plano Muscular'],['lin','Linfonodos'],['ace','Mama Acessória'],['cmp','Exames Comparativos','Complementos'],['ach','Achados Adicionais'],['rec','Recomendações']];
const PL=['subcutâneo','subcutâneo profundo','subcutâneo e muscular','muscular'];
const EST={'subcutâneo':'Tecido celular subcutâneo','subcutâneo profundo':'Tecido celular subcutâneo profundo','subcutâneo e muscular':'Tecido celular subcutâneo e plano muscular','muscular':'Plano muscular'};
const DOP=[['não citar',''],['ausente',', sem vascularização ao Doppler'],['discreto',', com discreta vascularização ao Doppler'],['periférico',', com discreta vascularização periférica ao Doppler'],['central',', com discreta vascularização central ao Doppler'],['periférico e central',', com vascularização periférica e central ao Doppler'],['intenso',', com intensa vascularização ao Doppler']];
const DOPL=DOP.map(x=>x[0]);
const FORMA=['ovalada','irregular','lobulada','fusiforme'],MARG=['bem definidas','parcialmente definidas','mal definidas'],PAR=['finas','espessas'],CONT=['anecoico','hipoecoico/espesso','heterogêneo'],ECO=['hipoecoica','isoecoica','hiperecoica'];
const MUSC=['não citar','peitoral maior','peitoral menor','latíssimo do dorso','serrátil anterior','subescapular','redondo maior'];
const ASP={'semelhante à gordura':'isoecogênico à gordura subcutânea, com finas linhas ecogênicas internas','hiperecogênico, linhas proeminentes':'hiperecogênico, com linhas ecogênicas proeminentes','hiperecoico, homogêneo':'hiperecoico, homogêneo','heterogêneo, septações internas':'heterogêneo, com septações internas','heterogêneo, septações espessas':'heterogêneo, com septações espessas','hipoecoico, heterogêneo':'hipoecoico, heterogêneo'};
const M3=[['m1','medida 1','num','cm'],['m2','medida 2','num','cm'],['m3','medida 3','num','cm'],['dist','distância da pele','num','cm']];
const PLF=['pl','plano','sel',PL],DOPF=['dop','Doppler','sel',DOPL];

const nm=v=>parseFloat(String(v).replace(',','.'));
const f=v=>{const x=nm(v);return isNaN(x)?'_':x.toFixed(1).replace('.',',')};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const jn=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];
const esc=x=>String(x).replace(/</g,'&lt;');
const dc=l=>(DOP.find(x=>x[0]===l)||['',''])[1];
const med=s=>{const p=['m1','m2','m3'].filter(k=>s[k]!==''&&!isNaN(nm(s[k]))).map(k=>f(s[k]));return p.length?p.join(' x ')+' cm':'_ x _ cm'};
const vol=s=>{const p=['m1','m2','m3'].map(k=>nm(s[k]));return p.some(isNaN)?'_':(p[0]*p[1]*p[2]*0.52).toFixed(1).replace('.',',')};
const dist=s=>s.dist!==''&&!isNaN(nm(s.dist))?`, distando ${f(s.dist)} cm da pele`:'';
const mm=s=>s.mu&&s.mu!=='não citar'?` do músculo ${s.mu}`:'';
const no=s=>s.mu&&s.mu!=='não citar'?` no músculo ${s.mu}`:'';

const P={
 infsup:{l:'Edema / espessamento dos planos superficiais',fl:[['dop','Doppler','sel',['com hiperemia/vascularização ao Doppler','sem vascularização ao Doppler']],['cob','padrão em paralelepípedo','chk'],['lin','linfonodos adjacentes de aspecto reacional','chk']],
  d:s=>{let t=s.dop[0]==='c'?'Pele e tecido celular subcutâneo espessados, com aumento difuso da ecogenicidade, edema e densificação do subcutâneo e hiperemia ao estudo Doppler.':'Pele e tecido celular subcutâneo espessados, com edema difuso do subcutâneo, sem coleções ou sinais de processo inflamatório ativo ao estudo Doppler.';if(s.cob)t=t.replace(/\.$/,'')+', em padrão de paralelepípedo.';if(s.lin)t+=' Linfonodos adjacentes de aspecto reacional.';return t},
  c:(s,x)=>s.dop[0]==='c'?(x.abs?null:'Celulite.'):'Edema dos planos superficiais, sem sinais inflamatórios ativos.'},
 areainf:{l:'Área infiltrativa',fl:[PLF,['eco','ecotextura','sel',['heterogênea','predominantemente hipoecoica','mista']],['pp','planos profundos','sel',['não citar','contato com planos profundos','planos profundos preservados']],['dp','Doppler','sel',['não citar','com hiperemia ao Doppler','sem vascularização significativa ao Doppler']],['sc','sem coleção líquida organizada de permeio','chk']],
  d:s=>`${EST[s.pl]} com área mal delimitada de ecotextura ${s.eco}, de aspecto infiltrativo, sem formação nodular definida${s.dp[0]==='c'?', com hiperemia ao estudo Doppler':s.dp[0]==='s'?', sem vascularização significativa ao Doppler':''}${s.pp[0]==='c'?', em contato com planos profundos':s.pp[0]==='p'?', com planos profundos preservados':''}${s.sc?', sem coleção líquida organizada de permeio':''}.`,
  c:s=>`Área infiltrativa no plano ${s.pl}${s.sc?', sem coleção organizada':''}.`},
 lipoma:{l:'Lesão lipomatosa',fl:[['pre','tipo','sel',['lipoma típico','angiolipoma','fibrolipoma','lipoma mixoide','lipoma atípico']],['cont','contornos','sel',MARG],['asp','aspecto','sel',Object.keys(ASP)],DOPF,...M3,['ep','de eixo paralelo à pele','chk'],['cm','compressível à compressão dinâmica','chk'],['si','sem sinais de invasão dos planos profundos','chk']],
  d:s=>{const b=[s.ep&&'de eixo paralelo à pele',s.cm&&'compressível à compressão dinâmica',s.si&&'sem sinais de invasão dos planos profundos'].filter(Boolean);return `Tecido celular subcutâneo com lesão lipomatosa de contornos ${s.cont.replace('definidas','definidos')}, aspecto ${ASP[s.asp]}${dc(s.dop)}${b.length?', '+jn(b):''}, medindo ${med(s)}${dist(s)}.`},
  c:s=>({'lipoma típico':'Lesão com características ecográficas compatíveis com lipoma.','angiolipoma':'Lesão com características ecográficas compatíveis com angiolipoma.','fibrolipoma':'Lesão com características ecográficas compatíveis com fibrolipoma.','lipoma mixoide':'Lesão lipomatosa com componente mixoide ao estudo ecográfico.','lipoma atípico':'Lesão lipomatosa com características ecográficas atípicas.'})[s.pre]},
 nodulo:{l:'Nódulo',fl:[['pre','tipo','sel',['inespecífico','dermatofibroma','pilomatricoma','tumor de origem neural']],PLF,['eco','ecotextura','sel',ECO],['forma','forma','sel',FORMA],['marg','margens','sel',MARG],DOPF,...M3],
  d:s=>`${EST[s.pl]} com lesão nodular de forma ${s.forma}, margens ${s.marg}, ecotextura ${s.eco}${dc(s.dop)}, medindo ${med(s)}${dist(s)}.`,
  c:s=>({'inespecífico':'Nódulo sólido de características inespecíficas.','dermatofibroma':'Nódulo compatível com dermatofibroma.','pilomatricoma':'Nódulo compatível com pilomatricoma.','tumor de origem neural':'Nódulo em plano neural, compatível com tumor de origem neural.'})[s.pre]},
 cisto:{l:'Lesão cística',fl:[['pre','tipo','sel',['cisto epidermoide','cisto epidermoide inflamado','cisto epidermoide roto','cisto sinovial','lesão cística inespecífica']],PLF,['forma','forma','sel',FORMA],['marg','margens','sel',MARG],['cont','conteúdo','sel',CONT],['par','paredes','sel',PAR],DOPF,...M3],
  d:s=>`${EST[s.pl]} com lesão cística de forma ${s.forma}, margens ${s.marg}, conteúdo ${s.cont}, paredes ${s.par}${dc(s.dop)}, medindo ${med(s)}${dist(s)}.`,
  c:s=>({'cisto epidermoide':'Cisto epidermoide.','cisto epidermoide inflamado':'Cisto epidermoide inflamado.','cisto epidermoide roto':'Cisto epidermoide roto.','cisto sinovial':'Cisto sinovial.','lesão cística inespecífica':'Lesão cística de características inespecíficas.'})[s.pre]},
 org:{l:'Coleção organizada',fl:[['pre','tipo','sel',['coleção simples','hematoma','sero-hematoma agudo','sero-hematoma crônico','abscesso','coleção inespecífica']],PLF,['par','paredes','sel',PAR],['cont','conteúdo','sel',CONT],...M3],
  d:s=>`${EST[s.pl]} com coleção organizada de paredes ${s.par} e conteúdo ${s.cont}, medindo ${med(s)} (volume de ${vol(s)} cm³)${dist(s)}.`,
  c:(s,x)=>s.pre==='abscesso'?(x.cel?`Celulite com abscesso no plano ${s.pl}.`:`Abscesso no plano ${s.pl}.`):({'coleção simples':'Coleção simples','hematoma':'Hematoma','sero-hematoma agudo':'Sero-hematoma agudo','sero-hematoma crônico':'Sero-hematoma crônico','coleção inespecífica':'Coleção de características inespecíficas'})[s.pre]+` no plano ${s.pl}.`},
 morel:{l:'Lesão de Morel-Lavallée',fl:[['fase','fase','sel',['não especificada','aguda','crônica (encapsulada)']],...M3],
  d:s=>`Tecido celular subcutâneo profundo com coleção líquida alongada entre a gordura subcutânea e a fáscia muscular, de aspecto laminar ao longo do plano fascial, sem vascularização interna ao Doppler, medindo ${med(s)} (volume de ${vol(s)} cm³)${dist(s)}.`,
  c:s=>s.fase[0]==='a'?'Lesão de Morel-Lavallée, em fase aguda, no contexto de antecedente traumático.':s.fase[0]==='c'?'Lesão de Morel-Lavallée, em fase crônica (encapsulada), no contexto de antecedente traumático.':'Lesão de Morel-Lavallée, no contexto de antecedente traumático.'},
 nao:{l:'Coleção não organizada',fl:[['pre','tipo','sel',['abscesso','coleção inespecífica']],PLF,DOPF,...M3],
  d:s=>`${EST[s.pl]} com coleção não organizada de contornos imprecisos e conteúdo heterogêneo, medindo ${med(s)} (volume de ${vol(s)} cm³)${dist(s)}${dc(s.dop)}.`,
  c:(s,x)=>s.pre==='abscesso'?(x.cel?`Celulite com abscesso no plano ${s.pl}.`:`Abscesso no plano ${s.pl}.`):`Coleção de características inespecíficas no plano ${s.pl}.`},
 vasc:{l:'Lesão vascular',fl:[['pre','tipo','sel',['fístula arteriovenosa','malformação arteriovenosa','pseudoaneurisma']],PLF,...M3],

  c=pl?`Linfonodomegalias axilares atípicas ${s.lat}, suspeitas para acometimento neoplásico.`:`Linfonodomegalia axilar atípica ${s.lat}, suspeita para acometimento neoplásico.`}
 return{t,c}}

function autoRec(){const sug={};E.lin.l.forEach(s=>{if(s.pad==='atípico')sug.bx=1});REC.forEach(r=>{if(!E.rec.t[r[0]])E.rec.c[r[0]]=!!sug[r[0]]})}
function build(){autoRec();const e=E,P_=t=>`<div class="doc-p">${t}</div>`,Sx=(l,b)=>`<div class="doc-secao"><span class="doc-label">${l}</span>${b}</div>`,bi=e.lat==='bilateral';
 let h=`<div class="doc-titulo">ULTRASSONOGRAFIA AXILAR ${LADOS[e.lat]}</div>`;
 const li=LIM.filter(x=>e.lim[x[0]]).map(x=>x[2]);let t=e.sonda==='nc'?'Exame realizado em aparelho dinâmico':'Exame realizado em aparelho dinâmico com '+(e.sonda==='linear'?'transdutor linear de alta frequência':'transdutor convexo');if(li.length)t+=', limitado parcialmente '+jn(li);
 if(e.sonda!=='nc'||li.length)h+=Sx('TÉCNICA:',P_(t+'.'));
 const ind=IND.map((x,i)=>e.ind['i'+i]&&cap(x)+'.').filter(Boolean);if(e.ind.out&&e.indOut.trim())ind.push(cap(e.indOut.trim().replace(/[.!?]$/,''))+'.');if(ind.length)h+=Sx('INDICAÇÃO:',P_(ind.join(' ')));
 const cc=[],pre=s=>bi?`${cap(LAB[s.lado]||'ambas as axilas')}: `:'',suf=(s,c)=>bi&&c?c.replace(/\.$/,'')+` (${s.lado==='bilateral'?'bilateral':LAB[s.lado]}).`:c;
 let an='';
 const run=(c,hab,aus)=>{const l=E[c].l,D=CAT[c],x={abs:false,cel:false};
  if(c==='pele'){x.abs=l.some(s=>(s.t==='org'||s.t==='nao')&&s.pre==='abscesso');x.cel=l.some(s=>s.t==='infsup'&&s.dop[0]==='c')&&x.abs}
  if(!l.length){hab.forEach(a=>{if(a[0])an+=P_(a[1])});return}
  l.forEach(s=>{an+=P_(pre(s)+D[s.t].d(s));const cx=D[s.t].c(s,{abs:x.cel,cel:x.cel});if(cx){const z=suf(s,cx);if(!cc.includes(z))cc.push(z)}})};
 run('pele',[[e.pele.hab,'Pele e tecido celular subcutâneo com espessura e ecogenicidade preservadas.'],[e.pele.aus,'Não se identificam formações nodulares, massas ou coleções líquidas.']]);
 run('mus',[[e.mus.hab,'Ventres musculares tróficos com arquitetura fibrilar preservada.']]);
 if(e.mus.nv)an+=P_('Feixes neurais e vasculares com trajeto habitual, sem compressões extrínsecas.');
 an+=P_('Vasos axilares pérvios, com calibre e fluxo habituais.');
 if(!e.lin.l.length)an+=P_('Linfonodos axilares fusiformes sem espessamento cortical ou apagamento hilar.');else e.lin.l.forEach(s=>{const r=linTxt(s);an+=P_(r.t);if(r.c){cc.push(r.c)}});
 const a=e.ace,rg=a.sit==='presente'?(a.lat==='à direita'?'Região axilar direita':a.lat==='à esquerda'?'Região axilar esquerda':'Regiões axilares'):(e.lat==='direita'?'Região axilar direita':e.lat==='esquerda'?'Região axilar esquerda':'Regiões axilares');
 an+=P_(a.sit==='presente'?`${rg} com tecido de aspecto glandular, apresentando ecotextura semelhante ao parênquima mamário, compatível com mama acessória, sem nódulos ou outras alterações focais identificáveis ao exame ultrassonográfico.`:`${rg} sem parênquima glandular mamário extranumerário.`);
 if(a.sit==='presente')cc.push(`Tecido mamário ectópico ${a.lat}.`);
 h+=Sx('ANÁLISE:',an);
 const c=e.cmp;let ct='';
 if(c.nd)ct='Exames anteriores não disponíveis para comparação, o que limita a caracterização de estabilidade dos achados.';
 else if(c.on){const i=COMP.indexOf(c.comp),cd=i===0?(c.ach?'mantendo-se a estabilidade dimensional e morfológica dos achados descritos':'sem alterações em relação ao exame anterior'):COMP_D[i];ct=`Comparação com ${c.mod} prévia${c.data?' de '+c.data:''}, ${c.ach?(c.desc.trim()?'que evidenciava '+c.desc.trim().replace(/[.]$/,''):'que evidenciava achado previamente descrito')+', ':''}${cd}.`;if(c.conc)cc.push(i===0&&!c.ach?'Sem alterações em relação ao exame prévio.':COMP_C[i])}
 if(ct)h+=Sx('EXAMES COMPARATIVOS:',P_(ct));
 h+=Sx('OPINIÃO DO RELATÓRIO:',P_(cc.length?cc.join('<br>'):'Estudo ecográfico sem evidentes anormalidades apreciáveis ao método.'));
 if(e.ach.trim())h+=Sx('ACHADOS ADICIONAIS:',P_(esc(e.ach.trim()).replace(/\n/g,'<br>')));
 if(e.rec.inc){const it=REC.filter(r=>e.rec.c[r[0]]).map(r=>r[2]);if(e.rec.custom.trim())it.push(esc(e.rec.custom.trim()));if(it.length)h+=Sx('RECOMENDAÇÕES:',P_(it.join('<br>')))}
 return h}
function laudo(){document.getElementById('doc').innerHTML=build()}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
async function copiar(){const el=document.getElementById('doc');try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([el.innerHTML],{type:'text/html'}),'text/plain':new Blob([el.innerText],{type:'text/plain'})})]);toast('Laudo copiado para a área de transferência')}catch(x){try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();toast('Laudo copiado para a área de transferência')}catch(y){toast('Não foi possível copiar. Selecione o texto e use Ctrl+C.')}}}
function imprimir(){const w=window.open('','_blank');if(!w){toast('Libere pop-ups para imprimir.');return}w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Laudo</title><style>body{font:10pt/1.65 Helvetica,Arial,sans-serif;padding:32px;color:#111;max-width:820px;margin:auto}.doc-titulo{text-align:center;font-weight:700;margin-bottom:16px}.doc-label{font-weight:700;display:block;margin-bottom:2px}.doc-p{margin-bottom:8px}.doc-secao{margin-bottom:14px}</style></head><body>${document.getElementById('doc').innerHTML}</body></html>`);w.document.close();w.print()}
function tema(){const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';try{localStorage.setItem('thirads-axilas-tema',r.dataset.theme)}catch(x){}}
function reiniciar(){init();show('lat')}
try{const t=localStorage.getItem('thirads-axilas-tema');if(t)document.documentElement.dataset.theme=t}catch(x){}
init();nav();show('lat');
</script>
