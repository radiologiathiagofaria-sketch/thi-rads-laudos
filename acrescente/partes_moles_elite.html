<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Partes Moles — Laudos Estruturados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a56db;--blue-dark:#1140a6;--blue-light:#e8f0fe;--blue-mid:#dbeafe;
  --surface:#f4f6fb;--border:#e2e6ef;--border-strong:#c8cfe0;
  --text:#1a1f2e;--text-2:#4b5570;--text-3:#8892a4;
  --white:#ffffff;--green:#059669;--red:#dc2626;--radius:8px;--radius-lg:12px;
}
body.dark{
  --blue:#4d86f5;--blue-dark:#3a6fd4;--blue-light:#1e2d4a;--blue-mid:#1e2d4a;
  --surface:#141820;--border:#2a2f3d;--border-strong:#3a4155;
  --text:#e2e6f0;--text-2:#9aa3b8;--text-3:#5d6680;
  --white:#1e2230;--green:#34d399;--red:#f87171;
}
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:#1e2230;border-left-color:var(--border);}
body.dark .laudo-body{background:#1e2230;}
body.dark .laudo-header{background:#1e2230;border-bottom-color:var(--border);}
@media print{
  body.dark .laudo-doc,
  body.dark .laudo-doc *{color:#111 !important;}
}
.btn-dark{margin-left:auto;}
body.dark .btn-dark{background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover{background:#343a4d;color:#fff;}
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text],body.dark .ff input[type=number]{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .radio-mark{background:var(--white);}
body.dark .check-box{background:var(--white);}
body.dark .sub-opts{background:#1a2040;border-bottom-color:#2a3460;}
body.dark .sub-opt-label{background:var(--white);color:var(--text-2);}
body.dark .toolbar{background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar{background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd{border-bottom-color:var(--border);}
body.dark .block{background:var(--white);border-color:var(--border);}
body.dark .block-title{background:var(--white);border-bottom-color:var(--border);}
body.dark .radio-opt:hover{background:#1e2d4a;}
body.dark .radio-opt.selected{background:#1e2d4a;}
body.dark .check-row{background:#1a1f2e;}
body.dark .check-row:hover{background:#1e2d4a;}
body.dark .check-row.selected{background:#1e2d4a;}
body.dark .sel-tag{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .sub-fields{background:#1a2040;border-top:1px solid #2a3460;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:10px;height:48px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:6px;margin-right:12px;}
.logo-name{font-size:17px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:.2px;}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);font-weight:500;transition:all .13s;background:var(--white);color:var(--text-2);}
.btn:hover{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.btn-danger{background:#fff5f5;color:var(--red);border-color:#fecaca;}
body.dark .btn-danger{background:#2d1a1a;border-color:#6b2929;}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:136px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.sidebar-titulo{font-size:11px;font-weight:600;color:var(--text);}
.nav-group{padding:6px 0;}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:11.5px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:2px solid transparent;}
.nav-item:hover{background:var(--blue-light);color:var(--blue);}
.nav-item.active{background:var(--blue-light);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}
.panel{width:480px;flex-shrink:0;overflow-y:auto;padding:14px 14px 20px;background:var(--surface);}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';display:block;width:3px;height:16px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:10px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;padding:8px 14px 7px;border-bottom:1px solid var(--border);background:var(--white);}
.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:#f5f8ff;}
.radio-opt.selected{background:var(--blue-light);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;font-size:12.5px;color:var(--text-2);line-height:1.4;cursor:pointer;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:500;}
.radio-mark{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
.radio-opt.selected .radio-mark::after{opacity:1;}
.check-row{display:flex;flex-direction:column;border-bottom:1px solid var(--border);cursor:pointer;background:#fafbff;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:#f0f5ff;}
.check-row.selected{background:#e6eeff;}
.check-label{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px 8px 14px;font-size:12px;color:var(--text-2);cursor:pointer;}
.check-row.selected .check-label{color:var(--blue);font-weight:500;}
.check-box{width:15px;height:15px;border-radius:4px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:9px;height:9px;}
.check-row.selected .check-box svg{display:block;}
.sub-fields{display:none;padding:8px 14px 10px 40px;background:#eef3ff;border-top:1px solid #d0dcff;gap:8px;flex-direction:column;}
.check-row.selected .sub-fields{display:flex;}
.sub-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sub-lbl{font-size:11px;color:var(--text-2);}
.sel-tag{font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:3px 6px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);cursor:pointer;}
.sel-tag:focus{outline:none;border-color:var(--blue);}
.dim-input{width:60px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.dim-input-sm{width:52px;}
.dim-unit{font-size:12px;color:var(--text-3);}
.vol-span{font-size:11px;color:var(--text-3);font-style:italic;}
.dim-rows{padding:8px 14px;display:flex;flex-direction:column;gap:6px;}
.dim-row{display:flex;align-items:center;gap:10px;}
.dim-lbl{flex:1;font-size:12px;color:var(--text-2);}
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
.textarea-field{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--white);resize:none;height:90px;line-height:1.5;}
.textarea-field:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
body.dark .textarea-field{background:var(--white);color:var(--text);border-color:var(--border-strong);}
.ta-wrap{padding:10px 14px;}
.laudo-doc:focus { outline: none; }
.toast-notification{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--white);font-size:12.5px;font-weight:500;padding:10px 18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:999;}
.toast-notification.show{opacity:1;transform:translateX(-50%) translateY(0);}
body.dark .toast-notification{background:#3a4155;color:#e2e6f0;}
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-thirads.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <button class="btn" onclick="window.location.href='../laudo-thirads.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd">
      <div class="sidebar-tipo">Ultrassonografia</div>
      <div class="sidebar-titulo">Partes Moles</div>
    </div>
    <div class="nav-group">
      <div class="nav-item" id="nav-area" onclick="showSection('area')"><span class="nav-dot"></span>Área Examinada</div>
      <div class="nav-item" id="nav-tipo" onclick="showSection('tipo')"><span class="nav-dot"></span>Tipo de Achado</div>
      <div class="nav-item" id="nav-pele" onclick="showSection('pele')"><span class="nav-dot"></span>Pele e Subcutâneo</div>
      <div class="nav-item" id="nav-muscular" onclick="showSection('muscular')"><span class="nav-dot"></span>Plano Muscular</div>
      <div class="nav-item" id="nav-achados" onclick="showSection('achados')"><span class="nav-dot"></span>Achados Adicionais</div>
    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

<script>
// ── ESTADO GLOBAL ──

  // ── TIPO DE ACHADO (seletor geral) ──
  tipo: {

// Cópia profunda do estado inicial, usada pelo botão "Reiniciar" para garantir
// que o estado inicial e o estado pós-reset sejam sempre idênticos.
const ESTADO_INICIAL = JSON.parse(JSON.stringify(estado));

const REGIOES = [
  ['queixa','região de queixa do paciente'],
  ['facial','região facial'],
  ['frontaldireita','região frontal direita'],
  ['frontalesquerda','região frontal esquerda'],
  ['temporal','região temporal'],
  ['temporaldireita','região temporal direita'],
  ['temporalesquerda','região temporal esquerda'],
  ['parotidea','região parotídea'],
  ['parotideadireita','região parotídea direita'],
  ['parotideaesquerda','região parotídea esquerda'],
  ['retroauriculardireita','região retroauricular direita'],
  ['retroauricularesquerda','região retroauricular esquerda'],
  ['cervical','região cervical'],
  ['cervicaldireita','região cervical direita'],
  ['cervicalesquerda','região cervical esquerda'],
  ['peitoral','região peitoral'],
  ['epigastro','epigastro'],
  ['mesogastro','mesogastro'],
  ['hipogastro','hipogastro'],
  ['flancodireito','flanco direito'],
  ['flancoesquerdo','flanco esquerdo'],
  ['hipocondriodireito','hipocôndrio direito'],
  ['hipocondrioesquerdo','hipocôndrio esquerdo'],
  ['inguinais','regiões inguinais'],
  ['inguinaldireita','região inguinal direita'],
  ['inguinalesquerda','região inguinal esquerda'],
  ['dorsal','região dorsal'],
  ['dorsaldireita','região dorsal direita'],
  ['dorsalesquerda','região dorsal esquerda'],
  ['lombar','região lombar'],
  ['lombardireita','região lombar direita'],
  ['lombaresquerda','região lombar esquerda'],
  ['bracodireito','braço direito'],
  ['bracoesquerdo','braço esquerdo'],
  ['antebracodireito','antebraço direito'],
  ['antebracoesquerdo','antebraço esquerdo'],
  ['coxadireita','coxa direita'],
  ['coxaesquerda','coxa esquerda'],
  ['pernadireita','perna direita'],
  ['pernaesquerda','perna esquerda'],
];

// ── SEÇÃO ATIVA ──
let secaoAtual = '';

function showSection(sec) {
  secaoAtual = sec;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + sec);
  if (nav) nav.classList.add('active');
  renderPanel();
}

function renderPanel() {
  const panel = document.getElementById('main-panel');
  switch(secaoAtual) {
    case 'area':     panel.innerHTML = renderAreaHtml(); break;
    case 'tipo':     panel.innerHTML = renderTipoHtml(); break;
    case 'pele':     panel.innerHTML = renderPeleHtml(); break;
    case 'muscular': panel.innerHTML = renderMuscularHtml(); break;
    case 'achados':  panel.innerHTML = renderAchadosHtml(); break;
  }
  bindEvents();

// ── HELPERS ──
function calcVol(m1, m2, m3) {
  const v = parseFloat(m1) * parseFloat(m2) * parseFloat(m3) * 0.52;
  if (isNaN(v)) return '0,0';
  return v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}

function tratarFloat(v) {
  if (!v || v === '') return null;
  const n = parseFloat(v.replace(',','.'));
  if (isNaN(n)) return null;
  return n.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1});
}

// ── HELPERS "SEGUROS" PARA O LAUDO FINAL ──
// Nunca geram medidas com placeholder "_" nem volume "0,0 cm³" quando os
// dados não estão completos. Usados exclusivamente na montagem do texto do
// laudo (a pré-visualização dos campos internos pode continuar mostrando
// "0,0" enquanto o usuário digita, sem impacto no laudo final).
function medStrSeguro(m1, m2, m3) {
  const vals = [m1, m2, m3].map(tratarFloat).filter(Boolean);
  if (vals.length === 0) return '';
  return vals.join(' x ') + ' cm';
}
function calcVolSeguro(m1, m2, m3) {
  if (!m1 || !m2 || !m3) return null;
  const v = parseFloat(String(m1).replace(',', '.')) * parseFloat(String(m2).replace(',', '.')) * parseFloat(String(m3).replace(',', '.')) * 0.52;
  if (isNaN(v) || v <= 0) return null;
  return v.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
}
function maxMed(...vals) {
  const nums = vals.map(v => parseFloat(String(v||'').replace(',','.'))).filter(n => !isNaN(n));
  return nums.length ? Math.max(...nums) : 0;
}

function toggleTipo(key) {
  if (key === 'normal') {
    const novo = !estado.tipo.normal;
    Object.keys(estado.tipo).forEach(k => { if (typeof estado.tipo[k] === 'boolean') estado.tipo[k] = false; });
    estado.tipo.normal = novo;
  } else {
    estado.tipo[key] = !estado.tipo[key];
    if (estado.tipo[key]) estado.tipo.normal = false;
  }
  renderPanel();
}

function lat(v) {
  return v === 'direita' ? ' à direita' : v === 'esquerda' ? ' à esquerda' : v === 'bilateral' ? ' bilateral' : '';
}

// Avalia sinais de alerta (red flags) de uma massa/nódulo, sem gerar
// automaticamente um diagnóstico definitivo — apenas orienta o grau de
// suspeição usado para escolher a linguagem da impressão diagnóstica.
function avaliarFlagsMassa(m) {
  const flags = [];
  const dmax = maxMed(m.med1, m.med2, m.med3);
  if (['intramuscular','intermuscular','fascial','justacortical'].includes(m.loc)) flags.push('localização profunda');
  if (dmax >= 5) flags.push('maior dimensão ≥ 5 cm');
  if (m.margens === 'infiltrativas') flags.push('margens infiltrativas');
  if (m.margens === 'indistintas') flags.push('margens indistintas');
  if (m.ecogenicidade === 'heterogenea' || m.arquitetura === 'heterogenea') flags.push('heterogeneidade importante');
  if (m.doppler === 'interna' || m.doppler === 'internaEPeriferica') flags.push('vascularização interna');
  if (m.cistico === 'necrose') flags.push('componente necrótico/liquefeito');
  if (m.relacao === 'invasao') flags.push('invasão de estruturas adjacentes');
  if (m.relacao === 'deslocamento') flags.push('ausência de plano de clivagem nítido com estruturas adjacentes');
  if (m.crescimento) flags.push('crescimento/alteração referida pelo paciente');
  if (estado.tipo.calcificacao && flags.length > 0) flags.push('calcificação associada');
  return flags;
}

function gerarBlocoMassa() {
  const m = estado.massa;
  const ms = medStrSeguro(m.med1, m.med2, m.med3);
  const vol = calcVolSeguro(m.med1, m.med2, m.med3);
  const med = ms ? `, medindo ${ms}${vol ? ` (volume estimado de ${vol} cm³)` : ''}` : '';
  const desc = `Identifica-se formação nodular/expansiva de partes moles em topografia ${TXT.locMassa[m.loc]}, de morfologia ${TXT.morfo[m.morfologia]}, orientação ${TXT.orient[m.orientacao]}, margens ${TXT.margens[m.margens]}, ecogenicidade ${TXT.ecog[m.ecogenicidade]} e arquitetura ${TXT.arq[m.arquitetura]}${TXT.cistico[m.cistico]}${med}, ${TXT.dopMassa[m.doppler]}, ${TXT.compr[m.compressibilidade]}, ${TXT.relacao[m.relacao]}${m.crescimento ? ', com crescimento/alteração referida pelo paciente' : ''}.`;

  const flags = avaliarFlagsMassa(m);
  let imp;
  if (m.lipomaTipico && flags.length === 0) {
    imp = 'Lesão nodular superficial com características ultrassonográficas sugestivas de lipoma.';
  } else if (m.lipomaTipico && flags.length > 0) {
    imp = 'Lesão nodular de partes moles com características indeterminadas.';
  } else if (m.margens === 'infiltrativas' || m.relacao === 'invasao' || flags.length >= 2) {
    imp = 'Massa de partes moles com características ultrassonográficas indeterminadas/suspeitas, recomendando-se complementação por ressonância magnética para melhor caracterização, conforme contexto clínico.';
  } else if (flags.length === 1) {
    imp = 'Massa/nódulo de partes moles com características descritas acima; sugere-se correlação clínica e, conforme evolução, complementação por ressonância magnética.';
  } else {
    imp = 'Massa/nódulo de partes moles com características descritas acima, de aspecto atualmente indeterminado, podendo-se considerar acompanhamento clínico-ultrassonográfico ou complementação diagnóstica conforme indicação médica.';
  }
  return {desc, imp};
}

function gerarBlocoColecao() {
  const c = estado.colecaoG;
  const ms = medStrSeguro(c.med1, c.med2, c.med3);
  const vol = calcVolSeguro(c.med1, c.med2, c.med3);
  const med = ms ? `, medindo ${ms}${vol ? `, com volume estimado de ${vol} cm³` : ''}` : '';
  const dis = c.dis ? `, distando cerca de ${tratarFloat(c.dis)} cm da pele` : '';
  const extras = [];
  if (c.septacoes) extras.push('septações internas');
  if (c.debris) extras.push('debris');
  if (c.ecosMoveis) extras.push('ecos internos móveis');
  if (c.coagulos) extras.push('coágulos de permeio');
  if (c.gas) extras.push('focos de gás');
  if (c.nivelLL) extras.push('nível líquido-líquido');
  const extraTxt = extras.length ? `, com ${extras.join(', ')}` : '';
  const desc = `Coleção líquida em topografia ${TXT.locCol[c.loc]}, de paredes ${c.espessura} e ${c.regularidade}, conteúdo ${TXT.conteudoCol[c.conteudo]}${extraTxt}${med}${dis}, ${TXT.dopCol[c.doppler]}, em contexto ${TXT.contextoCol[c.contexto]}.`;

  let imp;
  const criteriosInflamatorios = c.contexto === 'inflamatorioInfeccioso' && (c.regularidade === 'irregulares' || c.espessura === 'espessas') && (c.gas || c.debris || c.conteudo === 'heterogeneo' || c.conteudo === 'espesso' || c.doppler === 'hiperemiaPeriferica');
  if (criteriosInflamatorios) {
    imp = 'Achados sugestivos de coleção inflamatória/infecciosa (podendo corresponder a abscesso), conforme contexto clínico e laboratorial.';
  } else if (c.contexto === 'inflamatorioInfeccioso') {
    imp = 'Coleção com características podendo se relacionar a processo inflamatório/infeccioso, conforme contexto clínico.';
  } else {
    imp = `Coleção ${TXT.locCol[c.loc]}, com características descritas acima, ${TXT.dopCol[c.doppler]}.`;
  }
  return {desc, imp};
}

// Monta todos os blocos referentes à seção "Tipo de Achado".
function gerarAchadosTipo() {
  const t = estado.tipo;
  const descricoes = [];
  const impressoes = [];
  const add = (fn) => { const r = fn(); descricoes.push(r.desc); impressoes.push(r.imp); };

  if (t.massa) add(gerarBlocoMassa);
  if (t.colecao) add(gerarBlocoColecao);
  if (t.edema) add(gerarBlocoEdemaG);
  if (t.hematoma) add(gerarBlocoHematoma);
  if (t.lesaoMuscular) add(gerarBlocoLesaoMuscular);
  if (t.tendao) add(gerarBlocoTendao);
  if (t.linfonodo) add(gerarBlocoLinfonodo);
  if (t.corpoEstranho) add(gerarBlocoCorpoEstranho);
  if (t.hernia) add(gerarBlocoHernia);
  if (t.vascular) add(gerarBlocoVascular);
  if (t.calcificacao) add(gerarBlocoCalcificacao);
  if (t.nervo) add(gerarBlocoNervo);
  if (t.outros && t.outrosTexto) { descricoes.push(t.outrosTexto); impressoes.push(t.outrosTexto); }

  return {descricoes, impressoes};
}

// ── GERAR LAUDO ──
function updateLaudo() {
  const ar = estado.area;
  const pe = estado.pele;
  const mu = estado.muscular;
  const ac = estado.achados;
  const t = estado.tipo;

  const hd = [];

  // ── DETECÇÃO DE USO DE DOPPLER E AVALIAÇÃO DINÂMICA (para a técnica) ──
  // Nunca afirmamos Doppler/avaliação dinâmica no texto se nada foi de fato selecionado.
  const dopplerUsado = pe.nodDop
    || (t.massa && estado.massa.doppler !== 'sem')
    || (t.colecao && estado.colecaoG.doppler !== 'semFluxo')
    || (t.hematoma && estado.hematoma.doppler !== 'sem')
    || (t.edema && estado.edemaG.hiperemia)
    || (t.tendao && estado.tendao.hiperemia)
    || (t.linfonodo && estado.linfonodo.doppler !== 'ausente')
    || (t.corpoEstranho && estado.corpoEstranho.hiperemia)
    || (t.vascular && estado.vascular.fluxo !== 'ausente')
    || (t.nervo && estado.nervo.hiperemia);

  const dinamicaUsada = ar.dinamica || ar.valsalva || ar.contracao || ar.compressao
    || (t.tendao && estado.tendao.avaliacaoDinamica)
    || (t.nervo && estado.nervo.avaliacaoDinamica)
    || (t.hernia && (estado.hernia.valsalva || estado.hernia.alteracaoDinamica));

  // ── TÉCNICA ──
  let limitacoes = [];
  if (ar.limitacaoEdema) limitacoes.push('por acentuado edema');
  if (ar.limitacaoBiotipo) limitacoes.push('pela intensa atenuação do feixe acústico inerente ao biotipo');
  if (ar.limitacaoProfundidade) limitacoes.push('pela profundidade da lesão');
  if (ar.limitacaoDor) limitacoes.push('pela dor referida pelo paciente');

  let fraseTecnica = 'Exame realizado com transdutor linear de alta frequência, utilizando imagens em modo B'
    + (dopplerUsado ? ' e Doppler colorido' : '')
    + (dinamicaUsada ? ', com avaliação dinâmica da região de interesse quando indicada' : '')
    + '.';
  if (limitacoes.length > 0) {
    fraseTecnica += ' Exame parcialmente limitado ' + limitacoes.join(' e ') + '.';
  }

  // ── ÁREA ──
  let regiaoDesc = '';
  let usarDa = true;
  if (ar.tipo === 'queixa') {
    regiaoDesc = 'região de queixa do paciente';
  } else if (ar.tipo === 'pre' && ar.regiao) {
    const reg = REGIOES.find(r => r[0] === ar.regiao);
    regiaoDesc = reg ? reg[1] : 'região selecionada';
  } else if (ar.tipo === 'outra' && ar.outra) {
    regiaoDesc = ar.outra;
    usarDa = false;
  } else {
    regiaoDesc = 'região de queixa do paciente';
  }
  const jaTemLateralidade = /direit[ao]|esquerd[ao]|bilateral/i.test(regiaoDesc);
  const latTxt = (ar.lateralidade !== 'nenhuma' && !jaTemLateralidade) ? lat(ar.lateralidade) : '';
  let fraseArea = `Exame orientado para avaliação ${usarDa ? 'da ' : ''}${regiaoDesc}${latTxt}.`;
  if (ar.contralateral) {
    fraseArea += ' Realizada comparação com o lado contralateral.';
  }

  // ── PELE ──
  const temAchadoPele = pe.edema || pe.lipoma || pe.nodulo || pe.colOrg || pe.colNao;
  let paragrafosPele = [];

  if (!temAchadoPele) {
    if (pe.habitual) paragrafosPele.push('Pele e tecido subcutâneo sem anormalidades detectáveis.');
    if (pe.ausencia) paragrafosPele.push('Ausência de nódulos, massas ou coleções.');
  } else {
    const partes = [];
    if (pe.edema) {
      partes.push('Espessamento da pele e aumento difuso da ecogenicidade do tecido celular subcutâneo, sugestivo de edema.');
      hd.push('Edema de tecido subcutâneo.');
    }
    if (pe.lipoma) {
      const ms = medStrSeguro(pe.lipMed1,pe.lipMed2,pe.lipMed3);
      const med = ms ? `, medindo ${ms}` : '';
      const cont = pe.lipReg ? ', de contornos regulares' : '';
      partes.push(`No plano do subcutâneo, identifica-se imagem nodular hiperecogênica e homogênea${cont}${med}, de aspecto compatível com lipoma.`);
      hd.push('Lipoma de subcutâneo.');
    }
    if (pe.nodulo) {
      const ms = medStrSeguro(pe.nodMed1,pe.nodMed2,pe.nodMed3);
      const med = ms ? `, medindo ${ms}` : '';
      partes.push(`No plano ${pe.nodLoc}, nota-se nódulo ${pe.nodEco} e ${pe.nodTex}, de contornos ${pe.nodCon}${med}${pe.nodDop?', com fluxo ao Doppler':''}.`);
      hd.push(`Nódulo no plano ${pe.nodLoc}.`);
    }
    if (pe.colOrg) {
      const vol = calcVolSeguro(pe.colOrgMed1, pe.colOrgMed2, pe.colOrgMed3);
      const ms = medStrSeguro(pe.colOrgMed1,pe.colOrgMed2,pe.colOrgMed3);
      const sep = pe.colOrgSep ? ', contendo septos de permeio' : '';
      const med = ms ? `, medindo ${ms}${vol?`, com volume de ${vol} cm³`:''}` : '';
      const dis = pe.colOrgDis ? `, e seu centro distando ${tratarFloat(pe.colOrgDis)} cm da pele` : '';
      partes.push(`No plano ${pe.colOrgLoc}, nota-se coleção de paredes ${pe.colOrgPar} e conteúdo ${pe.colOrgCon}${sep}${med}${dis}.`);
      hd.push(`Coleção organizada no plano ${pe.colOrgLoc}.`);
    }
    if (pe.colNao) {
      const vol = calcVolSeguro(pe.colNaoMed1, pe.colNaoMed2, pe.colNaoMed3);
      const ms = medStrSeguro(pe.colNaoMed1,pe.colNaoMed2,pe.colNaoMed3);
      const med = ms ? `, medindo cerca de ${ms}${vol?`, com volume de ${vol} cm³`:''}` : '';
      const dis = pe.colNaoDis ? `, e seu centro distando ${tratarFloat(pe.colNaoDis)} cm da pele` : '';
      partes.push(`No plano ${pe.colNaoLoc}, nota-se área heterogênea, predominantemente hipoecogênica, de limites imprecisos${med}${dis}.`);
      hd.push(`Achados sugestivos de coleção em organização no plano ${pe.colNaoLoc}.`);
    }
    paragrafosPele = partes;
  }

  // ── MUSCULAR ──
  const temAchadoMus = mu.colOrg || mu.colNao;
  let paragrafosMusc = [];

  if (!temAchadoMus) {
    if (mu.habitual) paragrafosMusc.push('Planos musculares de aspecto preservado.');
  } else {
    const partes = [];
    if (mu.colOrg) {
      const vol = calcVolSeguro(mu.colOrgMed1, mu.colOrgMed2, mu.colOrgMed3);
      const sep = mu.colOrgSep ? ', contendo septos de permeio' : '';
      const ms = medStrSeguro(mu.colOrgMed1,mu.colOrgMed2,mu.colOrgMed3);
      const med = ms ? `, medindo ${ms}${vol?`, com volume de ${vol} cm³`:''}` : '';
      const dis = mu.colOrgDis ? `, e seu centro distando ${tratarFloat(mu.colOrgDis)} cm da pele` : '';
      partes.push(`No plano muscular, nota-se coleção de paredes ${mu.colOrgPar} e conteúdo ${mu.colOrgCon}${sep}${med}${dis}.`);
      hd.push('Coleção organizada no plano muscular.');
    }
    if (mu.colNao) {
      const vol = calcVolSeguro(mu.colNaoMed1, mu.colNaoMed2, mu.colNaoMed3);
      const ms = medStrSeguro(mu.colNaoMed1,mu.colNaoMed2,mu.colNaoMed3);
      const med = ms ? `, medindo cerca de ${ms}${vol?`, com volume de ${vol} cm³`:''}` : '';
      const dis = mu.colNaoDis ? `, e seu centro distando ${tratarFloat(mu.colNaoDis)} cm da pele` : '';
      partes.push(`No plano muscular, nota-se área heterogênea, predominantemente hipoecogênica, de limites imprecisos${med}${dis}.`);
      hd.push('Achados sugestivos de coleção em organização no plano muscular.');
    }
    paragrafosMusc = partes;
  }

  // ── TIPO DE ACHADO (módulos estruturados) ──
  const tipoResult = gerarAchadosTipo();
  const paragrafosTipo = tipoResult.descricoes;

  // ── OPINIÃO ──
  // A impressão diagnóstica é construída exclusivamente a partir dos achados
  // efetivamente selecionados — nunca se completa automaticamente com frases
  // genéricas de normalidade quando há achados positivos (regra de segurança).
  const todasImpressoes = hd.concat(tipoResult.impressoes);
  let paragrafosImpressao;
  if (todasImpressoes.length === 0) {
    paragrafosImpressao = ['Estudo ultrassonográfico da região avaliada sem alterações significativas.'];
  } else {
    paragrafosImpressao = todasImpressoes;
  }

  // ── ACHADOS ADICIONAIS ──
  const fraseAchados = ac.texto ? `Achados adicionais: ${ac.texto}` : '';

  // Cada alteração/achado vira seu próprio parágrafo (<div class="doc-p">),
  // em vez de todos ficarem concatenados num único parágrafo corrido.
  // Também garante que todo parágrafo comece com letra maiúscula, mesmo
  // quando o texto-fonte (dicionário ou digitação livre) começa em minúscula.
  function capitalizarFrase(str) {
    if (!str) return str;
    const i = str.search(/[a-zà-öø-ÿ]/i);
    if (i === -1) return str;
    return str.slice(0, i) + str.charAt(i).toUpperCase() + str.slice(i + 1);
  }
  function renderParagrafos(lista) {
    return lista.filter(Boolean).map(p => `<div class="doc-p">${capitalizarFrase(p)}</div>`).join('');
  }

  // ── HTML ──
  document.getElementById('laudo-doc').innerHTML = `
    <div class="doc-titulo">ULTRASSONOGRAFIA DE PARTES MOLES</div>
    <div class="doc-secao">
      <span class="doc-label">TÉCNICA:</span>
      <div class="doc-p">${fraseTecnica}</div>
    </div>
    <div class="doc-secao">
      <span class="doc-label">ANÁLISE:</span>
      <div class="doc-p">${capitalizarFrase(fraseArea)}</div>
      ${renderParagrafos(paragrafosPele)}
      ${renderParagrafos(paragrafosMusc)}
      ${renderParagrafos(paragrafosTipo)}
      ${fraseAchados ? `<div class="doc-p">${capitalizarFrase(fraseAchados)}</div>` : ''}
    </div>
    <div class="doc-secao">
      <span class="doc-label">IMPRESSÃO DIAGNÓSTICA:</span>
      ${renderParagrafos(paragrafosImpressao)}
    </div>`;
}

// ── COPIAR ──
function copiar() {
  var el = document.getElementById('laudo-doc');
  if (!el) return;
  _copyLaudoRichText(el, function(ok) {
    if (ok) {
      showToast('Laudo copiado para a área de transferência!');
    } else {
      showToast('Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
    }
  });
}

// --- INÃCIO: FUNÃ‡Ã•ES DE CÃ“PIA RICH-TEXT (PadrÃ£o ObstÃ©trico) ---
function _copyLaudoRichText(sourceEl, callback) {
  var clone = sourceEl.cloneNode(true);
  var RELEVANT_PROPS = [
    'font-family', 'font-size', 'font-weight', 'font-style',
    'line-height', 'text-align', 'text-indent', 'text-decoration',
    'vertical-align', 'white-space', 'display',
    'margin-top', 'margin-right', 'margin-bottom', 'margin-left',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'list-style', 'list-style-type',
    'border-collapse', 'border-spacing'
  ];
  var originalEls = sourceEl.querySelectorAll('*');
  var cloneEls    = clone.querySelectorAll('*');

  _inlineComputedStyles(sourceEl, clone, RELEVANT_PROPS, true);
  for (var i = 0; i < originalEls.length; i++) {
    _inlineComputedStyles(originalEls[i], cloneEls[i], RELEVANT_PROPS, false);
  }

  clone.style.backgroundColor = '#ffffff';
  clone.style.color = '#000000';
  clone.removeAttribute('id');
  clone.removeAttribute('contenteditable');

  var htmlContent = clone.outerHTML;
  var plainText = sourceEl.innerText || sourceEl.textContent || '';

  if (navigator.clipboard && typeof ClipboardItem !== 'undefined') {
    try {
      var htmlBlob = new Blob([htmlContent], { type: 'text/html' });
      var textBlob = new Blob([plainText],   { type: 'text/plain' });
      navigator.clipboard.write([
        new ClipboardItem({
          'text/html': htmlBlob,
          'text/plain': textBlob
        })
      ]).then(function() {
        callback(true);
      }).catch(function() {
        _fallbackCopy(htmlContent, plainText, callback);
      });
      return;
    } catch (e) {
    }
  }
  _fallbackCopy(htmlContent, plainText, callback);
}

function _inlineComputedStyles(originalEl, cloneEl, props, isRoot) {
  if (!originalEl || !cloneEl) return;
  if (originalEl.nodeType !== 1 || cloneEl.nodeType !== 1) return;
  var computed = window.getComputedStyle(originalEl);
  for (var i = 0; i < props.length; i++) {
    var prop = props[i];
    var val  = computed.getPropertyValue(prop);
    if (val) {
      cloneEl.style.setProperty(prop, val);
    }
  }
  var bgColor = computed.getPropertyValue('background-color');
  if (bgColor) {
    var bgRgb = _parseRGB(bgColor);
    if (!bgRgb || _isTransparent(bgColor)) {
      cloneEl.style.backgroundColor = 'transparent';
    } else if (bgRgb.r > 200 && bgRgb.g > 200 && bgRgb.b > 200) {
      cloneEl.style.backgroundColor = '#ffffff';
    } else {
      cloneEl.style.backgroundColor = isRoot ? '#ffffff' : 'transparent';
    }
  }
  var textColor = computed.getPropertyValue('color');
  if (textColor) {
    var textRgb = _parseRGB(textColor);
    if (!textRgb || textRgb.r > 100 || textRgb.g > 100 || textRgb.b > 100) {
      cloneEl.style.color = '#000000';
    } else {
      cloneEl.style.color = textColor;
    }
  }
  var tag = originalEl.tagName.toLowerCase();
  if (tag === 'td' || tag === 'th' || tag === 'table') {
    var borderProps = ['border-top', 'border-right', 'border-bottom', 'border-left', 'border'];
    for (var j = 0; j < borderProps.length; j++) {
      var bv = computed.getPropertyValue(borderProps[j]);
      if (bv) {
        cloneEl.style.setProperty(borderProps[j], bv);
      }
    }
  }
  cloneEl.removeAttribute('class');
}

function _fallbackCopy(htmlContent, plainText, callback) {
  var container = document.createElement('div');
  container.innerHTML = htmlContent;
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.opacity = '0';
  document.body.appendChild(container);
  var range = document.createRange();
  range.selectNodeContents(container);
  var sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  var ok = false;
  try {
    ok = document.execCommand('copy');
  } catch (e) {
    ok = false;
  }
  sel.removeAllRanges();
  document.body.removeChild(container);
  callback(ok);
}

function _isTransparent(colorStr) {
  if (!colorStr) return true;
  if (colorStr === 'transparent') return true;
  var m = colorStr.match(/rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*([\d.]+)\s*\)/);
  if (m && parseFloat(m[4]) === 0) return true;
  return false;
}

function _parseRGB(colorStr) {
  if (!colorStr) return null;
  var m = colorStr.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if (m) return { r: parseInt(m[1]), g: parseInt(m[2]), b: parseInt(m[3]) };
  if (colorStr.charAt(0) === '#') {
    var hex = colorStr.replace('#', '');
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    if (hex.length === 6) {
      return { r: parseInt(hex.substr(0,2),16), g: parseInt(hex.substr(2,2),16), b: parseInt(hex.substr(4,2),16) };
    }
  }
  return null;
}
