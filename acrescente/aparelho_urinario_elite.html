<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thi-Rads — Laudos estruturados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1a56db;--blue-dark:#1140a6;--blue-light:#e8f0fe;--blue-mid:#dbeafe;
  --surface:#f4f6fb;--border:#e2e6ef;--border-strong:#c8cfe0;
  --text:#1a1f2e;--text-2:#4b5570;--text-3:#8892a4;
  --white:#ffffff;--green:#059669;--red:#dc2626;--radius:8px;--radius-lg:12px;
}
body.dark{
  --blue:#4d86f5;--blue-dark:#3a6fd4;--blue-light:#1e2d4a;--blue-mid:#1e2d4a;
  --surface:#141820;--border:#2a2f3d;--border-strong:#3a4155;
  --text:#e2e6f0;--text-2:#9aa3b8;--text-3:#5d6680;
  --white:#1e2230;--green:#34d399;--red:#f87171;
}
body.dark .laudo-doc{color:#e2e6f0;}
body.dark .laudo-panel{background:#1e2230;border-left-color:var(--border);}
body.dark .laudo-body{background:#1e2230;}
body.dark .laudo-header{background:#1e2230;border-bottom-color:var(--border);}
@media print{ body.dark .laudo-doc, body.dark .laudo-doc *{color:#111 !important;} }
.btn-dark{margin-left:auto;}
body.dark .btn-dark{background:#2a2f3d;border-color:#3a4155;color:#e2e6f0;}
body.dark .btn-dark:hover{background:#343a4d;color:#fff;}
body.dark .dim-input,body.dark .ff select,body.dark .ff input[type=text],body.dark textarea{background:var(--white);color:var(--text);border-color:var(--border-strong);}
body.dark .radio-mark{background:var(--white);}
body.dark .check-box{background:var(--white);}
body.dark .sub-opts{background:#1a2040;border-bottom-color:#2a3460;}
body.dark .sub-opt-label{background:var(--white);color:var(--text-2);}
body.dark .lesao-card{background:#141820;border-color:var(--border);}
body.dark .toolbar{background:var(--white);border-bottom-color:var(--border);}
body.dark .sidebar{background:var(--white);border-right-color:var(--border);}
body.dark .sidebar-hd{border-bottom-color:var(--border);}
body.dark .block{background:var(--white);border-color:var(--border);}
body.dark .block-title{background:var(--white);border-bottom-color:var(--border);}
body.dark .radio-opt:hover{background:#1e2d4a;}
body.dark .radio-opt.selected{background:#1e2d4a;}
body.dark .check-row{background:#1a1f2e;}
body.dark .check-row:hover{background:#1e2d4a;}
body.dark .check-row.selected{background:#1e2d4a;}
body.dark .btn-add-lesao{background:var(--white);color:var(--text-2);border-color:var(--border-strong);}
body.dark .sel-tag{background:var(--white);color:var(--text);border-color:var(--border-strong);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:13px;background:var(--surface);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:10px;height:48px;flex-shrink:0;}
.logo{display:flex;align-items:baseline;gap:6px;margin-right:12px;}
.logo-name{font-size:17px;font-weight:600;color:var(--blue);letter-spacing:-.3px;}
.logo-sub{font-size:11px;color:var(--text-3);font-weight:400;letter-spacing:.2px;}
.tb-sep{width:1px;height:20px;background:var(--border);margin:0 4px;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid var(--border);font-weight:500;transition:all .13s;background:var(--white);color:var(--text-2);}
.btn:hover{background:var(--surface);border-color:var(--border-strong);color:var(--text);}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-primary:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.btn-danger{background:#fff5f5;color:var(--red);border-color:#fecaca;}
body.dark .btn-danger{background:#2d1a1a;border-color:#6b2929;}
.btn-danger:hover{background:#fee2e2;border-color:#fca5a5;}
.btn svg{width:13px;height:13px;flex-shrink:0;}
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:150px;background:var(--white);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;}
.sidebar-hd{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
.sidebar-tipo{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px;}
.sidebar-titulo{font-size:11px;font-weight:600;color:var(--text);}
.nav-group{padding:6px 0;}
.nav-item{display:flex;align-items:center;gap:7px;padding:7px 12px;font-size:11.5px;color:var(--text-2);cursor:pointer;transition:all .12s;border-left:2px solid transparent;}
.nav-item:hover{background:var(--blue-light);color:var(--blue);}
.nav-item.active{background:var(--blue-light);color:var(--blue);border-left-color:var(--blue);font-weight:600;}
.nav-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex-shrink:0;}
.nav-item.active .nav-dot{opacity:1;}
.panel{width:480px;flex-shrink:0;overflow-y:auto;padding:14px 14px 20px;background:var(--surface);}
.sec-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';display:block;width:3px;height:16px;background:var(--blue);border-radius:2px;}
.block{margin-bottom:10px;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;}
.block-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.7px;padding:8px 14px 7px;border-bottom:1px solid var(--border);background:var(--white);}
.radio-opt{display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;}
.radio-opt:last-child{border-bottom:none;}
.radio-opt:hover{background:#f5f8ff;}
.radio-opt.selected{background:var(--blue-light);}
.radio-opt input[type=radio]{position:absolute;opacity:0;pointer-events:none;}
.radio-label{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;font-size:12.5px;color:var(--text-2);line-height:1.4;cursor:pointer;}
.radio-opt.selected .radio-label{color:var(--blue);font-weight:500;}
.radio-mark{width:16px;height:16px;border-radius:50%;border:2px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.radio-opt:hover .radio-mark{border-color:var(--blue);}
.radio-opt.selected .radio-mark{border-color:var(--blue);background:var(--blue);}
.radio-mark::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff;opacity:0;transition:opacity .15s;}
.radio-opt.selected .radio-mark::after{opacity:1;}
.check-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);cursor:pointer;background:#fafbff;}
.check-row:last-child{border-bottom:none;}
.check-row:hover{background:#f0f5ff;}
.check-row.selected{background:#e6eeff;}
.check-row input[type=checkbox]{position:absolute;opacity:0;pointer-events:none;}
.check-label{display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px 8px 32px;font-size:12px;color:var(--text-2);cursor:pointer;}
.check-row.selected .check-label{color:var(--blue);font-weight:500;}
.check-box{width:15px;height:15px;border-radius:4px;border:2px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--white);}
.check-row:hover .check-box{border-color:var(--blue);}
.check-row.selected .check-box{border-color:var(--blue);background:var(--blue);}
.check-box svg{display:none;width:9px;height:9px;}
.check-row.selected .check-box svg{display:block;}
.sel-tag{font-size:11px;border:1px solid var(--border-strong);border-radius:5px;padding:2px 6px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);margin-left:5px;cursor:pointer;}
.dim-rows{padding:8px 14px;display:flex;flex-direction:column;gap:6px;}
.dim-row{display:flex;align-items:center;gap:10px;}
.dim-lbl{flex:1;font-size:12px;color:var(--text-2);}
.dim-input{width:60px;padding:5px 8px;border:1px solid var(--border-strong);border-radius:6px;font-size:12.5px;font-family:'DM Sans',sans-serif;text-align:center;color:var(--text);background:var(--white);transition:border .12s;}
.dim-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.08);}
.dim-unit{font-size:12px;color:var(--text-3);}
.lesoes-wrap{padding:8px 14px;display:flex;flex-direction:column;gap:7px;}
.btn-add-lesao{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;transition:all .12s;border:1.5px dashed var(--border-strong);background:var(--white);color:var(--text-2);width:100%;justify-content:center;}
.btn-add-lesao:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light);}
.lesao-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
.lesao-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.lesao-hd-title{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;}
.btn-rem{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:4px;font-size:10px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;border:1px solid #fecaca;background:#fff5f5;color:var(--red);transition:all .12s;}
.btn-rem:hover{background:#fee2e2;}
.ff-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.ff{display:flex;flex-direction:column;gap:2px;}
.ff label{font-size:9px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.ff select,.ff input[type=text]{font-size:11px;padding:4px 7px;border:1px solid var(--border-strong);border-radius:5px;font-family:'DM Sans',sans-serif;background:var(--white);color:var(--text);}
.ff select:focus,.ff input:focus{outline:none;border-color:var(--blue);}
.ff input[type=text]{width:58px;text-align:center;}
.laudo-panel{flex:1;min-width:0;background:var(--white);display:flex;flex-direction:column;border-left:1px solid var(--border);}
.laudo-header{padding:9px 20px 8px;border-bottom:1px solid var(--border);background:var(--white);display:flex;align-items:center;}
.laudo-header-title{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;}
.laudo-body{flex:1;overflow-y:auto;padding:22px 28px;}
.laudo-doc{font-family:Helvetica,Arial,sans-serif;font-size:10pt;line-height:1.65;color:#111;max-width:720px;}
.doc-titulo{text-align:center;font-weight:700;font-size:10pt;margin-bottom:16px;text-transform:uppercase;letter-spacing:.3px;}
.doc-label{font-weight:700;font-size:10pt;}
.doc-p{margin-bottom:8px;font-size:10pt;}
.doc-secao{margin-bottom:14px;}
textarea.achados{width:100%;height:100px;padding:10px;border:1px solid var(--border-strong);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:12px;resize:vertical;}
textarea.achados:focus{outline:none;border-color:var(--blue);}
.laudo-doc:focus { outline: none; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="logo" style="cursor:pointer" onclick="window.location.href='../laudo-thirads.html'"><span class="logo-name">THI-RADS</span><span class="logo-sub">laudo estruturado</span></div>
  <button class="btn" onclick="window.location.href='../laudo-thirads.html'"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2L4 8l6 6"/></svg>Voltar</button>
  <div class="tb-sep"></div>
  <button class="btn" onclick="copiar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>Copiar laudo</button>
  <button class="btn btn-primary" onclick="imprimir()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2M4 9h8M4 12v2h8v-2"/></svg>Imprimir</button>
  <button class="btn btn-dark" id="btn-dark-toggle" onclick="toggleDark()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro</button>
  <button class="btn btn-danger" onclick="reiniciar()"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 1 0 1.5-3.9M2 4v4h4"/></svg>Reiniciar</button>
</div>

<div class="body">
  <div class="sidebar">
    <div class="sidebar-hd"><div class="sidebar-tipo">Ultrassonografia</div><div class="sidebar-titulo">Aparelho Urinário</div></div>
    <div class="nav-group">
      <div class="nav-item" id="nav-rins" onclick="showSection('rins')"><span class="nav-dot"></span>Rins e Ureteres</div>
      <div class="nav-item" id="nav-bexiga" onclick="showSection('bexiga')"><span class="nav-dot"></span>Bexiga</div>
      <div class="nav-item" id="nav-volume" onclick="showSection('volume')"><span class="nav-dot"></span>Volume Vesical</div>
      <div class="nav-item" id="nav-adicionais" onclick="showSection('adicionais')"><span class="nav-dot"></span>Achados Adicionais</div>
    </div>
  </div>

  <div class="panel" id="main-panel"></div>

  <div class="laudo-panel">
    <div class="laudo-header"><span class="laudo-header-title">Pré-visualização</span></div>
    <div class="laudo-body"><div class="laudo-doc" id="laudo-doc" contenteditable="true"></div></div>
  </div>
</div>

<script>
const estado = {
  rins: {
    sit: 'habitual',
    ectopicoLado: 'direito',
    ectopicoLoc: 'fossa ilíaca direita',
    nefrecDir: false, nefrecEsq: false,
    afeccaoLado: 'bilateral',
    dimRD_L: '', espRD: '',
    dimRE_L: '', espRE: '',
    hidroDir: 'ausente', hidroEsq: 'ausente',
    ureterDir: false, ureterEsq: false,
    lesoes: []
  },
  bexiga: {
    sit: 'habitual',
    espParede: '',
    diverticulos: false,
    conteudoDebris: false,
    conteudoCoaguloMovel: false,
    conteudoCoaguloAderido: false, coaguloAderidoParede: 'parede posterior',
    conteudoCalculo: false, calculoX: '', calculoY: '', calculoZ: '',
    conteudoLesao: false, lesaoLoc: 'parede lateral direita', lesaoX: '', lesaoY: '', lesaoZ: '', lesaoFluxo: false, lesaoEco: 'hipoecogênica',
    conteudoBalao: false,
    jatos: 'nao_citar'
  },
  volume: {
    preL: '', preAP: '', preT: '',
    posL: '', posAP: '', posT: ''
  },
  adicionais: { texto: '' }
};

let secaoAtual = 'rins';
let lesaoId = 0;

function showSection(sec){
  secaoAtual = sec;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+sec).classList.add('active');
  renderPanel();
  updateLaudo();
}

function renderPanel(){
  const p = document.getElementById('main-panel');
  if(secaoAtual==='rins') p.innerHTML = renderRins();
  else if(secaoAtual==='bexiga') p.innerHTML = renderBexiga();
  else if(secaoAtual==='volume') p.innerHTML = renderVolume();
  else if(secaoAtual==='adicionais') p.innerHTML = renderAdicionais();
}

function radio(id, val, label, name, extra=''){
  const sel = estado[secaoAtual].sit === val ? 'selected' : '';
  return `<div class="radio-opt ${sel}" onclick="setSit('${val}')"><input type="radio" name="${name}"><label class="radio-label"><span class="radio-mark"></span>${label}${extra}</label></div>`;
}
function radioVal(sec, field, val, label, name, extra=''){
  const sel = estado[sec][field] === val ? 'selected' : '';
  return `<div class="radio-opt ${sel}" onclick="setVal('${sec}','${field}','${val}')"><input type="radio" name="${name}"><label class="radio-label"><span class="radio-mark"></span>${label}${extra}</label></div>`;
}
function chk(sec, field, label){
  const sel = estado[sec][field] ? 'selected' : '';
  return `<div class="check-row ${sel}" onclick="toggleChk('${sec}','${field}')"><input type="checkbox" ${estado[sec][field]?'checked':''}><label class="check-label"><span class="check-box"><svg viewBox="0 0 10 10" fill="none" stroke="#fff" stroke-width="1.8"><path d="M1.5 5l2.5 2.5 4.5-4.5"/></svg></span>${label}</label></div>`;
}
function dimInput(sec, field, label, unit='cm'){
  return `<div class="dim-row"><span class="dim-lbl">${label}</span><input class="dim-input" type="text" value="${estado[sec][field]}" placeholder="—" oninput="setTextVal('${sec}','${field}',this.value)"><span class="dim-unit">${unit}</span></div>`;
}
function selTag(opts, val, onchangeStr){
  return `<select class="sel-tag" onchange="${onchangeStr}" onclick="event.stopPropagation()">${opts.map(o=>`<option value="${o.v}" ${val===o.v?'selected':''}>${o.l}</option>`).join('')}</select>`;
}

// ── RINS ──
function renderRins(){
  const e = estado.rins;
  const isSit = (v) => e.sit===v ? 'selected' : '';
  const hdOpt = [{v:'ausente',l:'ausente'},{v:'discreta',l:'discreta'},{v:'moderada',l:'moderada'},{v:'acentuada',l:'acentuada'}];
  return `
  <div class="sec-title">Rins e Ureteres</div>
  <div class="block"><div class="block-title">Nefrectomia</div>
    ${chk('rins','nefrecDir','Nefrectomia Direita')}
    ${chk('rins','nefrecEsq','Nefrectomia Esquerda')}
  </div>
  <div class="block"><div class="block-title">Situação Geral</div>
    <div class="radio-opt ${isSit('habitual')}" onclick="setSit('habitual')"><label class="radio-label"><span class="radio-mark"></span>Habituais</label></div>
    <div class="radio-opt ${isSit('ectopico')}" onclick="setSit('ectopico')"><label class="radio-label"><span class="radio-mark"></span>Ectópico ${selTag([{v:'direito',l:'direito'},{v:'esquerdo',l:'esquerdo'}],e.ectopicoLado,"setVal('rins','ectopicoLado',this.value)")} em ${selTag([{v:'fossa ilíaca direita',l:'fossa ilíaca direita'},{v:'fossa ilíaca esquerda',l:'fossa ilíaca esquerda'},{v:'pelve',l:'pelve'}],e.ectopicoLoc,"setVal('rins','ectopicoLoc',this.value)")}</label></div>
    <div class="radio-opt ${isSit('ferradura')}" onclick="setSit('ferradura')"><label class="radio-label"><span class="radio-mark"></span>Em ferradura</label></div>
    <div class="radio-opt ${isSit('drpad')}" onclick="setSit('drpad')"><label class="radio-label"><span class="radio-mark"></span>Doença renal policística (DRPAD)</label></div>
    <div class="radio-opt ${isSit('insuf')}" onclick="setSit('insuf')"><label class="radio-label"><span class="radio-mark"></span>Insuficiência renal incipiente ${selTag([{v:'bilateral',l:'bilateral'},{v:'à direita',l:'à direita'},{v:'à esquerda',l:'à esquerda'}],e.afeccaoLado,"setVal('rins','afeccaoLado',this.value)")}</label></div>
    <div class="radio-opt ${isSit('aguda')}" onclick="setSit('aguda')"><label class="radio-label"><span class="radio-mark"></span>Nefropatia aguda ${selTag([{v:'bilateral',l:'bilateral'},{v:'à direita',l:'à direita'},{v:'à esquerda',l:'à esquerda'}],e.afeccaoLado,"setVal('rins','afeccaoLado',this.value)")}</label></div>
    <div class="radio-opt ${isSit('cronica')}" onclick="setSit('cronica')"><label class="radio-label"><span class="radio-mark"></span>Nefropatia crônica ${selTag([{v:'bilateral',l:'bilateral'},{v:'à direita',l:'à direita'},{v:'à esquerda',l:'à esquerda'}],e.afeccaoLado,"setVal('rins','afeccaoLado',this.value)")}</label></div>
  </div>
  ${!e.nefrecDir ? `<div class="block"><div class="block-title">Dimensões Rim Direito</div><div class="dim-rows">
    ${dimInput('rins','dimRD_L','Longitudinal')}
    ${dimInput('rins','espRD','Espessura Parênquima')}
  </div></div>` : ''}
  ${!e.nefrecEsq ? `<div class="block"><div class="block-title">Dimensões Rim Esquerdo</div><div class="dim-rows">
    ${dimInput('rins','dimRE_L','Longitudinal')}
    ${dimInput('rins','espRE','Espessura Parênquima')}
  </div></div>` : ''}
  
  <div class="block"><div class="block-title">Dilatação do Sistema Coletor (Hidronefrose)</div>
    ${!e.nefrecDir ? `<div style="padding:8px 14px 4px;"><label style="font-size:12px;color:var(--text-2);">À Direita:</label> ${selTag(hdOpt,e.hidroDir,"setVal('rins','hidroDir',this.value)")}</div>`:''}
    ${(!e.nefrecDir && e.hidroDir !== 'ausente') ? chk('rins','ureterDir','Dilatação ureteral à direita') : ''}
    ${!e.nefrecEsq ? `<div style="padding:8px 14px 4px;"><label style="font-size:12px;color:var(--text-2);">À Esquerda:</label> ${selTag(hdOpt,e.hidroEsq,"setVal('rins','hidroEsq',this.value)")}</div>`:''}

function renderVolume(){
  const e = estado.volume;
  const cv = (l,ap,t) => l&&ap&&t ? Math.round(parseFloat(l)*parseFloat(ap)*parseFloat(t)*0.52*1000) : 0;
  const volPre = cv(e.preL,e.preAP,e.preT);
  const volPos = cv(e.posL,e.posAP,e.posT);
  
  return `
  <div class="sec-title">Volume Vesical (Opcional)</div>

    ${dimInput('volume','posAP','Antero-posterior')}

}

function setSit(val){ estado.rins.sit = val; if(val==='drpad')estado.rins.lesoes=estado.rins.lesoes.filter(l=>l.tipo!=='cisto'); renderPanel(); updateLaudo(); }
function setVal(sec, field, val){ estado[sec][field] = val; renderPanel(); updateLaudo(); }
function setTextVal(sec, field, val){ estado[sec][field] = val; updateLaudo(); }
function toggleChk(sec, field){ estado[sec][field] = !estado[sec][field]; renderPanel(); updateLaudo(); }

function addLesaoRim(tipo){
  estado.rins.lesoes.push({
    id: ++lesaoId, tipo, lado: 'direito', loc: 'terço médio', agrup: 'unico',
    comp: 'simples', eco: 'hipoecoico', topo: 'cortical',
    m1: '', m2: '', m3: ''
  });
  renderPanel(); updateLaudo();
}
function remLesaoRim(id){ estado.rins.lesoes = estado.rins.lesoes.filter(l=>l.id!==id); renderPanel(); updateLaudo(); }
function updLesaoRim(id, field, val){ const l = estado.rins.lesoes.find(l=>l.id===id); if(l){l[field]=val; updateLaudo();} }

function medStr(l){
  const p = [l.m1,l.m2,l.m3].filter(m=>m&&m.trim()!=='');
  return p.length ? `medindo ${p.join(' x ')} cm` : '';
}
function medStrAprox(l){
  const p = [l.m1,l.m2,l.m3].filter(m=>m&&m.trim()!=='');
  return p.length ? `medindo cerca de ${p.join(' x ')} cm` : '';
}

// ── GERADOR DE LAUDO ──
function updateLaudo(){
  const eR = estado.rins;
  const eB = estado.bexiga;
  const eV = estado.volume;
  const eA = estado.adicionais;

  let analise = [];
  let opinioes = [];

  // RINS
  let fraseRins = '';
  let opRins = '';
  
  if(eR.nefrecDir && eR.nefrecEsq){
    fraseRins = 'Rins direito e esquerdo não caracterizados (status pós-operatório).';
    opRins = 'Status pós-nefrectomia bilateral.';
  } else {
    let preRins = '';
    
    // Situação Base
    if(eR.sit==='habitual'){
      if(eR.nefrecDir) { preRins = 'Rim direito não caracterizado (status pós-operatório). Rim esquerdo em topografia habitual, com dimensões usuais e contornos regulares.'; opRins = 'Status pós-nefrectomia direita.'; }
      else if(eR.nefrecEsq) { preRins = 'Rim esquerdo não caracterizado (status pós-operatório). Rim direito em topografia habitual, com dimensões usuais e contornos regulares.'; opRins = 'Status pós-nefrectomia esquerda.'; }
      else { preRins = 'Rins em topografia habitual, com dimensões usuais e contornos regulares.'; }
    } else if(eR.sit==='ectopico'){
      const outroLado = eR.ectopicoLado==='direito'?'esquerdo':'direito';
      if((eR.ectopicoLado==='direito'&&eR.nefrecEsq)||(eR.ectopicoLado==='esquerdo'&&eR.nefrecDir)){
        preRins = `Rim ${outroLado} não caracterizado (status pós-operatório). Rim ${eR.ectopicoLado} localizado em ${eR.ectopicoLoc}, com dimensões usuais e contornos regulares.`;
        opRins = `Rim ${eR.ectopicoLado} ectópico. Status pós-nefrectomia ${outroLado}.`;
      } else {
        preRins = `Rim ${eR.ectopicoLado} localizado em ${eR.ectopicoLoc}. Rim ${outroLado} em topografia habitual. Rins com dimensões usuais e contornos regulares.`;
        opRins = `Rim ${eR.ectopicoLado} ectópico.`;
      }
    } else if(eR.sit==='ferradura'){
      preRins = 'Rins apresentando desvio anterior do seu eixo de rotação assim como fusão de seus polos inferiores em topografia de linha média, anteriormente à aorta abdominal.';
      opRins = 'Rins em ferradura.';
    } else if(eR.sit==='drpad'){
      preRins = 'Rins em topografia habitual, com dimensões aumentadas e contornos lobulados. Presença de alteração ecotextural caracterizada por distorção arquitetural difusa à custa de múltiplos cistos dispersos por todo o parênquima renal bilateralmente, predominantemente corticais.';
      opRins = 'Achados ecográficos compatíveis com doença renal policística autossômica dominante.';
    } else if(eR.sit==='insuf'){
      preRins = `Rins em topografia habitual, com dimensões habituais e contornos lobulados.`;
      opRins = `Achados ecográficos sugestivos de insuficiência renal incipiente ${eR.afeccaoLado}.`;
    } else if(eR.sit==='aguda'){
      if(eR.afeccaoLado==='bilateral') preRins = `Rins em topografia habitual, com dimensões aumentadas e contornos regulares.`;
      else preRins = `Rins em topografia habitual, com contornos regulares. Rim ${eR.afeccaoLado.replace('à ','')} encontra-se com dimensões aumentadas, enquanto que o rim contralateral conserva dimensões.`;
      opRins = `Achados ecográficos compatíveis com nefropatia parenquimatosa aguda ${eR.afeccaoLado}.`;
    } else if(eR.sit==='cronica'){
      if(eR.afeccaoLado==='bilateral') preRins = `Rins em topografia habitual, com dimensões reduzidas e contornos regulares.`;
      else preRins = `Rins em topografia habitual, com contornos regulares. Rim ${eR.afeccaoLado.replace('à ','')} encontra-se com dimensões reduzidas, enquanto que o rim contralateral conserva dimensões.`;
      opRins = `Achados ecográficos compatíveis com nefropatia crônica ${eR.afeccaoLado}.`;
    }

    // Parenquima
    let parenquima = '';
    if(eR.sit==='drpad') parenquima = ''; // já coberto
    else if(eR.sit==='insuf') parenquima = ' Parênquima com espessura discretamente reduzida e diferenciação corticomedular mantida.';
    else if(eR.sit==='aguda') parenquima = ` Parênquima com espessura preservada e diferenciação corticomedular mantida. Observa-se aumento difuso da ecogenicidade cortical renal ${eR.afeccaoLado}.`;
    else if(eR.sit==='cronica'){
      if(eR.afeccaoLado==='bilateral') parenquima = ' Parênquima com espessura reduzida e perda da diferenciação corticomedular. Observa-se aumento difuso da ecogenicidade cortical renal bilateralmente.';
      else parenquima = ` Parênquima com espessura reduzida e perda da diferenciação corticomedular, associado a aumento difuso da ecogenicidade cortical renal ${eR.afeccaoLado}.`;
    }
    else parenquima = ' Parênquima com espessura preservada e diferenciação corticomedular mantida.';
    
    fraseRins = preRins + parenquima;
    
    // Dimensões opcionais
    let dimensoesStr = '';
    if(!eR.nefrecDir){
      if(eR.dimRD_L) dimensoesStr += `<br>O rim direito mede no eixo longitudinal: ${eR.dimRD_L} cm.`;
      if(eR.espRD) dimensoesStr += (eR.dimRD_L ? ' ' : '<br>') + `Espessura do parênquima do rim direito: ${eR.espRD} cm.`;
    }
    if(!eR.nefrecEsq){
      if(eR.dimRE_L) dimensoesStr += `<br>O rim esquerdo mede no eixo longitudinal: ${eR.dimRE_L} cm.`;
      if(eR.espRE) dimensoesStr += (eR.dimRE_L ? ' ' : '<br>') + `Espessura do parênquima do rim esquerdo: ${eR.espRE} cm.`;
    }

    // Lesões
    let calculosObstrutivosDir = false;
    let calculosObstrutivosEsq = false;
    if(eR.lesoes.length > 0){
      const descCalc = []; const descCisto = []; const descNod = [];
      eR.lesoes.forEach(l => {
        const ladoTxt = l.lado==='bilateral'?'bilateralmente':`à ${l.lado}`;
        if(l.tipo==='calculo'){
          const obs = ['junção ureteropiélica','junção ureterovesical','ureter proximal','ureter médio','ureter distal'].includes(l.loc);
          if(obs && ['direito','bilateral'].includes(l.lado)) calculosObstrutivosDir = true;
          if(obs && ['esquerdo','bilateral'].includes(l.lado)) calculosObstrutivosEsq = true;
          
          if(l.agrup==='unico'){
            descCalc.push(`cálculo ${obs?'obstrutivo':'não obstrutivo'} em ${l.loc} ${ladoTxt}${medStrAprox(l)?', '+medStrAprox(l):''}`);
            opinioes.push(obs ? `Cálculo obstrutivo em ${l.loc} ${ladoTxt}.` : `Nefrolitíase não obstrutiva ${ladoTxt}.`);
          } else {
            descCalc.push(`múltiplos cálculos${obs?'':' não obstrutivos'}, ${obs?'sendo o maior obstrutivo':'o maior localizado'} em ${l.loc} ${ladoTxt}${medStrAprox(l)?', '+medStrAprox(l):''}`);
            opinioes.push(obs ? `Múltiplos cálculos, o maior obstrutivo em ${l.loc} ${ladoTxt}.` : `Nefrolitíase não obstrutiva ${ladoTxt}.`);
          }
        }
        else if(l.tipo==='cisto'){
          if(l.agrup==='unico'){
            descCisto.push(`cisto ${l.comp} em ${l.loc} ${l.topo} ${ladoTxt}${medStrAprox(l)?', '+medStrAprox(l):''}`);
            opinioes.push(`Cisto renal ${ladoTxt}.`);
          } else {
            descCisto.push(`múltiplos cistos ${l.comp}s, o maior localizado em ${l.loc} ${l.topo} ${ladoTxt}${medStrAprox(l)?', '+medStrAprox(l):''}`);
            opinioes.push(`Cistos renais ${ladoTxt}.`);
          }
        }
        else if(l.tipo==='nodulo'){
          if(l.agrup==='unico'){
            descNod.push(`nódulo sólido, ${l.eco}, em ${l.loc} ${ladoTxt}${medStrAprox(l)?', '+medStrAprox(l):''}`);
            opinioes.push(`Nódulo renal sólido em rim ${l.lado==='bilateral'?'bilateral':l.lado}. Sugere-se, a critério clínico, prosseguimento da investigação com tomografia computadorizada ou ressonância magnética com contraste.`);
          } else {
            descNod.push(`múltiplos nódulos sólidos, o maior ${l.eco} em ${l.loc} ${ladoTxt}${medStrAprox(l)?', '+medStrAprox(l):''}`);
            opinioes.push(`Múltiplos nódulos renais sólidos ${ladoTxt}. Sugere-se, a critério clínico, prosseguimento da investigação.`);
          }
        }
      });
      const tds = [...descCalc, ...descCisto, ...descNod];
      if(tds.length === 1) {
        fraseRins += ' Destaca-se: ' + tds[0] + '.';
      } else if (tds.length > 1) {
        fraseRins += ' Destaca-se:<br>- ' + tds.join('<br>- ') + '.';
      }
    } else {
      fraseRins += ' Não há evidências de cálculos calicinais.';
    }

    // Hidronefrose
    let strHidro = '';
    const hD = eR.hidroDir, hE = eR.hidroEsq;
    const uD = eR.ureterDir ? ' associado a dilatação do ureter à direita' : '';
    const uE = eR.ureterEsq ? ' associado a dilatação do ureter à esquerda' : '';
    
    if(!eR.nefrecDir && !eR.nefrecEsq){
      if(hD==='ausente' && hE==='ausente') strHidro = ' Ausência de hidronefrose.';
      else if(hD===hE) {
        strHidro = ` ${hD.charAt(0).toUpperCase()+hD.slice(1)} dilatação do sistema coletor bilateralmente, sem caracterização de fator obstrutivo ao presente método${eR.ureterDir||eR.ureterEsq?', associado a dilatação ureteral':''}.`;
        if(!calculosObstrutivosDir && !calculosObstrutivosEsq) opinioes.push(`Dilatação do sistema coletor bilateralmente.`);
      }
      else if(hD!=='ausente' && hE!=='ausente'){
        strHidro = ` Dilatação do sistema coletor bilateralmente, sem caracterização de fator obstrutivo ao presente método, sendo ${hD} à direita e ${hE} à esquerda${eR.ureterDir||eR.ureterEsq?', associado a dilatação ureteral':''}.`;
        if(!calculosObstrutivosDir && !calculosObstrutivosEsq) opinioes.push(`Dilatação do sistema coletor bilateralmente.`);
      }
      else if(hD!=='ausente'){
        strHidro = ` ${hD.charAt(0).toUpperCase()+hD.slice(1)} dilatação do sistema coletor à direita, sem caracterização de fator obstrutivo ao presente método${uD}.`;
        if(!calculosObstrutivosDir) opinioes.push(`Dilatação do sistema coletor à direita.`);
        strHidro += ' Ausência de hidronefrose à esquerda.';
      }
      else if(hE!=='ausente'){
        strHidro = ` ${hE.charAt(0).toUpperCase()+hE.slice(1)} dilatação do sistema coletor à esquerda, sem caracterização de fator obstrutivo ao presente método${uE}.`;
        if(!calculosObstrutivosEsq) opinioes.push(`Dilatação do sistema coletor à esquerda.`);
        strHidro += ' Ausência de hidronefrose à direita.';
      }
    } else if(eR.nefrecEsq && !eR.nefrecDir){
      if(hD==='ausente') strHidro = ' Ausência de hidronefrose à direita.';
      else {
        strHidro = ` ${hD.charAt(0).toUpperCase()+hD.slice(1)} dilatação do sistema coletor à direita, sem caracterização de fator obstrutivo ao presente método${uD}.`;
        if(!calculosObstrutivosDir) opinioes.push(`Dilatação do sistema coletor à direita.`);
      }
    } else if(eR.nefrecDir && !eR.nefrecEsq){
      if(hE==='ausente') strHidro = ' Ausência de hidronefrose à esquerda.';
      else {
        strHidro = ` ${hE.charAt(0).toUpperCase()+hE.slice(1)} dilatação do sistema coletor à esquerda, sem caracterização de fator obstrutivo ao presente método${uE}.`;
        if(!calculosObstrutivosEsq) opinioes.push(`Dilatação do sistema coletor à esquerda.`);
      }
    }
    if(strHidro) {
      fraseRins += '<br>' + strHidro.trim();
    }
    
    if(dimensoesStr) {
      fraseRins += '<br>' + dimensoesStr;
    }
  }
  
  if(opRins) opinioes.unshift(opRins); // coloca no topo das opiniões

  // BEXIGA
  let fraseBexiga = '';
  if(eB.sit==='vazia'){
    fraseBexiga = 'Bexiga vazia, limitando a sua adequada avaliação ecográfica.';
  } else if (eB.sit==='baixa_replecao') {
    fraseBexiga = 'Bexiga urinária com conteúdo anecóide de baixa repleção, limitando a sua adequada avaliação ecográfica.';
  } else {
    let hasEspecial = eB.conteudoCoaguloMovel || eB.conteudoCoaguloAderido || eB.conteudoLesao || eB.conteudoCalculo;
    
    if (!hasEspecial) {
      const distStr = eB.sit==='habitual'?'distensão adequada':eB.sit==='parcial'?'distensão parcial':'distensão adequada';
      let parStr = 'parede com espessura normal';
      if(eB.sit==='espessada'){
        parStr = `paredes com espessura aumentada${eB.espParede?', medindo até '+eB.espParede+' cm':''}`;
        if(eB.diverticulos) {
          parStr += '. Presença de divertículos parietais';
          opinioes.push('Espessamento parietal vesical difuso (associado a divertículos).');
        } else {
          opinioes.push('Espessamento parietal vesical difuso.');
        }
      }
      
      let contBase = 'conteúdo homogêneo';
      let destConteudo = [];
      if(eB.conteudoDebris){
        contBase = 'ecos em suspensão';
        opinioes.push('Bexiga contendo debris em seu interior.');
      }
      if(eB.conteudoBalao){
        destConteudo.push('balonete de sonda vesical');
        opinioes.push('Bexiga contendo balonete de sonda em seu interior.');
      }

      fraseBexiga = `Bexiga com ${distStr}, apresentando contornos regulares, ${parStr} e ${contBase}.`;
      if(destConteudo.length>0) fraseBexiga += ' Destaca-se em seu interior: ' + destConteudo.join('; ') + '.';
    } else {
      if (!eB.conteudoCoaguloMovel && !eB.conteudoCoaguloAderido) {
        const distStr = eB.sit==='habitual'?'distensão adequada':eB.sit==='parcial'?'distensão parcial':'distensão adequada';
        let parStr = 'parede com espessura normal';
        if(eB.sit==='espessada'){
          parStr = `paredes com espessura aumentada${eB.espParede?', medindo até '+eB.espParede+' cm':''}`;
          if(eB.diverticulos) {
            parStr += '. Presença de divertículos parietais';
            opinioes.push('Espessamento parietal vesical difuso (associado a divertículos).');
          } else {
            opinioes.push('Espessamento parietal vesical difuso.');
          }
        }
        let contBase = 'conteúdo homogêneo';
        if(eB.conteudoDebris){
          contBase = 'ecos em suspensão';
          opinioes.push('Bexiga contendo debris em seu interior.');
        }
        fraseBexiga = `Bexiga com ${distStr}, apresentando contornos regulares, ${parStr} e ${contBase}. `;
      }

      if (eB.conteudoCoaguloMovel) {
        fraseBexiga += 'Bexiga urinária de forma e capacidade conservadas, com presença de conteúdo hipoecogênico e amorfo no seu interior, móvel à mudança de decúbito, sem fluxo ao estudo complementar com Doppler, que pode corresponder a coágulos sanguíneos ou a sedimento de outra natureza. ';
        opinioes.push('Achados sugestivos de coágulo vesical e/ou sedimento de outra natureza.');
      }
      if (eB.conteudoCoaguloAderido) {
        let paredeCoagulo = eB.coaguloAderidoParede === 'assoalho vesical' ? 'ao seu assoalho vesical' : `à sua ${eB.coaguloAderidoParede || 'parede'}`;
        fraseBexiga += `Bexiga de paredes levemente espessadas, apresentando material amorfo e heterogêneo, aderido ${paredeCoagulo}, imóvel a mudança de decúbito, sem fluxo ao estudo complementar com Doppler, sugestivo de coágulo aderido, na dependência de dados clínicos e laboratoriais. A critério correlacionar com cistoscopia. `;
        opinioes.push('Achados sugestivos de coágulo vesical aderido à parede vesical.');
      }
      if (eB.conteudoCalculo) {
        let medCalc = [eB.calculoX, eB.calculoY, eB.calculoZ].filter(m=>m).join(' x ');
        let medStrCalc = medCalc ? `medindo ${medCalc} cm` : 'medindo * cm';
        fraseBexiga += `Caracteriza-se no interior da bexiga formação arredondada, de limites precisos, contornos regulares, hiperecogênica, com sombra acústica posterior, móvel com a mudança de decúbito, ${medStrCalc}, sugestiva de cálculo. `;
        opinioes.push('Litíase vesical.');
      }
      if (eB.conteudoLesao) {
        const cvx = (l,ap,t) => l&&ap&&t ? (parseFloat(l)*parseFloat(ap)*parseFloat(t)*0.52).toFixed(1).replace('.',',') : null;
        const volLesao = cvx(eB.lesaoX, eB.lesaoY, eB.lesaoZ);
        const fluxo = eB.lesaoFluxo ? 'com fluxo' : 'sem fluxo';
        let locLesao = eB.lesaoLoc === 'assoalho vesical' ? 'No assoalho vesical' : `Na ${eB.lesaoLoc || 'parede lateral direita'}`;
        fraseBexiga += `${locLesao}, caracteriza-se formação nodular sólida, ${eB.lesaoEco}, de contornos arredondados, ${fluxo} ao estudo complementar com Doppler, imóvel às mudanças de decúbito, medindo ${eB.lesaoX || 'A'} x ${eB.lesaoY || 'B'} x ${eB.lesaoZ || 'C'} cm e volume de ${volLesao || 'x'} cm³. `;
        opinioes.push('Achados sugestivos de massa/pólipo vesical, sendo conveniente prosseguir investigação diagnóstica.');
      }
      
      let outrasCoisas = [];
      if(eB.conteudoBalao){
        outrasCoisas.push('balonete de sonda vesical');
        opinioes.push('Bexiga contendo balonete de sonda em seu interior.');
      }
      if(outrasCoisas.length > 0) {
        fraseBexiga += ' Destaca-se também: ' + outrasCoisas.join('; ') + '.';
      }
    }

    // Jatos
    if(eB.jatos==='simetricos') fraseBexiga += ' Jatos ureterais presentes e simétricos.';
    else if(eB.jatos==='reduzido_d') { fraseBexiga += ' Jatos ureterais presentes, assimétricos, reduzidos à direita.'; opinioes.push('Jatos ureterais reduzidos à direita.'); }
    else if(eB.jatos==='reduzido_e') { fraseBexiga += ' Jatos ureterais presentes, assimétricos, reduzidos à esquerda.'; opinioes.push('Jatos ureterais reduzidos à esquerda.'); }
    else if(eB.jatos==='nao_caracterizados') { fraseBexiga += ' Jatos ureterais não caracterizados.'; }
  }

  // VOLUMES
  const cv = (l,ap,t) => l&&ap&&t ? Math.round(parseFloat(l)*parseFloat(ap)*parseFloat(t)*0.52*1000) : 0;
  const vPre = cv(eV.preL,eV.preAP,eV.preT);
  const vPos = cv(eV.posL,eV.posAP,eV.posT);
  let fraseVol = '';

  if(vPre>0) fraseVol += `Volume vesical pré-miccional estimado em ${vPre} mL. `;
  
  if(eV.posL){
    if(vPos===0) fraseVol += 'Resíduo vesical pós-miccional ausente.';
    else if(vPos<=30) fraseVol += 'Resíduo vesical pós-miccional desprezível.';
    else if(vPos>30 && vPos<=80) { fraseVol += `Resíduo vesical pós-miccional pequeno (${vPos} mL).`; opinioes.push('Resíduo pós-miccional pequeno.'); }
    else if(vPos>80 && vPos<=150) { fraseVol += `Resíduo vesical pós-miccional moderado (${vPos} mL).`; opinioes.push('Resíduo pós-miccional moderado.'); }
    else if(vPos>150 && vPos<=300) { fraseVol += `Resíduo vesical pós-miccional acentuado (${vPos} mL).`; opinioes.push('Resíduo pós-miccional acentuado.'); }
    else if(vPos>300) { fraseVol += `Resíduo vesical pós-miccional muito acentuado (${vPos} mL).`; opinioes.push('Resíduo pós-miccional muito acentuado.'); }
  }

  // ADICIONAIS
  let adic = eA.texto.trim() ? `<div class="doc-p">Achados adicionais: ${eA.texto}</div>` : '';

  // CONCLUSÃO FINAL
  let opFinal = '';
  if(opinioes.length===0){
    opFinal = 'Estudo ecográfico sem evidentes anormalidades apreciáveis ao método.';
  } else {
    // Unique
    opinioes = [...new Set(opinioes)];
    opFinal = opinioes.join('<br>') + '<br>Demais estruturas sem evidentes anormalidades apreciáveis ao método.';
  }

  document.getElementById('laudo-doc').innerHTML=`
    <div class="doc-titulo">ULTRASSONOGRAFIA DO APARELHO URINÁRIO</div>
    <div class="doc-secao">
      <span class="doc-label">TÉCNICA:</span>
      <div class="doc-p">Exame realizado em aparelho dinâmico com transdutor convexo por via abdominal.</div>
    </div>
    <div class="doc-secao">
      <span class="doc-label">ANÁLISE:</span>
      <div class="doc-p">${fraseRins}</div>
      <div class="doc-p">${fraseBexiga}</div>
      ${fraseVol ? `<div class="doc-p">${fraseVol}</div>` : ''}
      ${adic}
    </div>
    <div class="doc-secao">
      <span class="doc-label">IMPRESSÃO DIAGNÓSTICA:</span>
      <div class="doc-p">${opFinal}</div>
    </div>`;
}

function toggleDark(){
  const isDark = document.body.classList.toggle('dark');
  const btn = document.getElementById('btn-dark-toggle');
  if(isDark) btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8.5A5.5 5.5 0 0 1 6 3c0-.18.01-.36.03-.53A6 6 0 1 0 13.97 9.5c-.15.01-.31.01-.47 0z"/></svg>Modo claro';
  else btn.innerHTML='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1v1M8 14v1M1 8H2M14 8h1M3.05 3.05l.7.7M12.25 12.25l.7.7M3.05 12.95l.7-.7M12.25 3.75l.7-.7M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>Modo escuro';
  localStorage.setItem('darkMode', isDark ? '1' : '0');
}
(function(){ if(localStorage.getItem('darkMode')==='1') toggleDark(); })();

function copiar() {
  const isDark = document.body.classList.contains('dark');
  if (isDark) document.body.classList.remove('dark');
  
  const el = document.getElementById('laudo-doc');
  const range = document.createRange();
  range.selectNodeContents(el);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  
  let success = false;
  try {
    success = document.execCommand('copy');
  } catch (err) {
  }
  
  selection.removeAllRanges();
  if (isDark) document.body.classList.add('dark');
  
  if (success) {
    showToast('Laudo copiado para a área de transferência!');
  } else {
    showToast('Falha ao copiar. Use Ctrl+A e Ctrl+C no texto do laudo.');
  }
}

function showToast(msg) {
  let t = document.getElementById('toast-notification');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

</style></head><body>${h}

}

  estado.bexiga = { sit: 'habitual', espParede: '', diverticulos: false, conteudoDebris: false, conteudoCoaguloMovel: false, conteudoCoaguloAderido: false, coaguloAderidoParede: 'parede posterior', conteudoCalculo: false, calculoX: '', calculoY: '', calculoZ: '', conteudoLesao: false, lesaoLoc: 'parede lateral direita', lesaoX: '', lesaoY: '', lesaoZ: '', lesaoFluxo: false, lesaoEco: 'hipoecogênica', conteudoBalao: false, jatos: 'nao_citar' };
