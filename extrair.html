<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Extrair Conteúdos</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        textarea { width: 100%; height: 400px; font-size: 12px; }
        button { padding: 10px 20px; margin: 10px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Gerar JSON das Máscaras</h1>
    <p>Cole todo o conteúdo do arquivo <b>MscarasUltrassom.html</b> na caixa abaixo e clique em "Extrair".</p>
    <textarea id="htmlInput" placeholder="Cole aqui o HTML do arquivo MscarasUltrassom.html..."></textarea>
    <br>
    <button onclick="extrair()">Extrair JSON</button>

    <h2>JSON gerado:</h2>
    <textarea id="jsonOutput" readonly></textarea>
    <br>
    <button onclick="copiarJSON()">📋 Copiar JSON</button>
    <p id="msg"></p>

    <script>

            { id: "h.xpashcs4buk4", nome: "Parotidite (Superficial)" },
            { id: "h.qavo5hwhf4vg", nome: "Região Axilar" },

            { id: "h.23484nvmx701", nome: "Pélvica - Histerectomia" },

            { id: "h.i5rfm6z2upeb", nome: "Agenda - BIRADS" },
            { id: "h.ol1wgtnjd1tu", nome: "Mama Masculina" },
            { id: "h.v66sv8nk3xfr", nome: "Mastite / Abscesso" },
            { id: "h.ieh2hs3g0w8d", nome: "Mamas PS Normal" },
            { id: "h.n447mtt6lqzi", nome: "Tórax" }
        ];

        function extrair() {
            const htmlStr = document.getElementById('htmlInput').value;
            if (!htmlStr.trim()) {
                alert('Cole o HTML do arquivo MscarasUltrassom.html primeiro!');
                return;
            }
            // Cria um DOM temporário
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlStr, 'text/html');

            const resultado = exames.map(({id, nome}) => {
                const el = doc.getElementById(id);
                if (!el) return { nome, conteudo: '<p>Seção não encontrada</p>' };
                let html = el.innerHTML;
                // Limpeza: remove spans, mantendo o texto interno e tags como p, h1, table
                html = html.replace(/<span[^>]*>/g, '').replace(/<\/span>/g, '');
                html = html.replace(/<p [^>]*>/g, '<p>');
                html = html.replace(/<h1 [^>]*>/g, '<h1>');
                html = html.replace(/<table [^>]*>/g, '<table>');
                html = html.replace(/<td [^>]*>/g, '<td>');
                html = html.replace(/<tr [^>]*>/g, '<tr>');
                return { nome, conteudo: html };
            });

            const jsonStr = JSON.stringify(resultado, null, 2);
            document.getElementById('jsonOutput').value = jsonStr;
            document.getElementById('msg').textContent = '';
        }

        function copiarJSON() {
            const jsonOutput = document.getElementById('jsonOutput');
            jsonOutput.select();
            document.execCommand('copy');
            document.getElementById('msg').textContent = 'JSON copiado!';
        }
    </script>
</body>
