<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THI-RADS - Máscaras Estruturadas</title>
    <style>
        :root {
            --bg: #0a0f1e;
            --card-bg: rgba(255,255,255,0.06);
            --card-border: rgba(255,255,255,0.1);
            --text-color: #e0e6f0;
            --subtext-color: #b0b8c8;
            --search-bg: rgba(255,255,255,0.08);
            --search-border: rgba(255,255,255,0.15);
            --glow: #4fc3f7;
            --accent: #29b6f6;
            --bar-bg: rgba(10,15,30,0.8);
            --bar-text: #e0e6f0;
            --bar-subtext: #b0b8c8;
            --categoria-bg: rgba(79,195,247,0.1);
            --categoria-text: #4fc3f7;
        }
        body.light-mode {
            --bg: #f0f4f8;
            --card-bg: rgba(255,255,255,0.7);
            --card-border: rgba(0,0,0,0.1);
            --text-color: #1a2a3a;
            --subtext-color: #4a5568;
            --search-bg: white;
            --search-border: #cbd5e0;
            --glow: #0288d1;
            --accent: #0277bd;
            --bar-bg: rgba(255,255,255,0.8);
            --bar-text: #1a2a3a;
            --bar-subtext: #4a5568;
            --categoria-bg: rgba(2,136,209,0.08);
            --categoria-text: #0288d1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(79,195,247,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(2,136,209,0.06) 0%, transparent 50%);
            min-height: 100vh;
            transition: background 0.5s, color 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 110px;
            color: var(--text-color);
        }

        .top-logo {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: var(--bar-bg); backdrop-filter: blur(15px);
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            gap: 6px; transition: background 0.5s;
            border-bottom: 1px solid var(--card-border);
        }
        .logo-texto { font-size: 1.8em; font-weight: 700; color: var(--bar-text); letter-spacing: 2px; transition: color 0.5s; }
        .logo-sub { font-size: 0.85em; font-weight: 400; color: var(--bar-subtext); margin-left: 4px; transition: color 0.5s; white-space: nowrap; }

        .top-bar {
            position: fixed; top: 80px; right: 20px; display: flex; gap: 12px; z-index: 1001;
        }
        .icon-btn {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--card-border); border-radius: 50%;
            width: 45px; height: 45px; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-color); transition: all 0.3s;
        }
        .icon-btn:hover { background: var(--accent); color: white; border-color: var(--accent); transform: scale(1.08); }

        .container { max-width: 1300px; width: 100%; }

        h1 {
            text-align: center; font-size: 2.5em; font-weight: 700;
            background: linear-gradient(135deg, var(--glow), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 5px;
        }
        .subtitulo { text-align: center; color: var(--subtext-color); font-size: 1.1em; margin-bottom: 35px; }

        .search-wrapper { display: flex; justify-content: center; margin-bottom: 45px; }
        .search-input {
            width: 100%; max-width: 550px; padding: 14px 24px;
            font-size: 1.05em; border: 2px solid var(--search-border);
            border-radius: 40px; background: var(--search-bg);
            backdrop-filter: blur(10px); color: var(--text-color); outline: none;
            transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .search-input:focus { border-color: var(--glow); box-shadow: 0 0 20px rgba(79,195,247,0.3); }
        .search-input::placeholder { color: var(--subtext-color); opacity: 0.7; }

        /* Categorias */
        .categoria-secao { margin-bottom: 40px; }
        .categoria-titulo {
            font-size: 1.4em; font-weight: 700;
            color: var(--categoria-text);
            background: var(--categoria-bg);
            padding: 8px 20px; border-radius: 30px;
            display: inline-block; margin-bottom: 20px;
            border: 1px solid var(--glow);
            letter-spacing: 1px;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 25px;
            justify-items: center;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px; padding: 35px 20px;
            width: 100%; cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
            text-align: center;
            position: relative; overflow: hidden;
            color: var(--text-color);
        }
        .card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 0%, var(--glow), transparent 70%);
            opacity: 0; transition: opacity 0.4s;
        }
        .card:hover::before { opacity: 0.08; }
        .card:hover {
            transform: translateY(-8px);
            border-color: var(--glow);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 30px rgba(79,195,247,0.2);
        }
        .card-icone {
            width: 64px; height: 64px; margin: 0 auto 15px auto;
            position: relative; z-index: 1;
            color: var(--glow);
            filter: drop-shadow(0 0 8px rgba(79,195,247,0.5));
            display: flex; align-items: center; justify-content: center;
        }
        .card-icone svg {
            width: 100%; height: 100%;
            stroke: currentColor; fill: none;
            stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }
        .card h3 {
            font-size: 1.1em; font-weight: 600; margin: 0;
            position: relative; z-index: 1;
        }
        .hidden { display: none; }

        .logout-btn {
            background: none; border: 2px solid var(--accent); color: var(--accent);
            padding: 10px 24px; border-radius: 30px; cursor: pointer; font-weight: 600;
            margin-top: 30px; transition: all 0.3s; display: inline-block;
        }
        .logout-btn:hover { background: var(--accent); color: white; }

        @media (max-width: 600px) {
            .cards-grid { grid-template-columns: 1fr; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>

                exames: [

                    { nome: "GLÂNDULAS SALIVARES", icone: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M26 12 C 16 12, 12 28, 12 40 C 12 50, 20 56, 32 56 C 44 56, 52 50, 52 40 C 52 28, 48 12, 38 12"/><path d="M16 32 C 16 26, 24 24, 26 30 C 28 36, 20 40, 16 32 Z"/><path d="M48 32 C 48 26, 40 24, 38 30 C 36 36, 44 40, 48 32 Z"/><path d="M22 46 C 22 42, 28 42, 30 46 C 32 50, 26 52, 22 46 Z"/><path d="M42 46 C 42 42, 36 42, 34 46 C 32 50, 38 52, 42 46 Z"/><path d="M26 34 L 28 42 M 38 34 L 36 42"/></svg>` }
                 ]
            },
            {
                nome: "Mamas",
                exames: [
                    { nome: "MAMAS", icone: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M14 16 C 14 30, 6 42, 18 52 C 26 58, 30 48, 28 40 C 24 26, 26 18, 14 16 Z"/><path d="M50 16 C 50 30, 58 42, 46 52 C 38 58, 34 48, 36 40 C 40 26, 38 18, 50 16 Z"/><circle cx="10" cy="42" r="1.5" fill="currentColor"/><circle cx="54" cy="42" r="1.5" fill="currentColor"/><path d="M20 28 C 16 32, 16 40, 20 44"/><path d="M44 28 C 48 32, 48 40, 44 44"/></svg>` },
                    { nome: "MAMAS E AXILAS", icone: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M16 20 C 16 34, 8 46, 20 56 C 28 62, 32 52, 30 44 C 26 30, 28 22, 16 20 Z"/><path d="M48 20 C 48 34, 56 46, 44 56 C 36 62, 32 52, 34 44 C 38 30, 36 22, 48 20 Z"/><circle cx="12" cy="46" r="1.5" fill="currentColor"/><circle cx="52" cy="46" r="1.5" fill="currentColor"/><path d="M14 14 C 18 10, 22 14, 18 18 C 14 22, 10 18, 14 14 Z"/><path d="M50 14 C 46 10, 42 14, 46 18 C 50 22, 54 18, 50 14 Z"/><path d="M16 16 L 22 22 M 48 16 L 42 22"/></svg>` }
                 ]
            },
            {
                nome: "Partes Moles",
                exames: [
                    { nome: "PARTES MOLES", icone: `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg"><path d="M12 24 C 24 16, 40 16, 52 24"/><path d="M12 34 C 24 26, 40 26, 52 34"/><path d="M12 44 C 24 36, 40 36, 52 44"/><path d="M22 20 L 16 42 M 32 20 L 26 42 M 42 20 L 36 42"/><path d="M26 12 C 30 8, 34 8, 38 12"/></svg>` }
                 ]
            }
        ];

        const container = document.getElementById("categoriasContainer");

        function criarCategorias() {
            container.innerHTML = "";
            categorias.forEach(categoria => {
                const secao = document.createElement("div");
                secao.className = "categoria-secao";
                secao.innerHTML = `<div class="categoria-titulo">${categoria.nome}</div>`;

                const grid = document.createElement("div");
                grid.className = "cards-grid";

                categoria.exames.forEach(exame => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.setAttribute("data-exame", exame.nome);
                    card.innerHTML = `
                        <div class="card-icone">${exame.icone}</div>
                        <h3>${exame.nome}</h3>
                    `;
                    card.onclick = () => abrirLaudo(exame.nome);
                    grid.appendChild(card);
                });

                secao.appendChild(grid);
                container.appendChild(secao);
            });
        }

        function abrirLaudo(exame) {
            if (exame === 'OBSTÉTRICO 1 TRIMESTRE') {
                window.location.href = 'app-obstetrico.html?modo=inicial';
            } else if (exame === 'OBSTÉTRICO 2/3 TRIMESTRE') {
                window.location.href = 'app-obstetrico.html?modo=sem-doppler';
            } else if (exame === 'OBSTÉTRICO COM DOPPLER') {
                window.location.href = 'app-obstetrico.html?modo=doppler';
            } else if (exame === 'ABDOME TOTAL') {
                window.location.href = 'acrescente/abdome-total_elite (2).html';
            } else if (exame === 'ABDOME SUPERIOR') {
                window.location.href = 'acrescente/abdome_superior_elite.html';
            } else if (exame === 'PAREDE ABDOMINAL') {
                window.location.href = 'acrescente/parede abdominal elite.html';
            } else if (exame === 'TRANSVAGINAL') {
                window.location.href = 'acrescente/ustransvaginal.html';
            } else if (exame === 'APARELHO URINÁRIO') {
                window.location.href = 'acrescente/aparelho_urinario_elite.html';
            } else if (exame === 'PÉLVICO ABDOMINAL') {
                window.location.href = 'acrescente/pelvico_abdominal_elite.html';
            } else if (exame === 'BOLSA ESCROTAL') {
                window.location.href = 'acrescente/bolsa_escrotal_elite.html';
            } else if (exame === 'BOLSA ESCROTAL COM DOPPLER') {
                window.location.href = 'acrescente/bolsa escrotal com doppler.html';
            } else if (exame === 'CARÓTIDAS') {
                window.location.href = 'acrescente/carotidas.html';
            } else if (exame === 'TVP MEMBROS INF') {
                window.location.href = 'acrescente/thirads-venoso-corrigido.html';
            } else if (exame === 'ARTERIAL DE MEMBROS') {
                window.location.href = 'acrescente/arterial-mmii.html';
            } else if (exame === 'CERVICAL') {
                window.location.href = 'acrescente/cervical_elite.html';
            } else if (exame === 'CERVICAL LINFONODOS') {
                window.location.href = 'acrescente/cervical_linfonodos_elite.html';
            } else if (exame === 'TIREOIDE') {
                window.location.href = 'acrescente/tireoide elite.html';
            } else if (exame === 'GLÂNDULAS SALIVARES') {
                window.location.href = 'acrescente/glandulas_salivares_elite.html';
            } else if (exame === 'MAMAS' || exame === 'MAMAS E AXILAS') {
                window.location.href = 'acrescente/mamas_elite.html';
            } else if (exame === 'PARTES MOLES') {
                window.location.href = 'acrescente/partes_moles_elite.html';
            } else {
                alert('O módulo para "' + exame + '" está em desenvolvimento e estará disponível em breve!');
            }
        }

        function removerAcentos(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function filtrarCards() {
            const termo = removerAcentos(document.getElementById("searchInput").value.toLowerCase().trim());
            const secoes = document.querySelectorAll(".categoria-secao");
            secoes.forEach(secao => {
                const cards = secao.querySelectorAll(".card");
                let algumVisivel = false;
                cards.forEach(card => {
                    const nomeExame = removerAcentos(card.getAttribute("data-exame").toLowerCase());
                    if (nomeExame.includes(termo)) {
                        card.classList.remove("hidden");
                        algumVisivel = true;
                    } else {
                        card.classList.add("hidden");
                    }
                });
                secao.classList.toggle("hidden", !algumVisivel);
            });
        }

        // Tema (padrão escuro)
        const body = document.body;
        const themeBtn = document.getElementById("themeBtn");
        const temaSalvo = localStorage.getItem("tema-thirads") || "dark";
        
        const iconeSol = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
        const iconeLua = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

        if (temaSalvo === "light") {
            body.classList.add("light-mode");
            themeBtn.innerHTML = iconeLua;
        } else {
            themeBtn.innerHTML = iconeSol;
        }
        function alternarTema() {
            body.classList.toggle("light-mode");
            if (body.classList.contains("light-mode")) {
                localStorage.setItem("tema-thirads", "light");
                themeBtn.innerHTML = iconeLua;
            } else {
                localStorage.setItem("tema-thirads", "dark");
                themeBtn.innerHTML = iconeSol;
            }
        }

        criarCategorias();
    </script>
</body>
</html>
